const host=document.querySelector('#scene');host.style.width=width+'px';host.style.height=height+'px';const scene=new T.Scene(),model={thor:createThor,loki:createLoki,odin:createOdin}[id](T);model.root.scale.setScalar(id==='odin'?.53:.86);if(id==='odin'){model.root.scale.set(.40,.65,.40);model.root.rotation.x=.18;model.hero.scale.setScalar(1.35);}scene.add(model.root);const council=createRealm(T,scene,id);scene.add(new T.AmbientLight(0xffffff,.8));const light=new T.DirectionalLight(0xffe9d0,1);light.position.set(-4,10,6);scene.add(light);
