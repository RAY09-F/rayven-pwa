<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYVEN — Fullscreen Sphere — Stage 1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050505; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; }
  #label { position: fixed; top: 16px; left: 16px; color: #aaa; font-family: monospace; font-size: 12px; letter-spacing: 2px; z-index: 5; }
</style>
</head>
<body>
<div id="label">STAGE 1 — FULLSCREEN SPHERE (geometry check, no theme yet)</div>
<canvas id="sphereCanvas"></canvas>
<script>
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const SEED_COUNT = 320;
const SUBDOTS_PER_SEED = 7;

// Sphere radius scales with the screen so it always fills a good portion of the view
function getSphereRadius() {
  return Math.min(window.innerWidth, window.innerHeight) * 0.28;
}

let SPHERE_RADIUS = getSphereRadius();
window.addEventListener('resize', () => { SPHERE_RADIUS = getSphereRadius(); });

const points = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

for (let i = 0; i < SEED_COUNT; i++) {
  const y = 1 - (i / (SEED_COUNT - 1)) * 2;
  const radiusAtY = Math.sqrt(1 - y * y);
  const theta = goldenAngle * i;
  const sx = Math.cos(theta) * radiusAtY;
  const sz = Math.sin(theta) * radiusAtY;
  const sy = y;

  for (let k = 0; k < SUBDOTS_PER_SEED; k++) {
    const jitter = 0.035;
    points.push({
      ux: sx + (Math.random() - 0.5) * jitter,
      uy: sy + (Math.random() - 0.5) * jitter,
      uz: sz + (Math.random() - 0.5) * jitter
    });
  }
}

let angleY = 0;
let angleX = 0.3;

function rotateY(x, y, z, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return { x: x * cos - z * sin, y: y, z: x * sin + z * cos };
}
function rotateX(x, y, z, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return { x: x, y: y * cos - z * sin, z: y * sin + z * cos };
}

function render() {
  ctx.fillStyle = 'rgba(5,5,5,0.35)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const perspective = SPHERE_RADIUS * 2.6;

  const projected = points.map(p => {
    const px = p.ux * SPHERE_RADIUS;
    const py = p.uy * SPHERE_RADIUS;
    const pz = p.uz * SPHERE_RADIUS;

    let r = rotateY(px, py, pz, angleY);
    r = rotateX(r.x, r.y, r.z, angleX);

    const scale = perspective / (perspective + r.z);
    return { x: centerX + r.x * scale, y: centerY + r.y * scale, z: r.z, scale: scale };
  });

  projected.sort((a, b) => a.z - b.z);

  projected.forEach(p => {
    const size = Math.max(0.6, 1.9 * p.scale);
    const brightness = Math.min(1, Math.max(0.15, (p.scale - 0.7) * 2));

    ctx.save();
    ctx.shadowBlur = 8 * p.scale;
    ctx.shadowColor = `rgba(220,220,220,${brightness})`;
    ctx.fillStyle = `rgba(230,230,230,${brightness})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  angleY += 0.004;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
