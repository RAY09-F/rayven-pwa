<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RAYVEN</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #06060a;
    --bg2: #0d0b16;
    --violet: #8b5cf6;
    --violet-dim: #5b3fa0;
    --gold: #e8b84b;
    --gold-glow: #ffd77a;
    --text: #eae6f5;
    --steel: #7d7691;
    --glass: rgba(20, 16, 32, 0.55);
    --border: rgba(139, 92, 246, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: 'Space Grotesk', sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--bg2) 0%, var(--bg) 60%);
  }
  ::selection { background: var(--violet); color: #fff; }

  /* ---- Core: the reactive centerpiece, built from CSS not canvas — cheap on Chromebook GPUs ---- */
  #coreStage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #core {
    position: relative; width: min(46vw, 46vh, 340px); height: min(46vw, 46vh, 340px);
    transition: filter 0.6s ease;
  }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1.5px solid var(--border);
  }
  .ring--1 { animation: spin 22s linear infinite; }
  .ring--2 { inset: 10%; border-color: rgba(232, 184, 75, 0.18); animation: spin 16s linear infinite reverse; }
  .ring--3 { inset: 20%; border-style: dashed; animation: spin 30s linear infinite; opacity: 0.5; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #coreOrb {
    position: absolute; inset: 28%; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, var(--violet) 0%, var(--violet-dim) 45%, transparent 75%);
    box-shadow:
      0 0 40px 6px rgba(139, 92, 246, 0.35),
      0 0 90px 20px rgba(139, 92, 246, 0.15),
      inset 0 0 30px rgba(232, 184, 75, 0.15);
    transition: box-shadow 0.5s ease, transform 0.6s cubic-bezier(.4,0,.2,1), background 0.6s ease;
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  #coreOrb::after {
    content: ''; position: absolute; inset: -18%; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, var(--gold-glow) 8%, transparent 16%, transparent 50%, var(--violet) 58%, transparent 66%);
    opacity: 0.35; animation: spin 8s linear infinite;
    mix-blend-mode: screen;
  }

  /* State-driven core appearance */
  body.state-idle #coreOrb { animation-duration: 4.5s; }
  body.state-listening #coreOrb {
    box-shadow: 0 0 55px 10px rgba(232, 184, 75, 0.4), 0 0 110px 26px rgba(139, 92, 246, 0.2);
    animation-duration: 2.2s;
  }
  body.state-thinking #coreOrb {
    background: radial-gradient(circle at 38% 32%, var(--gold) 0%, var(--violet-dim) 50%, transparent 75%);
    animation: think-pulse 0.9s ease-in-out infinite;
  }
  @keyframes think-pulse { 0%, 100% { transform: scale(0.94); } 50% { transform: scale(1.02); } }
  body.state-talking #coreOrb {
    box-shadow: 0 0 60px 14px rgba(139, 92, 246, 0.5), 0 0 120px 30px rgba(232, 184, 75, 0.2);
    animation: talk-pulse 0.35s ease-in-out infinite alternate;
  }
  @keyframes talk-pulse { from { transform: scale(0.98); } to { transform: scale(1.06); } }
  body.state-sleeping #coreOrb {
    box-shadow: 0 0 20px 2px rgba(139, 92, 246, 0.15);
    opacity: 0.4; animation-duration: 7s;
  }
  body.state-sleeping .ring { opacity: 0.25; }
  body.state-burst #coreOrb {
    box-shadow: 0 0 90px 26px rgba(232, 184, 75, 0.6), 0 0 160px 50px rgba(139, 92, 246, 0.35);
    animation: talk-pulse 0.18s ease-in-out infinite alternate;
  }

  /* ---- Wake flash overlay (kept lightweight, no per-particle canvas math) ---- */
  #wakeFlash {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at 50% 44%, rgba(139,92,246,0.5), rgba(232,184,75,0.2) 45%, transparent 68%);
    opacity: 0;
  }
  #wakeFlash.show { animation: flashPulse 1.1s ease-out forwards; }
  @keyframes flashPulse { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  #welcomeText {
    position: fixed; top: 44%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(20px, 4vw, 36px); letter-spacing: 2px; color: var(--gold-glow);
    text-shadow: 0 0 20px rgba(232,184,75,0.5);
    text-align: center; pointer-events: none; z-index: 6; opacity: 0;
    transition: opacity 0.4s ease, transform 0.5s cubic-bezier(.22,1.6,.36,1);
  }
  #welcomeText.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---- Wordmark ---- */
  #wordmark {
    position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; z-index: 2; transition: opacity 0.4s ease;
  }
  #wordTitle {
    font-weight: 700; font-size: clamp(16px, 2.4vw, 22px); letter-spacing: 8px; color: var(--text);
  }
  #wordSubtitle {
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 3px; color: var(--steel);
    margin-top: 4px; text-transform: uppercase;
  }
  #wordmark.sleeping #wordTitle { color: var(--steel); }
  #wordmark.dimmed { opacity: 0; }

  /* ---- Top status strip: replaces the two floating holo panels with one compact readout ---- */
  #statusStrip {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; gap: 6px; flex-wrap: wrap; max-width: 260px; justify-content: flex-end;
  }
  .status-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.5px;
    padding: 5px 9px; border-radius: 20px; background: var(--glass); border: 1px solid var(--border);
    color: var(--steel); display: flex; align-items: center; gap: 5px;
  }
  .status-chip .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold-glow); }
  @media (max-width: 720px) { #statusStrip { display: none; } }

  /* ---- Chat: slide-out panel instead of always-visible box ---- */
  #chatToggle {
    position: fixed; top: 16px; left: 16px; z-index: 12;
    width: 38px; height: 38px; border-radius: 12px; background: var(--glass); border: 1px solid var(--border);
    color: var(--text); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #chatPanel {
    position: fixed; top: 0; left: 0; height: 100%; width: min(320px, 86vw); z-index: 11;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform 0.32s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column; padding: 64px 14px 14px;
  }
  #chatPanel.open { transform: translateX(0); }
  #chatLog { flex: 1; overflow-y: auto; font-size: 12px; line-height: 1.5; padding-right: 4px; }
  #chatLog .msg { margin-bottom: 10px; }
  #chatLog .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1px; opacity: 0.6; display: block; margin-bottom: 2px; }
  #chatLog .user .label { color: var(--steel); }
  #chatLog .rayven .label { color: var(--gold); }
  .chat-input-row { display: flex; gap: 6px; margin-top: 10px; }
  #chatPanel input {
    flex: 1; min-width: 0; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(0,0,0,0.35); color: var(--text); font-family: inherit; font-size: 12px;
  }
  #chatPanel input:focus { outline: none; border-color: var(--gold); }
  #chatPanel button {
    padding: 9px 13px; border-radius: 8px; border: 1px solid var(--gold); background: transparent;
    color: var(--gold); font-size: 10px; letter-spacing: 1px; cursor: pointer; font-family: inherit;
  }

  /* ---- Bottom command dock: unifies mic, sliders, and status into one bar ---- */
  #dock {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 18px;
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 999px; padding: 10px 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .dock-slider { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 72px; }
  .dock-slider label { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: 1.5px; color: var(--steel); }
  .dock-slider label span { color: var(--gold); margin-left: 3px; }
  .dock-slider input[type="range"] {
    -webkit-appearance: none; width: 72px; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, var(--violet), var(--gold)); outline: none;
  }
  .dock-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: var(--gold-glow); box-shadow: 0 0 6px var(--gold-glow); cursor: pointer;
  }
  .dock-slider input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; border: none; background: var(--gold-glow); cursor: pointer;
  }

  .mic-circle {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(139,92,246,0.12); border: 2px solid var(--violet); color: var(--violet);
    font-size: 19px; cursor: pointer; transition: all 0.3s ease; flex-shrink: 0;
  }
  .mic-circle:hover { box-shadow: 0 0 16px rgba(139,92,246,0.5); }
  .mic-circle.mic-listening { animation: micPulseV 2.4s ease-in-out infinite; }
  .mic-circle.mic-awake { border-color: var(--gold); color: var(--gold); background: rgba(232,184,75,0.12); animation: micPulseG 1s ease-in-out infinite; }
  .mic-circle.mic-muted { border-color: #d64545; color: #d64545; background: rgba(214,69,69,0.1); animation: none; }
  .mic-circle.mic-paused { border-color: var(--steel); color: var(--steel); background: transparent; opacity: 0.4; }
  @keyframes micPulseV { 0%,100% { box-shadow: 0 0 8px rgba(139,92,246,0.25); } 50% { box-shadow: 0 0 22px rgba(139,92,246,0.55); } }
  @keyframes micPulseG { 0%,100% { box-shadow: 0 0 10px rgba(232,184,75,0.3); } 50% { box-shadow: 0 0 26px rgba(232,184,75,0.6); } }

  #muteBtn {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1.5px solid var(--gold); color: var(--gold);
    font-size: 12px; cursor: pointer;
  }
  #muteBtn.muted { border-color: #d64545; color: #d64545; }

  #voiceStatusSmall {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 1px; color: var(--steel);
    z-index: 12; text-align: center; max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  @media (max-width: 480px) {
    #dock { gap: 10px; padding: 8px 12px; }
    .dock-slider { width: 52px; }
    .dock-slider input[type="range"] { width: 52px; }
  }
</style>
</head>
<body class="state-idle">

<div id="wordmark">
  <div id="wordTitle">RAYVEN</div>
  <div id="wordSubtitle">Rayan's AI Assistant</div>
</div>

<div id="coreStage">
  <div id="core">
    <div class="ring ring--1"></div>
    <div class="ring ring--2"></div>
    <div class="ring ring--3"></div>
    <div id="coreOrb"></div>
  </div>
</div>

<div id="wakeFlash"></div>
<div id="welcomeText">WELCOME HOME,<br>SIR</div>

<button id="chatToggle" onclick="toggleChat()">☰</button>
<div id="chatPanel">
  <div id="chatLog"></div>
  <div class="chat-input-row">
    <input type="text" id="userInput" placeholder="Message RAYVEN..." onkeydown="if(event.key==='Enter')handleTypedSend()">
    <button onclick="handleTypedSend()">SEND</button>
  </div>
</div>

<div id="statusStrip">
  <div class="status-chip"><span class="dot"></span>CORE</div>
  <div class="status-chip"><span class="dot"></span>MEMORY</div>
  <div class="status-chip"><span class="dot"></span>UPLINK</div>
  <div class="status-chip"><span class="dot"></span>NETWORK</div>
</div>

<div id="dock">
  <div class="dock-slider">
    <label>RATE<span id="rateVal">1.0x</span></label>
    <input type="range" id="rateSlider" min="0.6" max="1.8" step="0.05" value="1.0">
  </div>
  <button id="muteBtn" onclick="toggleMute()">🔇</button>
  <button id="micCircle" class="mic-circle" onclick="handleMicClick()">🎤</button>
  <div class="dock-slider">
    <label>PITCH<span id="pitchVal">0</span></label>
    <input type="range" id="pitchSlider" min="-8" max="8" step="1" value="0">
  </div>
</div>
<div id="voiceStatusSmall">Click the mic, then say "Hey RAYVEN" or double clap</div>

<script>
const wordmarkEl = document.getElementById('wordmark');
const welcomeTextEl = document.getElementById('welcomeText');
const wakeFlashEl = document.getElementById('wakeFlash');

function setSleepingVisual(isSleeping) { wordmarkEl.classList.toggle('sleeping', isSleeping); }
function setSphereState(name) {
  document.body.className = 'state-' + name;
}

function toggleChat() { document.getElementById('chatPanel').classList.toggle('open'); }

let wakeSequenceRunning = false;

async function fetchWakeGreeting() {
  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: "[WAKE_TRIGGER] Rayan just said your wake word. Greet him briefly, then ask something proactive." })
    });
    const data = await response.json();
    return data.reply || "Welcome home, sir.";
  } catch (err) {
    return "Welcome home, sir.";
  }
}

function wakeBurst() {
  if (wakeSequenceRunning) return;
  wakeSequenceRunning = true;

  wakeFlashEl.classList.remove('show');
  void wakeFlashEl.offsetWidth;
  wakeFlashEl.classList.add('show');

  setSphereState('burst');
  const greetingPromise = fetchWakeGreeting();

  setTimeout(() => {
    wordmarkEl.classList.add('dimmed');
    welcomeTextEl.classList.add('show');

    greetingPromise.then(greeting => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div class="msg rayven"><span class="label">RAYVEN</span>${greeting}</div>`;
      log.scrollTop = log.scrollHeight;
      conversationHistory.push({ role: 'assistant', content: greeting });
      saveConversation();

      speak(greeting, () => {
        wakeSequenceRunning = false;
        resumeListeningAfterSpeech();
      });
    });
  }, 400);

  setTimeout(() => {
    welcomeTextEl.classList.remove('show');
    wordmarkEl.classList.remove('dimmed');
  }, 400 + 1200);

  setTimeout(() => { setSphereState('listening'); }, 900);
}

const BACKEND_URL = "https://rayven-backend.rayanfahil2.workers.dev";
const WAKE_PHRASES = [
  "hey rayven", "hey raven", "hey ray ven",
  "wake up raven", "wake up rayven", "wake raven",
  "okay raven", "ok raven", "okay rayven",
  "yo raven", "yo rayven", "a raven", "ay raven", "raven"
];
const SLEEP_PHRASES = ["go to sleep", "sleep now", "power down", "goodnight raven"];
const STOP_PHRASES = ["stop talking", "shut up", "be quiet", "quiet", "stop it", "hush", "silence", "stop"];

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
  return dp[m][n];
}
function containsRavenLike(transcript) {
  const words = transcript.toLowerCase().replace(/[^a-z\s]/g, '').split(/\s+/);
  return words.some(w => w.length >= 4 && levenshtein(w, 'raven') <= 1);
}
function matchesAny(transcript, list) {
  const clean = transcript.toLowerCase().trim();
  if (list.some(p => clean.includes(p))) return true;
  if (list === WAKE_PHRASES && containsRavenLike(clean)) return true;
  return false;
}
function stripWakeWord(transcript) {
  let clean = transcript.trim();
  const lower = clean.toLowerCase();
  for (const phrase of WAKE_PHRASES) {
    if (lower.startsWith(phrase)) return clean.slice(phrase.length).trim();
  }
  const words = clean.split(/\s+/);
  if (words.length && levenshtein(words[0].toLowerCase().replace(/[^a-z]/g, ''), 'raven') <= 1) {
    return words.slice(1).join(' ').trim();
  }
  return clean;
}
function isGetLittyCommand(transcript) {
  const t = transcript.toLowerCase();
  return t.includes('litty') && containsRavenLike(t);
}
const GET_LITTY_SONG_REQUEST = "Play Immigrant Song by Led Zeppelin on Spotify.";

let conversationHistory = [];
try {
  const saved = localStorage.getItem('rayvenConversation');
  if (saved) conversationHistory = JSON.parse(saved);
} catch (e) { conversationHistory = []; }

function saveConversation() {
  try { localStorage.setItem('rayvenConversation', JSON.stringify(conversationHistory)); } catch (e) {}
}
function renderSavedConversation() {
  const log = document.getElementById('chatLog');
  conversationHistory.forEach(m => {
    const cls = m.role === 'user' ? 'user' : 'rayven';
    const label = m.role === 'user' ? 'YOU' : 'RAYVEN';
    log.innerHTML += `<div class="msg ${cls}"><span class="label">${label}</span>${m.content}</div>`;
  });
  log.scrollTop = log.scrollHeight;
}
renderSavedConversation();

const rateSlider = document.getElementById('rateSlider');
const pitchSlider = document.getElementById('pitchSlider');
const rateVal = document.getElementById('rateVal');
const pitchVal = document.getElementById('pitchVal');

const savedRate = localStorage.getItem('rayvenVoiceRate');
const savedPitch = localStorage.getItem('rayvenVoicePitch');
if (savedRate !== null) rateSlider.value = savedRate;
if (savedPitch !== null) pitchSlider.value = savedPitch;
rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';
pitchVal.textContent = pitchSlider.value;

rateSlider.addEventListener('input', () => {
  rateVal.textContent = parseFloat(rateSlider.value).toFixed(2) + 'x';
  localStorage.setItem('rayvenVoiceRate', rateSlider.value);
});
pitchSlider.addEventListener('input', () => {
  pitchVal.textContent = pitchSlider.value;
  localStorage.setItem('rayvenVoicePitch', pitchSlider.value);
});

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

let currentAudioSource = null;
let currentOnDone = null;

function stopSpeaking() {
  if (currentAudioSource) {
    try { currentAudioSource.onended = null; currentAudioSource.stop(); } catch (e) {}
    currentAudioSource = null;
  }
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  currentOnDone = null;
}

function speak(text, onDone) {
  const cleaned = text.replace(/,/g, '').trim();
  setSphereState('talking');
  currentOnDone = onDone;

  fetch(`${BACKEND_URL}/tts`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text: cleaned })
  })
    .then(res => { if (!res.ok) throw new Error('TTS failed ' + res.status); return res.arrayBuffer(); })
    .then(arrayBuffer => getAudioCtx().decodeAudioData(arrayBuffer))
    .then(audioBuffer => {
      const ctxAudio = getAudioCtx();
      const source = ctxAudio.createBufferSource();
      source.buffer = audioBuffer;
      source.playbackRate.value = parseFloat(rateSlider.value);
      source.detune.value = parseFloat(pitchSlider.value) * 100;
      source.connect(ctxAudio.destination);
      currentAudioSource = source;
      source.onended = () => { currentAudioSource = null; const cb = currentOnDone; currentOnDone = null; if (cb) cb(); };
      source.start(0);
    })
    .catch(err => {
      console.error('TTS fallback:', err);
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(cleaned);
        utter.rate = parseFloat(rateSlider.value);
        utter.pitch = Math.max(0, Math.min(2, 1 + parseFloat(pitchSlider.value) / 12));
        utter.onend = () => { const cb = currentOnDone; currentOnDone = null; if (cb) cb(); };
        utter.onerror = () => { const cb = currentOnDone; currentOnDone = null; if (cb) cb(); };
        window.speechSynthesis.speak(utter);
      } else { const cb = currentOnDone; currentOnDone = null; if (cb) cb(); }
    });
}

const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
let wakeRecognition = null, convoRecognition = null;
let voiceActive = false, awake = false, micMuted = false;
let listeningPaused = false;

const micCircle = document.getElementById('micCircle');
const muteBtn = document.getElementById('muteBtn');

function setVoiceStatus(msg) { document.getElementById('voiceStatusSmall').textContent = msg; }

function updateMicVisual() {
  micCircle.classList.remove('mic-listening', 'mic-awake', 'mic-muted', 'mic-paused');
  if (micMuted) { micCircle.classList.add('mic-muted'); return; }
  if (listeningPaused) { micCircle.classList.add('mic-paused'); return; }
  if (awake) { micCircle.classList.add('mic-awake'); return; }
  if (voiceActive) { micCircle.classList.add('mic-listening'); }
}

function handleMicClick() {
  if (!SpeechRecognitionCtor) { alert('Voice recognition is not supported in this browser. Try Chrome.'); return; }
  if (!voiceActive) { voiceActive = true; startWakeListening(); startClapDetection(); }
}

function toggleMute() {
  micMuted = !micMuted;
  muteBtn.textContent = micMuted ? '🔇' : '🎙';
  muteBtn.classList.toggle('muted', micMuted);
  updateMicVisual();
  if (micMuted) {
    if (wakeRecognition) { try { wakeRecognition.stop(); } catch (e) {} }
    if (convoRecognition) { try { convoRecognition.stop(); } catch (e) {} }
    setVoiceStatus('Microphone muted.');
  } else {
    if (!voiceActive) return;
    if (awake) { if (!listeningPaused) startContinuousAwakeListening(); } else { startWakeListening(); }
  }
}

function startWakeListening() {
  if (!voiceActive || awake || micMuted) return;
  setSleepingVisual(false);
  setSphereState('idle');
  updateMicVisual();
  wakeRecognition = new SpeechRecognitionCtor();
  wakeRecognition.continuous = true;
  wakeRecognition.interimResults = true;
  wakeRecognition.lang = 'en-US';
  wakeRecognition.maxAlternatives = 5;

  wakeRecognition.onresult = (event) => {
    if (awake || micMuted) return;
    for (let r = event.resultIndex; r < event.results.length; r++) {
      for (let alt = 0; alt < event.results[r].length; alt++) {
        if (matchesAny(event.results[r][alt].transcript, WAKE_PHRASES)) { triggerWake(); return; }
      }
    }
  };
  wakeRecognition.onend = () => { if (voiceActive && !awake && !micMuted) { try { startWakeListening(); } catch (e) { setTimeout(startWakeListening, 100); } } };
  wakeRecognition.onerror = () => { if (voiceActive && !awake && !micMuted) setTimeout(() => { try { startWakeListening(); } catch (err) {} }, 100); };

  setVoiceStatus('Listening for "Hey RAYVEN" or a double clap...');
  try { wakeRecognition.start(); } catch (e) {}
}

let clapAudioCtx = null, clapAnalyser = null, clapDataArray = null, clapStream = null;
let clapBaseline = 0.02, clapLastSpikeTime = 0, clapFirstTime = 0;
const CLAP_MIN_GAP_MS = 150, CLAP_MAX_GAP_MS = 700;

async function startClapDetection() {
  if (clapAnalyser) return;
  try { clapStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { console.error('Clap detection: mic access failed', e); return; }
  clapAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = clapAudioCtx.createMediaStreamSource(clapStream);
  clapAnalyser = clapAudioCtx.createAnalyser();
  clapAnalyser.fftSize = 512;
  clapAnalyser.smoothingTimeConstant = 0;
  source.connect(clapAnalyser);
  clapDataArray = new Uint8Array(clapAnalyser.fftSize);
  requestAnimationFrame(clapDetectionLoop);
}
function getInstantVolume() {
  clapAnalyser.getByteTimeDomainData(clapDataArray);
  let sumSquares = 0;
  for (let i = 0; i < clapDataArray.length; i++) { const n = (clapDataArray[i] - 128) / 128; sumSquares += n * n; }
  return Math.sqrt(sumSquares / clapDataArray.length);
}
function clapDetectionLoop() {
  if (clapAnalyser && voiceActive && !awake && !micMuted) {
    const vol = getInstantVolume();
    if (vol < clapBaseline * 1.5) clapBaseline = clapBaseline * 0.98 + vol * 0.02;
    const now = Date.now();
    const spikeThreshold = Math.max(0.14, clapBaseline * 6);
    if (vol > spikeThreshold) {
      if (now - clapLastSpikeTime >= CLAP_MIN_GAP_MS) {
        if (clapFirstTime === 0) { clapFirstTime = now; }
        else {
          const gap = now - clapFirstTime;
          if (gap <= CLAP_MAX_GAP_MS) {
            clapFirstTime = 0; clapLastSpikeTime = now; triggerWake();
            requestAnimationFrame(clapDetectionLoop); return;
          } else { clapFirstTime = now; }
        }
        clapLastSpikeTime = now;
      }
    } else if (clapFirstTime !== 0 && now - clapFirstTime > CLAP_MAX_GAP_MS) { clapFirstTime = 0; }
  }
  requestAnimationFrame(clapDetectionLoop);
}

function triggerWake() {
  if (awake) return;
  awake = true;
  updateMicVisual();
  if (wakeRecognition) { try { wakeRecognition.stop(); } catch (e) {} }
  enterAwakeMode();
}
function enterAwakeMode() {
  listeningPaused = true;
  updateMicVisual();
  wakeBurst();
  setVoiceStatus('RAYVEN is speaking...');
}
function exitAwakeMode() {
  awake = false; listeningPaused = false; updateMicVisual();
  if (convoRecognition) { try { convoRecognition.stop(); } catch (e) {} }
  if (!micMuted) startWakeListening();
}
function resumeListeningAfterSpeech() {
  listeningPaused = false; updateMicVisual();
  if (awake && !micMuted) {
    setVoiceStatus('Awake — your turn, say "Hey RAYVEN" or just talk...');
    startContinuousAwakeListening();
  }
}

function startContinuousAwakeListening() {
  if (!awake || micMuted || listeningPaused) return;
  convoRecognition = new SpeechRecognitionCtor();
  convoRecognition.continuous = true;
  convoRecognition.interimResults = false;
  convoRecognition.lang = 'en-US';

  convoRecognition.onresult = (event) => {
    if (micMuted || listeningPaused) return;
    const lastResult = event.results[event.results.length - 1];
    const transcript = lastResult && lastResult[0] ? lastResult[0].transcript.trim() : '';
    if (!transcript) return;

    listeningPaused = true;
    updateMicVisual();
    try { convoRecognition.stop(); } catch (e) {}

    if (matchesAny(transcript, STOP_PHRASES)) { stopSpeaking(); resumeListeningAfterSpeech(); return; }
    if (isGetLittyCommand(transcript)) { setVoiceStatus('RAYVEN is speaking...'); sendMessage(GET_LITTY_SONG_REQUEST, null); return; }

    let toSend = transcript;
    if (matchesAny(transcript, WAKE_PHRASES)) {
      const remainder = stripWakeWord(transcript);
      if (!remainder) { resumeListeningAfterSpeech(); return; }
      toSend = remainder;
    }
    if (matchesAny(toSend, SLEEP_PHRASES)) {
      setVoiceStatus('RAYVEN is speaking...');
      speak("Powering down. I'll be here when you need me, sir.", () => exitAwakeMode());
      return;
    }
    setVoiceStatus('RAYVEN is speaking...');
    sendMessage(toSend, null);
  };

  convoRecognition.onend = () => { if (awake && !micMuted && !listeningPaused) { try { startContinuousAwakeListening(); } catch (e) { setTimeout(() => { if (awake && !micMuted && !listeningPaused) startContinuousAwakeListening(); }, 100); } } };
  convoRecognition.onerror = () => { if (awake && !micMuted && !listeningPaused) setTimeout(() => { if (awake && !micMuted && !listeningPaused) startContinuousAwakeListening(); }, 100); };

  try { convoRecognition.start(); } catch (e) {}
  updateMicVisual();
}

function handleTypedSend() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendMessage(text, null);
}

async function sendMessage(text, onReplyDone) {
  const log = document.getElementById('chatLog');
  if (!text || !text.trim()) { if (onReplyDone) onReplyDone(); return; }
  text = text.trim();

  log.innerHTML += `<div class="msg user"><span class="label">YOU</span>${text}</div>`;
  setSphereState('thinking');
  log.scrollTop = log.scrollHeight;
  conversationHistory.push({ role: 'user', content: text });

  const typingId = 'typing-' + Date.now();
  log.innerHTML += `<div class="msg rayven" id="${typingId}"><span class="label">RAYVEN</span>...</div>`;
  log.scrollTop = log.scrollHeight;

  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text })
    });
    const data = await response.json();
    const replyText = data.reply || data.error;
    document.getElementById(typingId).innerHTML = `<span class="label">RAYVEN</span>${replyText}`;
    conversationHistory.push({ role: 'assistant', content: replyText });
    saveConversation();
    speak(replyText, () => {
      setSphereState(awake ? 'listening' : 'idle');
      resumeListeningAfterSpeech();
      if (onReplyDone) onReplyDone();
    });
  } catch (err) {
    document.getElementById(typingId).innerHTML = `<span class="label">RAYVEN</span>Connection error: ${err.message}`;
    setSphereState(awake ? 'listening' : 'idle');
    resumeListeningAfterSpeech();
    if (onReplyDone) onReplyDone();
  }
  log.scrollTop = log.scrollHeight;
}
</script>
