<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAYVEN Sphere Test — Stage 1</title>
<style>
  body { margin: 0; background: #05030a; overflow: hidden; }
  canvas { display: block; }
  #label { position: fixed; top: 16px; left: 16px; color: #a99bdb; font-family: monospace; font-size: 12px; letter-spacing: 2px; }
</style>
</head>
<body>
<div id="label">STAGE 1 — BASIC ROTATING SPHERE</div>
<canvas id="sphereCanvas"></canvas>
<script>
const canvas = document.getElementById('sphereCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---- Build the sphere's points using a Fibonacci sphere distribution ----
const SEED_COUNT = 260;       // main points spread across the sphere
const SUBDOTS_PER_SEED = 6;   // tiny cluster dots per point, for texture
const SPHERE_RADIUS = 160;

const points = [];
const goldenAngle = Math.PI * (3 - Math.sqrt(5));

for (let i = 0; i < SEED_COUNT; i++) {
  const y = 1 - (i / (SEED_COUNT - 1)) * 2;
  const radiusAtY = Math.sqrt(1 - y * y);
  const theta = goldenAngle * i;
  const sx = Math.cos(theta) * radiusAtY;
  const sz = Math.sin(theta) * radiusAtY;
  const sy = y;

  // one clean point at the exact sphere position...
  for (let k = 0; k < SUBDOTS_PER_SEED; k++) {
    // ...plus a small cluster of jittered sub-dots right around it, for texture
    const jitter = 0.035;
    points.push({
      x: (sx + (Math.random() - 0.5) * jitter) * SPHERE_RADIUS,
      y: (sy + (Math.random() - 0.5) * jitter) * SPHERE_RADIUS,
      z: (sz + (Math.random() - 0.5) * jitter) * SPHERE_RADIUS
    });
  }
}

let angleY = 0;
let angleX = 0.3; // slight tilt so we're not looking straight at the equator

function rotateY(p, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return { x: p.x * cos - p.z * sin, y: p.y, z: p.x * sin + p.z * cos };
}

function rotateX(p, angle) {
  const cos = Math.cos(angle), sin = Math.sin(angle);
  return { x: p.x, y: p.y * cos - p.z * sin, z: p.y * sin + p.z * cos };
}

function render() {
  ctx.fillStyle = 'rgba(5,3,10,0.35)'; // slight trail/fade instead of a hard clear, looks smoother
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const perspective = 420;

  // rotate + project every point
  const projected = points.map(p => {
    let r = rotateY(p, angleY);
    r = rotateX(r, angleX);
    const scale = perspective / (perspective + r.z);
    return {
      x: centerX + r.x * scale,
      y: centerY + r.y * scale,
      z: r.z,
      scale: scale
    };
  });

  // sort back-to-front so far points draw behind near ones
  projected.sort((a, b) => a.z - b.z);

  projected.forEach(p => {
    const size = Math.max(0.6, 1.8 * p.scale);
    const brightness = Math.min(1, Math.max(0.15, (p.scale - 0.7) * 2));

    ctx.save();
    ctx.shadowBlur = 8 * p.scale;
    ctx.shadowColor = `rgba(155,107,255,${brightness})`;
    ctx.fillStyle = `rgba(200,180,255,${brightness})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  angleY += 0.004; // slow, calm rotation for this test stage

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
