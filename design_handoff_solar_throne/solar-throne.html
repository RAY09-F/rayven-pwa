<body>
<three-d-stage name="solar-throne" background="radial-gradient(ellipse at 50% 40%,#1a1710 0%,#07070a 70%)"></three-d-stage>

<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const renderer = stage._renderer, camera = stage._camera, scene = stage._scene, controls = stage._controls;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
stage._key.shadow.mapSize.set(1024, 1024); stage._key.shadow.radius = 4;
controls.dampingFactor = 0.05;
scene.fog = new THREE.FogExp2(0x07070a, 0.035);
scene.children.forEach(l => { if (l.isHemisphereLight) { l.intensity = 0.55; l.color.set(0xa8b4c8); l.groundColor.set(0x14100c); } else if (l.isDirectionalLight) l.intensity *= 0.8; });
stage._ground.material.opacity = 0.5;
{
  const env = new THREE.Scene(); env.background = new THREE.Color(0x0a0908);
  const panel = (c, i, pos, size) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(...size), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.material.color.multiplyScalar(i); m.position.set(...pos); m.lookAt(0,0,0); env.add(m); };
  panel(0xfff1dc, 7, [4, 6, 3], [5, 3]); panel(0xffd9a0, 3, [-6, 3, -4], [6, 4]); panel(0xffe0b0, 2.5, [0, -3, 6], [8, 2]); panel(0x5a4a30, 1.2, [0, 8, 0], [12, 12]); panel(0xffc060, 4, [0, 2, -6], [3, 5]);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.04).texture; scene.environmentIntensity = 0.6; pmrem.dispose();
}

const mat = (name, color, o={}) => Object.assign(new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.2, ...o }), { name });
const gem = (name, color, em, i=0.9) => Object.assign(new THREE.MeshPhysicalMaterial({ color, roughness: 0, metalness: 0, transmission: 1, thickness: 0.8, ior: 2.42, dispersion: 0.35, attenuationColor: new THREE.Color(color), attenuationDistance: 1.2, clearcoat: 1, clearcoatRoughness: 0, emissive: em, emissiveIntensity: i, flatShading: true }), { name });
const M = {
  marble:  mat('black_marble', 0x0e1014, { roughness: 0.5, metalness: 0.08 }),
  marbleDk:mat('black_marble_dark', 0x070809, { roughness: 0.55, metalness: 0.05 }),
  gold:    mat('gold', 0xe0b050, { roughness: 0.22, metalness: 0.9, emissive: 0x3a2200, emissiveIntensity: 0.3 }),
  goldDk:  mat('gold_dark', 0x9a7430, { roughness: 0.35, metalness: 0.85 }),
  goldLit: mat('gold_light', 0xffc860, { emissive: 0xff9a20, emissiveIntensity: 1.2, roughness: 0.4, metalness: 0.2 }),
  goldGlow:mat('gold_inlay_glow', 0xffc470, { emissive: 0xff9a20, emissiveIntensity: 1.6, roughness: 0.35, metalness: 0.4 }),
  sclera:  Object.assign(new THREE.MeshPhysicalMaterial({ color: 0xf6ead6, roughness: 0.14, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.02, sheen: 0.6, sheenColor: new THREE.Color(0xffd9b0) }), { name: 'sclera' }),
  eyeGold: mat('eye_gold', 0xe8bc62, { roughness: 0.16, metalness: 0.92, emissive: 0x3a2200, emissiveIntensity: 0.25 }),
  pupil:   mat('pupil', 0x05060a, { roughness: 0.35, metalness: 0 }),
  cornea:  Object.assign(new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0, metalness: 0, transmission: 1, thickness: 0.12, ior: 1.42, clearcoat: 1, transparent: true, opacity: 0.35 }), { name: 'cornea' }),
  sun:     Object.assign(new THREE.MeshBasicMaterial({ color: 0xffc870, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }), { name: 'sun_glow' }),
  beam:    Object.assign(new THREE.MeshBasicMaterial({ color: 0xff9a30, transparent: true, opacity: 0.05, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }), { name: 'light_beam' }),
};
const agents = [
  { key: 'ruby',     name: 'VOLSTAGG', role: 'SUPPLY · GROWTH · PEOPLE',        hex: 0xff3a3a, em: 0xff0a0a, css: '#ff6a6a', angle: 90 },
  { key: 'topaz',    name: 'HEIMDALL', role: 'GOLD · GEO · MOMENTUM · ALERTS',  hex: 0xffc21a, em: 0xff8c00, css: '#ffd84a', angle: 18 },
  { key: 'emerald',  name: 'FANDRAL',  role: 'BITCOIN · RISK · EXECUTION',      hex: 0x2aff8a, em: 0x00c850, css: '#4dffa3', angle: 306 },
  { key: 'sapphire', name: 'HOGUN',    role: 'NASDAQ · MACRO · FLOW',           hex: 0x3a8aff, em: 0x0a4aff, css: '#6aa8ff', angle: 234 },
  { key: 'amethyst', name: 'FRIGGA',   role: 'ETHEREUM · MOMENTUM · TRENDS',    hex: 0xa040ff, em: 0x5a00ff, css: '#c088ff', angle: 162 },
];

const add = (parent, name, geo, m, pos=[0,0,0], rot=[0,0,0]) => {
  const mesh = new THREE.Mesh(geo, m); mesh.name = name;
  mesh.position.set(...pos); mesh.rotation.set(...rot);
  mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh;
};
const crystal = (r, hUp, hDown, n=6) => {
  const ring = (rad, y, off) => Array.from({ length: n }, (_, i) => { const a = (i + off) / n * Math.PI * 2; return [Math.cos(a)*rad, y, Math.sin(a)*rad*0.9]; });
  const R = [ring(r*0.55, hUp*0.5, 0.5), ring(r, 0, 0), ring(r*0.6, -hDown*0.45, 0.5), [[0, -hDown, 0]]];
  const P = []; const tri = (a, b, c) => P.push(...a, ...b, ...c); const apex = [0, hUp, 0];
  for (let i = 0; i < n; i++) tri(apex, R[0][i], R[0][(i+1)%n]);
  for (let k = 0; k < R.length - 2; k++) for (let i = 0; i < n; i++) { const a = R[k][i], b = R[k][(i+1)%n], c = R[k+1][i], d = R[k+1][(i+1)%n]; tri(a, c, d); tri(a, d, b); }
  const last = R[R.length-2], tip = R[R.length-1][0];
  for (let i = 0; i < n; i++) tri(last[i], tip, last[(i+1)%n]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.computeVertexNormals(); return g;
};

const model = new THREE.Group(); model.name = 'solar_throne';
// Floor: polished black marble with glowing gold inlays and radial spokes
add(model, 'floor_disc', new THREE.CylinderGeometry(4.2, 4.3, 0.14, 96), M.marbleDk, [0, 0.07, 0]);
add(model, 'floor_step', new THREE.CylinderGeometry(3.5, 3.6, 0.08, 96), M.marble, [0, 0.18, 0]);
const floorGlows = [];
[4.0, 3.75, 3.15, 2.6, 2.0].forEach((r, i) => { const t = add(model, `floor_inlay_${i+1}`, new THREE.TorusGeometry(r, i%2 ? 0.012 : 0.022, 8, 220), M.goldGlow, [0, r > 3.55 ? 0.142 : 0.222, 0], [Math.PI/2, 0, 0]); t.castShadow = false; floorGlows.push(t); });
for (let i = 0; i < 24; i++) { const a = i/24*Math.PI*2; add(model, `floor_spoke_${i+1}`, new THREE.BoxGeometry(0.02, 0.006, 0.6), M.goldDk, [Math.cos(a)*3.88, 0.142, Math.sin(a)*3.88], [0, -a + Math.PI/2, 0]); }
// Glowing gold sigil ring the council sits on
const councilRing = add(model, 'council_ring', new THREE.RingGeometry(2.78, 3.02, 128), new THREE.MeshBasicMaterial({ color: 0xffbe58, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }), [0, 0.229, 0], [-Math.PI/2, 0, 0]); councilRing.castShadow = councilRing.receiveShadow = false;
const innerGlowDisc = add(model, 'council_glow_disc', new THREE.RingGeometry(0.9, 2.05, 96), new THREE.MeshBasicMaterial({ color: 0xffa030, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }), [0, 0.228, 0], [-Math.PI/2, 0, 0]); innerGlowDisc.castShadow = innerGlowDisc.receiveShadow = false;
// Pedestal: wide stacked marble drums with gold bands and rune panels
add(model, 'pedestal_drum_1', new THREE.CylinderGeometry(1.55, 1.62, 0.22, 96), M.marble, [0, 0.33, 0]);
add(model, 'pedestal_band_1', new THREE.TorusGeometry(1.57, 0.025, 10, 128), M.gold, [0, 0.45, 0], [Math.PI/2, 0, 0]);
add(model, 'pedestal_drum_2', new THREE.CylinderGeometry(1.32, 1.38, 0.26, 96), M.marbleDk, [0, 0.57, 0]);
add(model, 'pedestal_band_2', new THREE.TorusGeometry(1.34, 0.025, 10, 128), M.gold, [0, 0.71, 0], [Math.PI/2, 0, 0]);
add(model, 'pedestal_drum_3', new THREE.CylinderGeometry(1.1, 1.16, 0.22, 96), M.marble, [0, 0.82, 0]);
add(model, 'pedestal_cap', new THREE.CylinderGeometry(1.0, 1.1, 0.06, 96), M.gold, [0, 0.96, 0]);
for (let i = 0; i < 16; i++) { const a = i/16*Math.PI*2; add(model, `pedestal_panel_${i+1}`, new THREE.BoxGeometry(0.28, 0.16, 0.03), M.goldDk, [Math.cos(a)*1.36, 0.57, Math.sin(a)*1.36], [0, -a + Math.PI/2, 0]); }
// Solar disc: nested gold layers funnelling into a dark aperture (billboards toward the viewer)
const core = new THREE.Group(); core.name = 'core'; core.position.y = 2.15; model.add(core);
const disc = new THREE.Group(); disc.name = 'solar_disc'; core.add(disc);
add(disc, 'disc_rim', new THREE.TorusGeometry(1.24, 0.075, 20, 160), M.gold);
add(disc, 'disc_rim_outer', new THREE.TorusGeometry(1.34, 0.03, 12, 160), M.goldDk);
add(disc, 'disc_rim_bevel', new THREE.TorusGeometry(1.16, 0.045, 14, 160), M.goldLit);
// Concentric stepped layers: each ring smaller and deeper, so the face reads as a funnel
const layers = [];
for (let i = 0; i < 7; i++) {
  const r = 1.1 - i*0.115, z = -0.03 - i*0.055;
  const ring = add(disc, `disc_layer_${i+1}`, new THREE.TorusGeometry(r, 0.05 - i*0.004, 12, 128), i%2 ? M.goldDk : M.gold, [0, 0, z]);
  const trim = add(disc, `disc_layer_trim_${i+1}`, new THREE.TorusGeometry(r, 0.012, 8, 128), M.goldLit, [0, 0, z + 0.035]);
  const teeth = new THREE.Group(); teeth.position.z = z; disc.add(teeth);
  const n = 18 - i;
  for (let k = 0; k < n; k++) { const a = k/n*Math.PI*2; add(teeth, `disc_layer_${i+1}_tooth_${k+1}`, new THREE.BoxGeometry(0.055, 0.11 - i*0.008, 0.03), i%2 ? M.gold : M.goldDk, [Math.cos(a)*r, Math.sin(a)*r, 0.03], [0, 0, a]); }
  layers.push({ ring, trim, teeth, dir: i%2 ? 1 : -1, r, base: z });
}
for (let i = 0; i < 36; i++) { const a = i/36*Math.PI*2; add(disc, `disc_stud_${i+1}`, new THREE.SphereGeometry(0.028, 10, 8), M.goldLit, [Math.cos(a)*1.24, Math.sin(a)*1.24, 0.085]); }
for (let i = 0; i < 8; i++) { const a = i/8*Math.PI*2 + Math.PI/8; add(disc, `disc_gem_${i+1}`, crystal(0.05, 0.1, 0.1, 6), M.goldLit, [Math.cos(a)*1.24, Math.sin(a)*1.24, 0.12], [0, 0, a - Math.PI/2]); }
const iris = new THREE.Group(); iris.name = 'iris'; iris.position.z = -0.42; disc.add(iris);
const blades = [];
for (let i = 0; i < 10; i++) {
  const a = i/10*Math.PI*2;
  const b = add(iris, `iris_blade_${i+1}`, new THREE.TorusGeometry(0.42, 0.085, 12, 48, Math.PI*0.85), M.gold, [Math.cos(a)*0.24, Math.sin(a)*0.24, 0], [0, 0, a + Math.PI*0.5]);
  b.scale.set(1, 1, 0.5); blades.push(b);
  add(iris, `iris_blade_edge_${i+1}`, new THREE.TorusGeometry(0.42, 0.014, 8, 48, Math.PI*0.85), M.goldLit, [Math.cos(a)*0.24, Math.sin(a)*0.24, 0.05], [0, 0, a + Math.PI*0.5]);
}
// Event horizon: dark core with bright accretion rings and inward-spiralling motes
const hole = add(disc, 'event_horizon', new THREE.SphereGeometry(0.26, 40, 28), mat('void', 0x02030a, { roughness: 0.9, metalness: 0 }), [0, 0, -0.5]);
const accretion = add(disc, 'accretion_ring', new THREE.TorusGeometry(0.32, 0.012, 10, 96), M.goldLit, [0, 0, -0.48]);
const accretion2 = add(disc, 'accretion_ring_2', new THREE.TorusGeometry(0.42, 0.006, 8, 96), M.goldLit, [0, 0, -0.44], [0.5, 0.2, 0]);
const sun = add(disc, 'sun_core', new THREE.CircleGeometry(0.5, 48), M.sun, [0, 0, -0.56]); sun.castShadow = sun.receiveShadow = false;
const sunBack = add(disc, 'sun_halo', new THREE.CircleGeometry(1.05, 64), M.sun, [0, 0, -0.62]); sunBack.castShadow = sunBack.receiveShadow = false; sunBack.material = M.sun.clone(); sunBack.material.opacity = 0.14;
const inN = 220, inPos = new Float32Array(inN*3), inState = [];
for (let i = 0; i < inN; i++) inState.push({ a: Math.random()*6.283, r: 0.34 + Math.random()*0.95, spd: 0.8 + Math.random()*1.6, tilt: (Math.random()-0.5)*0.35 });
const inGeo = new THREE.BufferGeometry(); inGeo.setAttribute('position', new THREE.BufferAttribute(inPos, 3));
const infall = new THREE.Points(inGeo, new THREE.PointsMaterial({ color: 0xffd890, size: 0.028, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })); infall.frustumCulled = false; scene.add(infall);
const shards = Array.from({ length: 14 }, (_, i) => {
  const g = new THREE.Group(); core.add(g);
  const m = add(g, `orbit_shard_${i+1}`, crystal(0.045, 0.13, 0.09, 5), M.goldLit, [1.45 + (i%3)*0.14, 0, 0], [0.4*i, 0.2*i, 0]);
  m.castShadow = false;
  g.rotation.set((i%5)*0.25 - 0.5, i*0.9, (i%3)*0.2);
  return { g, m, spd: 0.25 + (i%4)*0.12, phase: i*0.7 };
});
// Flanking pylons: angular black-marble slabs with gold edges, leaning inward
[-1, 1].forEach((sgn, i) => {
  const g = new THREE.Group(); g.name = `pylon_${i+1}`; g.position.set(sgn*1.45, 0.99, -0.05); g.rotation.z = -sgn*0.06; model.add(g);
  add(g, `pylon_${i+1}_base`, new THREE.BoxGeometry(0.52, 0.22, 0.62), M.marble, [0, 0.11, 0]);
  add(g, `pylon_${i+1}_base_band`, new THREE.BoxGeometry(0.56, 0.04, 0.66), M.gold, [0, 0.24, 0]);
  add(g, `pylon_${i+1}_shaft`, new THREE.BoxGeometry(0.34, 1.5, 0.5), M.marbleDk, [0, 1.0, 0]);
  add(g, `pylon_${i+1}_shaft_front`, new THREE.BoxGeometry(0.06, 1.45, 0.04), M.gold, [-sgn*0.15, 1.0, 0.26]);
  add(g, `pylon_${i+1}_shaft_back`, new THREE.BoxGeometry(0.06, 1.45, 0.04), M.goldDk, [-sgn*0.15, 1.0, -0.26]);
  add(g, `pylon_${i+1}_blade`, new THREE.CylinderGeometry(0.02, 0.16, 1.1, 4), M.marbleDk, [sgn*0.02, 2.25, 0], [0, Math.PI/4, -sgn*0.16]);
  add(g, `pylon_${i+1}_blade_edge`, new THREE.CylinderGeometry(0.008, 0.05, 1.12, 4), M.gold, [sgn*0.02, 2.25, 0.06], [0, Math.PI/4, -sgn*0.16]);
  add(g, `pylon_${i+1}_collar`, new THREE.BoxGeometry(0.4, 0.06, 0.56), M.gold, [0, 1.72, 0]);
  for (let k = 0; k < 3; k++) add(g, `pylon_${i+1}_rune_${k+1}`, new THREE.BoxGeometry(0.18, 0.1, 0.02), M.goldDk, [0, 0.6 + k*0.4, 0.26]);
});
const beam = add(core, 'light_beam', new THREE.CylinderGeometry(0.02, 0.35, 4.0, 24, 1, true), M.beam, [0, 2.6, 0]); beam.castShadow = beam.receiveShadow = false;
const coreLight = new THREE.PointLight(0xffb040, 26, 5.5, 2); coreLight.position.set(0, 2.15, 0.6); model.add(coreLight);
const backLight = new THREE.PointLight(0xff9a30, 10, 4, 2); backLight.position.set(0, 2.15, -0.8); model.add(backLight);

// Odin's eye: polished gold orb with the agent's color as the glowing pupil
const buildEye = (parent, key, hex, em) => {
  const eye = new THREE.Group(); eye.name = `${key}_eye`; parent.add(eye);
  add(eye, `${key}_orb`, new THREE.SphereGeometry(0.26, 48, 34), M.eyeGold);
  add(eye, `${key}_orb_equator`, new THREE.TorusGeometry(0.262, 0.008, 8, 96), M.goldDk);
  const irisMat = Object.assign(new THREE.MeshStandardMaterial({ color: hex, emissive: em, emissiveIntensity: 2.4, roughness: 0.15, metalness: 0.1 }), { name: `${key}_pupil_glow` });
  const front = new THREE.Group(); front.name = `${key}_eye_front`; eye.add(front);
  add(front, `${key}_socket`, new THREE.TorusGeometry(0.13, 0.022, 12, 72), M.gold, [0, 0, 0.222]);
  add(front, `${key}_socket_inner`, new THREE.TorusGeometry(0.098, 0.012, 10, 64), M.goldLit, [0, 0, 0.238]);
  for (let i = 0; i < 20; i++) { const a = i/20*Math.PI*2; add(front, `${key}_lash_${i+1}`, new THREE.ConeGeometry(0.012, 0.07, 4), M.goldDk, [Math.cos(a)*0.155, Math.sin(a)*0.155, 0.208], [Math.PI/2, 0, a]); }
  const pupil = add(front, `${key}_pupil`, new THREE.SphereGeometry(0.088, 28, 20, 0, Math.PI*2, 0, 1.05), irisMat, [0, 0, 0.205], [Math.PI/2, 0, 0]);
  add(front, `${key}_pupil_core`, new THREE.SphereGeometry(0.05, 20, 14), M.pupil, [0, 0, 0.245]);
  const glint = add(front, `${key}_glint`, new THREE.CircleGeometry(0.022, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }), [-0.05, 0.055, 0.285]);
  glint.castShadow = glint.receiveShadow = false;
  const cornea = add(front, `${key}_cornea`, new THREE.SphereGeometry(0.268, 32, 20, 0, Math.PI*2, 0, 0.42), M.cornea, [0, 0, 0], [Math.PI/2, 0, 0]); cornea.castShadow = false;
  const brow = new THREE.Group(); eye.add(brow);
  [1, -1].forEach((sgn, i) => add(brow, `${key}_brow_${i+1}`, new THREE.TorusGeometry(0.3, 0.014, 8, 64, Math.PI*0.44), M.gold, [0, 0, 0], [0, 0, sgn > 0 ? Math.PI*0.28 : Math.PI*1.28]));
  return { eye, front, pupil, irisMat, glint, brow };
};

// Stations: dark marble plinths with gold trim and Odin's eyes; gold channels to the throne
const stations = agents.map(a => {
  const ang = THREE.MathUtils.degToRad(a.angle), R = 3.05;
  const grp = new THREE.Group(); grp.name = `${a.key}_station`; grp.position.set(Math.cos(ang)*R, 0, Math.sin(ang)*R); grp.rotation.y = -ang + Math.PI/2;
  add(grp, `${a.key}_plinth_base`, new THREE.CylinderGeometry(0.46, 0.5, 0.12, 8), M.marbleDk, [0, 0.28, 0]);
  add(grp, `${a.key}_plinth`, new THREE.CylinderGeometry(0.36, 0.42, 0.34, 8), M.marble, [0, 0.51, 0]);
  add(grp, `${a.key}_plinth_band`, new THREE.TorusGeometry(0.4, 0.014, 8, 48), M.gold, [0, 0.36, 0], [Math.PI/2, 0, 0]);
  add(grp, `${a.key}_plinth_cap`, new THREE.CylinderGeometry(0.38, 0.36, 0.05, 8), M.gold, [0, 0.705, 0]);
  add(grp, `${a.key}_plaque`, new THREE.BoxGeometry(0.3, 0.14, 0.02), M.goldDk, [0, 0.52, 0.41]);
  const glowRing = add(grp, `${a.key}_glow_ring`, new THREE.TorusGeometry(0.22, 0.012, 8, 48), mat(`${a.key}_glow`, a.hex, { emissive: a.hex, emissiveIntensity: 2, roughness: 1, metalness: 0 }), [0, 0.74, 0], [Math.PI/2, 0, 0]);
  // Glowing gold sigil on the floor beneath the plinth
  const sigilMat = new THREE.MeshBasicMaterial({ color: a.hex, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
  const sigil = add(grp, `${a.key}_floor_sigil`, new THREE.RingGeometry(0.54, 0.78, 64), sigilMat, [0, 0.231 - 0.0, 0], [-Math.PI/2, 0, 0]); sigil.castShadow = sigil.receiveShadow = false; sigil.position.y = 0.231;
  const sigilRing = add(grp, `${a.key}_floor_ring`, new THREE.TorusGeometry(0.82, 0.014, 8, 96), M.goldGlow, [0, 0.235, 0], [Math.PI/2, 0, 0]); sigilRing.castShadow = false;
  const eyeParts = buildEye(new THREE.Group(), a.key, a.hex, a.em);
  const gemGrp = eyeParts.eye.parent; gemGrp.position.y = 1.24; grp.add(gemGrp);
  const gm = eyeParts.eye.children[0];
  const halo = add(gemGrp, `${a.key}_halo`, new THREE.TorusGeometry(0.42, 0.01, 8, 64), M.gold, [0,0,0], [Math.PI/2 + 0.5, 0.3, 0]);
  const light = new THREE.PointLight(a.hex, 4, 2.4, 2); light.position.y = 1.3; grp.add(light);
  const chanLen = R - 1.62;
  const chanMat = mat(`${a.key}_channel`, 0xffd27a, { emissive: 0xffa030, emissiveIntensity: 1.2, roughness: 0.5 });
  const chan = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.01, chanLen), chanMat); chan.name = `${a.key}_channel`;
  chan.position.set(Math.cos(ang)*(R + 1.62)/2, 0.226, Math.sin(ang)*(R + 1.62)/2); chan.rotation.y = -ang + Math.PI/2; chan.castShadow = false; model.add(chan);
  const pulseMat = new THREE.MeshBasicMaterial({ color: 0xfff0c0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  const pulseMesh = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), pulseMat); pulseMesh.name = `${a.key}_pulse`; scene.add(pulseMesh);
  // Glowing arc connecting Odin to this agent: a curved tube plus a travelling bead
  const from = new THREE.Vector3(Math.cos(ang)*R, 1.24, Math.sin(ang)*R), to = new THREE.Vector3(0, 2.15, 0);
  const midPt = from.clone().lerp(to, 0.5); midPt.y += 0.75;
  const curve = new THREE.QuadraticBezierCurve3(from, midPt, to);
  const threadMat = mat(`${a.key}_link`, a.hex, { emissive: a.hex, emissiveIntensity: 2.6, transparent: true, opacity: 0.32, roughness: 1, metalness: 0 });
  const thread = new THREE.Mesh(new THREE.TubeGeometry(curve, 56, 0.022, 8, false), threadMat); thread.name = `${a.key}_link`;
  thread.castShadow = thread.receiveShadow = false; model.add(thread);
  const glowMat = new THREE.MeshBasicMaterial({ color: a.hex, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false });
  const threadGlow = new THREE.Mesh(new THREE.TubeGeometry(curve, 56, 0.075, 8, false), glowMat); threadGlow.name = `${a.key}_link_glow`;
  threadGlow.castShadow = threadGlow.receiveShadow = false; model.add(threadGlow);
  const beadMat = new THREE.MeshBasicMaterial({ color: 0xfff2d0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  const bead = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), beadMat); bead.name = `${a.key}_link_bead`; scene.add(bead);
  model.add(grp);
  return { a, grp, gemGrp, gm, eyeParts, m: eyeParts.irisMat, halo, glowRing, light, chanMat, pulseMesh, pulseMat, threadMat, glowMat, sigilMat, curve, bead, beadMat, ang, R, phase: Math.random()*6.28, hot: 0, pulseT: Math.random(), beadT: Math.random() };
});
stage.setObject(model);
model.traverse(o => { if (o.isMesh && /band|inlay|spoke|halo|glow|channel|girdle|stud|edge|panel|plaque|link|gem_|trim|tooth|accretion|layer|sigil|lash|glint|cornea|brow|socket|equator|floor_ring/.test(o.name)) o.castShadow = false; });

// Viewer-only: gold motes, shockwave
const dustN = 280, dustPos = new Float32Array(dustN*3), dustSeed = new Float32Array(dustN);
for (let i = 0; i < dustN; i++) { const a = Math.random()*6.283, r = 0.3 + Math.random()*2.9; dustPos.set([Math.cos(a)*r, 0.3 + Math.random()*4.0, Math.sin(a)*r], i*3); dustSeed[i] = Math.random()*6.283; }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffc070, size: 0.03, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false })); scene.add(dust);
const shockMat = new THREE.MeshBasicMaterial({ color: 0xffc060, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const shock = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.0, 96), shockMat); shock.rotation.x = -Math.PI/2; shock.position.y = 0.24; scene.add(shock);
const ringShock = new THREE.Mesh(new THREE.RingGeometry(1.2, 1.3, 96), shockMat.clone()); ringShock.position.set(0, 2.15, 0); scene.add(ringShock);
let shockT = 0;

const frame = () => {
  const w = renderer.domElement.clientWidth || 1, h = renderer.domElement.clientHeight || 1;
  camera.aspect = w / h;
  const r = 4.6, vfov = camera.fov * Math.PI / 360, hfov = Math.atan(Math.tan(vfov) * camera.aspect);
  const d = r / Math.sin(Math.min(vfov, hfov)) * 0.95;
  controls.target.set(0, 1.5, 0);
  camera.position.copy(controls.target).add(new THREE.Vector3(0.35, 0.45, 1).normalize().multiplyScalar(d));
  camera.near = 0.05; camera.far = 200; camera.updateProjectionMatrix(); controls.update();
};
frame(); window.addEventListener('resize', frame);
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

const labelsEl = document.getElementById('labels'), flash = document.getElementById('flash');
const mkLabel = (name, role, css, extra='') => { const d = document.createElement('div'); d.className = 'lbl ' + extra; d.style.setProperty('--c', css); d.innerHTML = `<span class="dot"></span><span class="plate"><b>${name}</b><small>${role}</small></span>`; labelsEl.appendChild(d); return d; };
const coreLabel = mkLabel('ODIN', 'ALL FATHER · THE SOURCE · PAPER / SIM', '#ffd27a', 'core');
stations.forEach(s => s.label = mkLabel(s.a.name, s.a.role, s.a.css));
const v = new THREE.Vector3(), occRay = new THREE.Raycaster();
const occluders = [...model.children.filter(o => o.isMesh && /pedestal_drum|floor_disc/.test(o.name)), ...disc.children.filter(o => /disc_rim$|disc_layer_\d$/.test(o.name)), ...model.children.filter(o => o.name.startsWith('pylon')).flatMap(g => g.children.filter(o => /shaft$|base$|blade$/.test(o.name)))];
const place = (el, obj, dy, up=false, occ=null) => {
  obj.getWorldPosition(v);
  let visible = true;
  if (occ) { const dir = v.clone().sub(camera.position), dist = dir.length(); occRay.set(camera.position, dir.normalize()); occRay.far = dist - 0.3; visible = occRay.intersectObjects(occ, false).length === 0; }
  v.y += dy; v.project(camera);
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  const s = THREE.MathUtils.clamp(7 / camera.position.distanceTo(controls.target), 0.7, 1.4);
  const px = (v.x*0.5+0.5)*w, py = THREE.MathUtils.clamp((-v.y*0.5+0.5)*h + (up ? -34 : 26)*s, up ? 96 : 8, h - (up ? 8 : 96));
  el.style.transform = `translate(-50%,${up ? '-100%' : '0'}) translate(${px}px,${py}px) scale(${s})`;
  el.style.opacity = visible && v.z < 1 ? 1 : 0;
};

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(-9, -9), ptrLerp = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => { const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1); });
renderer.domElement.addEventListener('pointerleave', () => ptr.set(-9, -9));
let pulse = 0, hit = null, frameNo = 0, irisSpin = 0;
renderer.domElement.addEventListener('pointerdown', () => {
  pulse = 1; shockT = 1; irisSpin += 6;
  const target = hit && stations.find(s => s.gm === hit.object); if (target) target.hot = Math.max(target.hot, 1.2);
  stations.forEach(s => s.pulseT = 0);
});
const corePickables = [...blades, sun];
const clock = new THREE.Clock(); let coreHotV = 0;
const _C = new THREE.Vector3(), _P2 = new THREE.Vector3(), _E = new THREE.Vector3(), _E2 = new THREE.Vector3();
const stepFrame = () => {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta() || 0.016, 0.05), k = 1 - Math.exp(-dt * 6);
  ptrLerp.lerp(ptr.x < -5 ? new THREE.Vector2() : ptr, k);
  pulse *= Math.exp(-dt * 4); shockT *= Math.exp(-dt * 2.2); irisSpin *= Math.exp(-dt * 1.5);
  const beat = 0.5 + 0.5*Math.sin(t*1.4);

  if (!(frameNo++ % 3)) { ray.setFromCamera(ptr, camera); hit = ray.intersectObjects(stations.map(s => s.gm).concat(corePickables))[0]; }
  const coreHot = hit && corePickables.includes(hit.object); coreHotV += ((coreHot ? 1 : 0) - coreHotV)*k;
  coreLabel.classList.toggle('hot', !!coreHot);

  // Throne: the disc always faces the viewer, with a slight cursor-driven lean
  core.position.y = 2.15 + Math.sin(t*1.0)*0.03;
  disc.quaternion.copy(camera.quaternion);
  disc.rotateY(ptrLerp.x*0.16); disc.rotateX(-ptrLerp.y*0.12);
  iris.rotation.z = t*0.35 + irisSpin*0.5 + coreHotV*0.6;
  const open = 0.22 + beat*0.05 + coreHotV*0.14 + pulse*0.22;
  blades.forEach((b, i) => { const a = i/10*Math.PI*2; b.position.set(Math.cos(a)*open, Math.sin(a)*open, 0); iris.children[i*2+1].position.set(Math.cos(a)*open, Math.sin(a)*open, 0.05); });
  layers.forEach((L, i) => { const sp = (0.18 + i*0.05)*L.dir; L.teeth.rotation.z += sp*dt*(1 + pulse*3 + coreHotV); L.trim.rotation.z -= sp*dt*0.5; const d = L.base - (beat*0.012 + pulse*0.05)*(i+1)*0.5; L.ring.position.z = d; L.trim.position.z = d + 0.035; L.teeth.position.z = d; });
  accretion.rotation.z += (1.4 + pulse*6)*dt; accretion.scale.setScalar(1 + beat*0.04 + pulse*0.25);
  accretion2.rotation.z -= (0.9 + pulse*4)*dt; accretion2.scale.setScalar(1 + Math.sin(t*1.7)*0.05 + pulse*0.3);
  hole.scale.setScalar(1 + beat*0.02 + coreHotV*0.06 - pulse*0.1);
  M.sun.opacity = 0.32 + beat*0.2 + coreHotV*0.35 + pulse*0.55; sun.scale.setScalar(1 + beat*0.06 + coreHotV*0.25 + pulse*0.5);
  sunBack.material.opacity = 0.1 + beat*0.07 + pulse*0.35;
  shards.forEach((s, i) => { s.g.rotation.y += s.spd*dt*(1 + coreHotV*0.8 + pulse*2); s.m.rotation.x += 1.2*dt; s.m.position.x = 1.45 + (i%3)*0.14 + Math.sin(t*1.1 + s.phase)*0.06 + pulse*0.35; });
  { const p = inGeo.attributes.position.array; core.getWorldPosition(_C);
    for (let i = 0; i < inN; i++) { const st2 = inState[i];
      st2.a += dt*st2.spd*(0.6 + 1.1/Math.max(st2.r, 0.2))*(1 + pulse); st2.r -= dt*(0.12 + pulse*0.5)*(1.2 - st2.r*0.5);
      if (st2.r < 0.3) { st2.r = 0.9 + Math.random()*0.5; st2.a = Math.random()*6.283; }
      _P2.set(Math.cos(st2.a)*st2.r, Math.sin(st2.a)*st2.r, -0.5 + st2.tilt*st2.r*0.3).applyQuaternion(disc.quaternion).add(_C);
      p[i*3] = _P2.x; p[i*3+1] = _P2.y; p[i*3+2] = _P2.z; }
    inGeo.attributes.position.needsUpdate = true; infall.material.opacity = 0.55 + beat*0.2 + coreHotV*0.3 + pulse*0.4; infall.material.size = 0.026 + pulse*0.02; }
  M.goldGlow.emissiveIntensity = 1.2 + beat*0.5 + pulse*2.5;
  councilRing.material.opacity = 0.12 + beat*0.06 + pulse*0.35;
  innerGlowDisc.material.opacity = 0.05 + beat*0.03 + pulse*0.2;
  M.goldLit.emissiveIntensity = 1.0 + beat*0.6 + coreHotV*1.2 + pulse*2.5;
  M.beam.opacity = 0.03 + beat*0.03 + pulse*0.3;
  coreLight.intensity = 24 + beat*12 + coreHotV*25 + pulse*70; backLight.intensity = 9 + beat*5 + pulse*25;
  disc.children.forEach(o => { if (/disc_stud/.test(o.name)) return; });
  { const p = dustGeo.attributes.position.array; for (let i = 0; i < dustN; i++) { p[i*3+1] += dt*(0.07 + 0.06*Math.sin(dustSeed[i])); p[i*3] += Math.sin(t*0.6 + dustSeed[i])*dt*0.05; if (p[i*3+1] > 4.4) p[i*3+1] = 0.3; } dustGeo.attributes.position.needsUpdate = true; dust.material.opacity = 0.45 + beat*0.3 + pulse*0.4; }
  const sw = 1 + (1 - shockT)*3.2; shock.scale.set(sw, sw, 1); shockMat.opacity = shockT*0.8;
  const rs = 1 + (1 - shockT)*1.6; ringShock.scale.set(rs, rs, 1); ringShock.material.opacity = shockT*0.7; ringShock.quaternion.copy(camera.quaternion);
  flash.style.opacity = pulse*0.55;

  stations.forEach((s, i) => {
    const target = hit && hit.object === s.gm ? 1 : 0;
    s.hot += (target - s.hot)*k;
    const bob = Math.sin(t*1.7 + s.phase)*0.05;
    s.gemGrp.position.y = 1.32 + bob + s.hot*0.14;
    // Eyes watch the viewer, with a slow wander and a hover lean toward the camera
    _E.copy(camera.position); s.gemGrp.worldToLocal(_E);
    _E.x += Math.sin(t*0.5 + s.phase)*0.5; _E.y += Math.cos(t*0.37 + s.phase)*0.35;
    s.eyeParts.eye.lookAt(_E);
    s.gemGrp.rotation.z = Math.sin(t*1.1 + s.phase)*0.05;
    s.halo.rotation.z += (1.0 + s.hot*3)*dt;
    s.gemGrp.scale.setScalar(1.3 + s.hot*0.28 + pulse*0.14);
    const blink = Math.max(0, 1 - Math.abs(((t*0.28 + s.phase) % 4) - 0.12)*9);
    s.eyeParts.eye.scale.set(1, 1 - blink*0.9, 1);
    const flicker = 0.5 + 0.5*Math.sin(t*3 + s.phase*2);
    s.m.emissiveIntensity = 1.8 + flicker*0.6 + s.hot*2.5 + pulse*1.8;
    s.eyeParts.pupil.scale.setScalar(1 - 0.12*flicker - s.hot*0.18 + pulse*0.25);
    s.glowRing.material.emissiveIntensity = 1.5 + flicker + s.hot*3 + pulse*2;
    s.light.intensity = 3.5 + flicker*2 + s.hot*10 + pulse*8;
    s.sigilMat.opacity = 0.26 + flicker*0.1 + s.hot*0.35 + pulse*0.3;
    s.threadMat.opacity = 0.5 + flicker*0.2 + s.hot*0.4 + pulse*0.3;
    s.glowMat.opacity = 0.14 + flicker*0.08 + s.hot*0.35 + pulse*0.35;
    s.beadT += dt*(0.32 + s.hot*0.5 + pulse*1.2); if (s.beadT > 1.15) s.beadT = -0.15 - Math.random()*0.5;
    const bt = THREE.MathUtils.clamp(s.beadT, 0, 1);
    s.curve.getPoint(1 - bt, _E2); s.bead.position.copy(_E2);
    s.beadMat.opacity = (s.beadT >= 0 && s.beadT <= 1) ? 0.5 + Math.sin(bt*Math.PI)*0.5 : 0;
    s.bead.scale.setScalar(1 + s.hot*0.8 + pulse*1.2);
    s.pulseT += dt*(0.45 + s.hot*0.6 + pulse*0.8); if (s.pulseT > 1.25) s.pulseT = -0.2 - Math.random()*0.6;
    const pt = THREE.MathUtils.clamp(s.pulseT, 0, 1), rr = s.R - pt*(s.R - 1.62);
    s.pulseMesh.position.set(Math.cos(s.ang)*rr, 0.26 + Math.sin(pt*Math.PI)*0.04, Math.sin(s.ang)*rr);
    s.pulseMat.opacity = (s.pulseT >= 0 && s.pulseT <= 1) ? 0.6 + Math.sin(pt*Math.PI)*0.4 : 0;
    s.pulseMesh.scale.setScalar(1 + s.hot + pulse*1.5);
    s.chanMat.emissiveIntensity = 0.9 + Math.sin(pt*Math.PI)*0.9 + s.hot*1.2 + pulse*2;
    s.label.classList.toggle('hot', s.hot > 0.5);
    if (!(frameNo % 3)) place(s.label, s.gemGrp, -0.55, false, occluders);
  });
  if (!(frameNo % 3)) place(coreLabel, core, 1.45, true);

  controls.update();
  renderer.render(scene, camera);
};
renderer.setAnimationLoop(stepFrame);
</script>
