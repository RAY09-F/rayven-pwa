# Reclaims the OLD Worker name so the old workers.dev hostname resolves again
# and forwards to the real backend. This is deliberately a separate, minimal
# Worker — it has no KV, no Vectorize, no AI, and no secrets, because it only
# proxies. The real backend is `asgrard-backend`, configured in ../wrangler.toml.
#
# Deploy from THIS directory:  npx wrangler deploy
# (running it from the repo root deploys the real backend instead)
name = "rayven-backend"
main = "src/index.js"
compatibility_date = "2026-08-13"

# REQUIRED, and the reason this shim silently did nothing for hours on
# 2026-08-15: the script deployed fine, but no workers.dev hostname was bound to
# it, so https://rayven-backend.rayanfahil2.workers.dev/ returned Cloudflare's
# own generic 404 HTML page and the forwarding code never ran once. A 404 with
# `server: cloudflare` and no worker headers means "nothing is listening on this
# hostname" — it does NOT mean the worker ran and 404'd. Check for that first.
workers_dev = true

# Forward over a service binding rather than a public fetch() to the target's
# workers.dev URL. Same-account Worker-to-Worker calls over the public hostname
# are the fragile path (they leave the edge and can loop back on themselves);
# a service binding dispatches in-process, adds no network hop, and cannot loop.
[[services]]
binding = "BACKEND"
service = "asgrard-backend"
