<head><title>ASGARD Flow</title><meta description="Two-second fast rainbow spin landing on the selected agent palette"/><meta publisher="ASGARD"/></head>
<body style="margin:0"><canvas id="lights" width="320" height="200"></canvas></body>
<script>
var ctx=document.getElementById('lights').getContext('2d');
// Existing calibrated RGB colors and accent geometry. Device channel correction
// stays in the device plugins, not in this shared canvas.
var palettes={thor:[71,179,255,255,144,0,12],loki:[0,100,0,255,255,255,9],odin:[255,144,0,255,255,255,9],locked:[176,0,0,255,255,255,0]};
var mode='odin',target=palettes[mode].slice(),started=-2000,duration=2000,phase=0;
function spinProgress(now){return Math.max(0,Math.min(1,(now-started)/duration));}
function onCanvasApiEvent(event){
 if(event.sender!=='asgard-rgb'||!Object.prototype.hasOwnProperty.call(palettes,event.event)||event.event===mode)return;
 mode=event.event;target=palettes[mode].slice();started=Date.now();phase=Math.random()*Math.PI*2;
}
function rgb(p,offset){return 'rgb('+p.slice(offset,offset+3).map(Math.round).join(',')+')';}
function paintPalette(p){
 ctx.fillStyle=rgb(p,0);ctx.fillRect(0,0,320,200);ctx.fillStyle=rgb(p,3);
 for(var x=-80;x<360;x+=36){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+p[6],0);ctx.lineTo(x+70+p[6],200);ctx.lineTo(x+70,200);ctx.closePath();ctx.fill();}
}
function paint(){
 var now=Date.now(),progress=spinProgress(now);ctx.globalAlpha=1;
 paintPalette(target);
 if(progress<1){
  // Rotating rainbow spokes on the shared lighting canvas, not fan-speed control.
  // Random starting phase; the landing color always comes from the selected agent.
  var angle=phase+(now-started)/1000*Math.PI*2*7;
  ctx.globalAlpha=progress<0.9?1:Math.pow((1-progress)/0.1,2);
  for(var i=0;i<72;i++){
   var a=angle+i*Math.PI*2/72,b=a+Math.PI*2/72+0.004;
   ctx.fillStyle='hsl('+(i*5)+',100%,50%)';ctx.beginPath();ctx.moveTo(160,100);
   ctx.lineTo(160+400*Math.cos(a),100+400*Math.sin(a));
   ctx.lineTo(160+400*Math.cos(b),100+400*Math.sin(b));ctx.closePath();ctx.fill();
  }
 }
 ctx.globalAlpha=1;requestAnimationFrame(paint);
}paint();
</script>
