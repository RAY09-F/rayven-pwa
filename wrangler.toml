# ASGARD — one Worker, three personas (THOR / LOKI / ODIN).
#
# Entry point is the src/ module tree. src/lib/personas.js is the single source
# of truth for prompts, tool allow-lists, memory namespaces, voices and bots —
# derive every persona list from Object.keys(PERSONAS), never hand-write one.
#
# The script NAME stays "asgrard-backend" (yes, misspelled on Cloudflare). All
# 17 secrets, the workers.dev URL, and the
# Telegram webhook are attached to the script NAME, not to the code inside it.
# Deploying under a name that does not exist silently CREATES a second, empty
# Worker with no secrets while the real one keeps serving. The old name
# "rayven-backend" was reclaimed by a stub and holds none of the secrets, so
# renaming back is a deliberate migration (re-add every secret, re-point the
# Telegram webhook, update BACKEND_URL in index.html) — never a casual edit.
name = "asgrard-backend"
main = "src/index.js"
compatibility_date = "2026-08-13"

# ASGARD is served straight from the worker: public/index.html is a COPY of the
# repo-root index.html, so re-copy it after every edit or the live page silently
# stays stale. There is exactly ONE page — THOR, LOKI and ODIN are personas
# switched inside it, not separate builds. /thor/, /loki/ and /odin/ 301 to
# /?persona=<id> so old bookmarks still work.
#
# run_worker_first is REQUIRED. Without it Cloudflare's static-asset handler
# claims the "/" route for EVERY HTTP method, not just GET, so POST / — the web
# chat endpoint AND the RAYVENN_RAYAN_BOT Telegram webhook — starts returning a
# flat 405. With it on, fetch() in src/index.js runs for every request and only
# its unmatched-GET fallthrough ever calls env.ASSETS.fetch().
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "RAYVEN_KV"
id = "ee3cce96335249a9a4cc990cdfd8a2a5"

# Vector-backed memory: search_memory embeds the query and matches against the
# index so a persona can recall something worded differently. Used by src/lib/memory.js.
[[vectorize]]
binding = "VECTORIZE"
index_name = "rayven-memory"

[ai]
binding = "AI"

# R2. The bucket already held the clip media; binding it means the Worker can
# WRITE to it too — generated images get a public link instead of being stranded
# as base64, and Odin can put rendered clips there without a manual upload.
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "asgardclips"

[triggers]
# Every 5 minutes. Each background job (proactive check-in, morning briefing,
# self-code-check) keeps its own "last run" marker in KV and decides internally
# whether it is actually due on this tick.
crons = ["*/5 * * * *"]
