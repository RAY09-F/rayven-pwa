<!DOCTYPE html>
<html lang="en" data-realm="odin" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASGARD · Council HUD</title>
<meta name="description" content="ASGARD three-realm council HUD — Thor, Loki and Odin.">

<link rel="stylesheet" href="/ui/hud-real-v1/hud/fonts.css">
<link rel="stylesheet" href="/ui/hud-real-v1/hud/hud.css">
<style>
/* Recorded conversations can be much longer than the reference examples. */
.hud-art .msgs{min-height:0;overflow:auto;overscroll-behavior:contain}
.hud-art .bubble{overflow-wrap:anywhere;white-space:pre-wrap}
.hud-art .msg-bot,.hud-art .msg-user{flex-shrink:0}
</style>
</head>
<body>
<div class="hud-host" id="hud"></div>
<script type="module">
import {createHUD} from '/ui/hud-real-v1/hud/hud.js';
const q = new URLSearchParams(location.search);
const requestedRealm = q.get('hall') || q.get('persona');
if (!location.hash && ['thor','loki','odin'].includes(requestedRealm)) location.hash = requestedRealm;
const flag = (k, d) => q.has(k) ? q.get(k) !== 'false' && q.get(k) !== '0' : d;
window.AsgardHUD = createHUD(document.getElementById('hud'), {
 scanlines: flag('scanlines', true),
 telemetry: flag('telemetry', true),
 motion: flag('motion', true)
});
</script>
</body>
</html>
