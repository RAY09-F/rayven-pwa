<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b16">
<title>ODIN — The High Seat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Questrial&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b16;
  --bg2: #0b1120;
  --panel: rgba(15, 22, 41, 0.82);
  --panel-border: rgba(216, 178, 90, 0.22);
  --gold: #d8b25a;
  --gold-bright: #f2d488;
  --gold-dim: rgba(216, 178, 90, 0.5);
  --blue: #2c4a8f;
  --blue-bright: #5a7fd4;
  --silver: #e9edf5;
  --text: #e6e9f2;
  --text-dim: #8a92ad;
  --danger: #ff5d6c;
  --ok: #58d68d;
  --radius: 4px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background:
    linear-gradient(180deg, rgba(44,74,143,0.12) 0%, transparent 30%),
    radial-gradient(ellipse at 50% 115%, rgba(216,178,90,0.1) 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: 'Questrial', system-ui, sans-serif;
  font-size: 14.5px;
  user-select: none; -webkit-user-select: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input, textarea, select { user-select: text; -webkit-user-select: text; }

/* ---------- lock ---------- */
#lockScreen {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  background: radial-gradient(ellipse at 50% 30%, #101a33 0%, #05070e 70%);
  transition: opacity 0.7s ease, visibility 0.7s;
}
#lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#lockScreen .sigil { font-family: 'Marcellus', serif; font-size: 46px; color: var(--gold); letter-spacing: 16px; text-indent: 16px; text-shadow: 0 0 34px rgba(90,127,212,0.5); }
#lockScreen .subtitle { color: var(--text-dim); letter-spacing: 5px; font-size: 12px; text-transform: uppercase; }
#lockInput {
  background: rgba(216,178,90,0.06); border: 1px solid var(--panel-border); border-radius: 3px;
  color: var(--text); font-family: inherit; font-size: 17px; letter-spacing: 3px;
  padding: 10px 18px; text-align: center; outline: none; width: 230px;
}
#lockInput:focus { border-color: var(--gold); box-shadow: 0 0 18px rgba(216,178,90,0.2); }
#lockInput.shake { animation: shake 0.35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

/* ---------- header — the lintel ---------- */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 54px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  background: linear-gradient(180deg, rgba(7,11,22,0.95), rgba(7,11,22,0));
  border-bottom: 1px solid rgba(216,178,90,0.14);
  padding-top: env(safe-area-inset-top);
}
#wordmark { font-family: 'Marcellus', serif; font-size: 21px; letter-spacing: 9px; color: var(--gold); display: flex; align-items: center; gap: 12px; }
#wordmark .seat { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); font-family: 'Questrial'; }
#statusStrip { display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #555; margin-right: 5px; vertical-align: 1px; transition: background .4s, box-shadow .4s; }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.warn { background: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
.dot.off { background: var(--danger); }
#switcher { position: relative; }
#switcherMenu {
  position: absolute; right: 0; top: 110%; background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 4px; overflow: hidden; display: none; min-width: 150px; backdrop-filter: blur(12px); z-index: 30;
}
#switcherMenu.open { display: block; }
#switcherMenu a { display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 13px; letter-spacing: 2px; }
#switcherMenu a:hover { background: rgba(216,178,90,0.12); }

/* ---------- KPI lintel row ---------- */
#kpiRow {
  position: fixed; top: 54px; left: 0; right: 0; z-index: 18;
  display: flex; gap: 10px; padding: 8px 20px; overflow-x: auto; scrollbar-width: none;
  justify-content: center;
}
#kpiRow::-webkit-scrollbar { display: none; }
.kpiCard {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
  border-top: 2px solid var(--gold-dim);
  padding: 8px 18px; min-width: 130px; text-align: center; flex-shrink: 0; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.kpiCard:hover { border-color: var(--gold); background: rgba(216,178,90,0.06); }
.kpiCard .kLabel { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); text-transform: uppercase; }
.kpiCard .kValue { font-family: 'Marcellus', serif; font-size: 22px; color: var(--gold-bright); margin-top: 2px; }
.kpiCard .kWhen { font-size: 9.5px; color: var(--text-dim); margin-top: 1px; }
.kpiCard.add { display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 20px; min-width: 52px; border-style: dashed; }
.kpiCard.add:hover { color: var(--gold); }
.kpiCard.empty { border-style: dashed; cursor: default; color: var(--text-dim); font-size: 12px; display: flex; align-items: center; padding: 8px 22px; font-style: italic; }

/* ---------- throne-room grid ---------- */
#appGrid {
  position: fixed; inset: 0; top: 118px; bottom: 58px;
  display: grid; grid-template-columns: 330px 1fr 330px; gap: 14px; padding: 6px 20px;
  max-width: 1600px; margin: 0 auto;
}
#colLeft, #colRight { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scrollbar-width: thin; padding-bottom: 10px; }
#colLeft::-webkit-scrollbar, #colRight::-webkit-scrollbar { width: 4px; }
#colLeft::-webkit-scrollbar-thumb, #colRight::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
#centerStage { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; min-width: 0; }
#stageCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- panels: architectural, squared, column-capped ---------- */
.panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
  border-top: 2px solid var(--gold-dim);
  backdrop-filter: blur(10px); overflow: hidden; flex-shrink: 0;
}
.panel > header {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 15px; cursor: pointer;
  font-family: 'Marcellus', serif; font-size: 14px; letter-spacing: 3.5px; color: var(--gold); text-transform: uppercase;
  border-bottom: 1px solid transparent; transition: border-color .3s;
}
.panel:not(.collapsed) > header { border-bottom-color: rgba(216,178,90,0.12); }
.panel > header .chev { color: var(--text-dim); font-size: 11px; transition: transform 0.25s ease; }
.panel.collapsed > header .chev { transform: rotate(-90deg); }
.panel > .body { padding: 12px 15px; }
.panel.collapsed > .body { display: none; }
.btn {
  border: 1px solid var(--panel-border); background: rgba(216,178,90,0.07); color: var(--text);
  font-family: inherit; font-size: 12.5px; letter-spacing: 1px; border-radius: 3px;
  padding: 7px 14px; cursor: pointer; transition: all 0.16s ease;
}
.btn:hover { border-color: var(--gold); background: rgba(216,178,90,0.15); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn.gold { border-color: var(--gold-dim); color: var(--gold-bright); background: rgba(216,178,90,0.1); }
.btn.gold:hover { background: rgba(216,178,90,0.2); }
.btn.small { font-size: 11px; padding: 4px 10px; }
.rowInput {
  background: rgba(5,8,16,0.7); border: 1px solid var(--panel-border); border-radius: 3px;
  color: var(--text); font-family: inherit; font-size: 13px; padding: 6px 10px; outline: none; width: 100%;
}
.rowInput:focus { border-color: var(--gold-dim); }
select.rowInput { width: auto; }
.muted { color: var(--text-dim); font-size: 12.5px; }
.emptyState { color: var(--text-dim); font-size: 12.5px; font-style: italic; padding: 4px 0; }

/* goals */
.goalRow { padding: 8px 0; border-bottom: 1px solid rgba(216,178,90,0.08); }
.goalRow:last-child { border-bottom: none; }
.goalTop { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goalTitle { font-size: 13.5px; }
.goalPct { font-family: 'Marcellus', serif; color: var(--gold-bright); font-size: 15px; }
.goalBarWrap { height: 5px; background: rgba(216,178,90,0.12); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.goalBar { height: 100%; background: linear-gradient(90deg, var(--blue-bright), var(--gold)); transition: width 0.6s ease; }
.goalMeta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-dim); margin-top: 4px; }

/* clipping */
#clipSummary { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
#clipCount { font-family: 'Marcellus', serif; font-size: 26px; color: var(--gold-bright); }
.clipRow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(216,178,90,0.08); font-size: 12.5px; }
.clipRow:last-child { border-bottom: none; }
.clipRow .plat { width: 22px; text-align: center; }
.clipRow .handle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.clipRow .stat { font-size: 10px; letter-spacing: 1px; padding: 2px 7px; border-radius: 2px; text-transform: uppercase; }
.clipRow .stat.active { background: rgba(88,214,141,0.15); color: var(--ok); }
.clipRow .stat.setup { background: rgba(216,178,90,0.15); color: var(--gold); }
.clipRow .stat.paused { background: rgba(255,93,108,0.15); color: var(--danger); }
.clipRow .nums { color: var(--text-dim); font-size: 11px; white-space: nowrap; }

/* reports */
.repRow { padding: 8px 0; border-bottom: 1px solid rgba(216,178,90,0.08); cursor: pointer; }
.repRow:last-child { border-bottom: none; }
.repRow .repDate { font-family: 'Marcellus', serif; color: var(--gold); font-size: 13px; letter-spacing: 1px; }
.repRow .repPreview { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.repRow.expanded .repPreview { white-space: pre-wrap; color: var(--text); max-height: 300px; overflow-y: auto; }

/* text box + input */
#textBox {
  position: relative; z-index: 5; width: min(600px, 92%); height: 64px; margin-bottom: 10px;
  background: linear-gradient(180deg, rgba(15,22,41,0.88), rgba(9,13,26,0.92));
  border: 1px solid var(--panel-border); border-top: 2px solid var(--gold-dim); border-radius: 4px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  overflow: hidden; flex-shrink: 0;
}
.tbLayer {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 8px 18px; text-align: center; font-size: 16px; line-height: 1.3;
  opacity: 0; transition: opacity 0.45s ease; overflow-y: auto; scrollbar-width: none;
}
.tbLayer::-webkit-scrollbar { display: none; }
.tbLayer.visible { opacity: 1; }
.tbLayer.user { color: var(--text-dim); font-style: italic; }
.tbLayer.assistant { color: var(--silver); font-family: 'Marcellus', serif; font-size: 15.5px; }
.tbLayer.small { font-size: 12.5px; align-items: flex-start; }
.tbLayer .inner { max-height: 100%; width: 100%; }
#inputRow { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; width: min(600px, 92%); margin-bottom: 6px; flex-shrink: 0; }
#userInput {
  flex: 1; background: rgba(15,22,41,0.8); border: 1px solid var(--panel-border); border-radius: 3px;
  color: var(--text); font-family: inherit; font-size: 14px; padding: 9px 14px; outline: none; min-width: 0;
}
#userInput:focus { border-color: var(--gold-dim); }
.iconBtn {
  width: 38px; height: 38px; border-radius: 3px; border: 1px solid var(--panel-border); flex-shrink: 0;
  background: rgba(15,22,41,0.8); color: var(--text-dim); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.18s ease;
}
.iconBtn:hover { border-color: var(--gold); color: var(--text); background: rgba(216,178,90,0.1); }
.iconBtn:active { transform: scale(0.94); }
.iconBtn:disabled { opacity: 0.35; cursor: default; }
.iconBtn.danger { border-color: var(--danger); color: var(--danger); }
#micBtn.listening { border-color: var(--blue-bright); color: var(--blue-bright); animation: micPulse 1.6s ease-in-out infinite; }
#micBtn.awake { border-color: var(--gold); color: var(--gold); animation: micPulse 1s ease-in-out infinite; }
#micBtn.muted { border-color: var(--danger); color: var(--danger); animation: none; }
#micBtn.paused { border-color: var(--text-dim); color: var(--text-dim); animation: none; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 4px rgba(216,178,90,0.2); } 50% { box-shadow: 0 0 18px rgba(216,178,90,0.5); } }
#pttBtn.held { border-color: var(--gold); color: var(--bg); background: var(--gold); }
#voiceStatus { position: relative; z-index: 5; font-size: 11px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 8px; height: 15px; text-align: center; }

/* drawer */
#drawerBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 58px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(0deg, rgba(7,11,22,0.95), rgba(7,11,22,0));
  padding-bottom: env(safe-area-inset-bottom);
}
.drawerTab {
  border: 1px solid var(--panel-border); background: rgba(15,22,41,0.85); color: var(--text-dim);
  font-family: inherit; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
  border-radius: 3px; padding: 8px 16px; cursor: pointer; transition: all 0.18s;
}
.drawerTab:hover { color: var(--text); border-color: var(--gold-dim); }
.drawerTab.active { color: var(--gold); border-color: var(--gold); background: rgba(216,178,90,0.08); }
#drawerSheet {
  position: fixed; left: 50%; transform: translate(-50%, 115%); bottom: 64px; z-index: 25;
  width: min(720px, 94vw); max-height: 58vh; overflow-y: auto;
  background: rgba(9,13,26,0.97); border: 1px solid var(--panel-border); border-top: 2px solid var(--gold-dim); border-radius: 5px;
  backdrop-filter: blur(16px); padding: 18px; scrollbar-width: thin;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform 0.35s cubic-bezier(.2,.9,.25,1), opacity 0.3s, visibility 0.35s;
}
#drawerSheet.open { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; }
#drawerSheet h3 { font-family: 'Marcellus', serif; font-size: 16px; letter-spacing: 4px; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; }
.setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(216,178,90,0.08); font-size: 13.5px; }
.setRow:last-child { border-bottom: none; }
.setRow label { color: var(--text); }
.setRow .hint { display: block; font-size: 11px; color: var(--text-dim); }
.setRow input[type=range] { width: 130px; accent-color: var(--gold); }
.setRow select {
  background: rgba(5,8,16,0.8); color: var(--text); border: 1px solid var(--panel-border);
  border-radius: 3px; padding: 4px 8px; font-family: inherit; font-size: 12.5px; outline: none;
}
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; inset: 0; background: rgba(216,178,90,0.14); border-radius: 12px; cursor: pointer; transition: background 0.25s; }
.toggle .slider::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--text-dim); top: 3px; left: 3px; transition: all 0.25s; }
.toggle input:checked + .slider { background: rgba(216,178,90,0.4); }
.toggle input:checked + .slider::before { background: var(--gold); transform: translateX(18px); }
.memRow { padding: 7px 0; border-bottom: 1px solid rgba(216,178,90,0.08); font-size: 13px; }
.memRow .memDate { color: var(--text-dim); font-size: 11px; margin-right: 8px; }
.memRow .memShared { color: var(--blue-bright); font-size: 10.5px; letter-spacing: 1px; margin-left: 6px; }
.memRow .memActions { float: right; }
.histRow { padding: 6px 0; border-bottom: 1px solid rgba(216,178,90,0.08); font-size: 13px; }
.histRow .who { font-weight: 700; letter-spacing: 1px; font-size: 11px; margin-right: 7px; }
.histRow .who.u { color: var(--blue-bright); }
.histRow .who.a { color: var(--gold); }
.actRow { padding: 6px 0; border-bottom: 1px solid rgba(216,178,90,0.08); font-size: 12.5px; display: flex; gap: 9px; }
.actRow .when { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
.statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.statCard { background: rgba(216,178,90,0.05); border: 1px solid rgba(216,178,90,0.1); border-radius: 3px; padding: 10px 12px; font-size: 12.5px; }
.statCard b { display: block; font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }
.tinyBtn { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 2px 5px; }
.tinyBtn:hover { color: var(--text); }
.tinyBtn.danger:hover { color: var(--danger); }

/* wake flash */
#wakeFlash {
  position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(242,212,136,0.5) 45%, rgba(140,180,255,0.5) 55%, transparent 80%);
}
#wakeFlash.fire { animation: flashAnim 1.1s ease-out forwards; }
@keyframes flashAnim { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

@media (max-width: 1120px) { #appGrid { grid-template-columns: 290px 1fr 290px; } }
@media (max-width: 880px) {
  html, body { overflow: auto; }
  #kpiRow { position: static; margin-top: 54px; justify-content: flex-start; }
  #appGrid { position: static; display: flex; flex-direction: column; gap: 12px; margin-bottom: 66px; padding: 0 12px; height: auto; }
  #centerStage { order: 0; height: 56vh; min-height: 400px; flex-shrink: 0; }
  #colLeft { order: 1; } #colRight { order: 2; }
  #colLeft, #colRight { overflow: visible; }
  #statusStrip span.lbl { display: none; }
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="sigil">ODIN</div>
  <div class="subtitle">The High Seat</div>
  <input type="password" id="lockInput" autocomplete="off" placeholder="passphrase">
</div>

<div id="wakeFlash"></div>

<header id="topBar">
  <div id="wordmark">👁 ODIN <span class="seat">THE HIGH SEAT</span></div>
  <div id="statusStrip">
    <span><i class="dot" id="dotBackend"></i><span class="lbl">CORE</span></span>
    <span><i class="dot" id="dotVoice"></i><span class="lbl">VOICE</span></span>
    <span id="switcher">
      <button class="btn small" id="switcherBtn">SWITCH ▾</button>
      <div id="switcherMenu">
        <a href="/thor/">⚡ THOR</a>
        <a href="/loki/">🃏 LOKI</a>
        <a href="/hub/">🏰 ASGARD HUB</a>
      </div>
    </span>
  </div>
</header>

<div id="kpiRow"></div>

<main id="appGrid">
  <div id="colLeft">
    <section class="panel" data-panel="goals">
      <header><span>⟁ Goals</span><span class="chev">▾</span></header>
      <div class="body">
        <div id="goalList"><div class="emptyState">Loading…</div></div>
        <div style="display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;">
          <input class="rowInput" id="goalTitle" placeholder="Goal…" style="flex:2; min-width:120px;">
          <input class="rowInput" id="goalTarget" placeholder="Target" style="flex:1; min-width:80px;">
          <input class="rowInput" id="goalDue" type="date" style="flex:1.2; min-width:118px;">
          <button class="btn small" id="goalAdd">Add</button>
        </div>
      </div>
    </section>

    <section class="panel" data-panel="reports">
      <header><span>𝍌 Reports</span><span class="chev">▾</span></header>
      <div class="body">
        <div id="repList"><div class="emptyState">Loading…</div></div>
        <div style="display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;">
          <button class="btn gold" id="repNow">Generate report</button>
          <select id="repDay" class="rowInput" style="flex:1;">
            <option value="">off</option>
            <option value="daily">daily</option>
            <option value="1">Mondays</option>
            <option value="2">Tuesdays</option>
            <option value="3">Wednesdays</option>
            <option value="4">Thursdays</option>
            <option value="5">Fridays</option>
            <option value="6">Saturdays</option>
            <option value="0">Sundays</option>
          </select>
          <select id="repHour" class="rowInput" style="width:80px;"></select>
        </div>
        <div class="muted" style="margin-top:6px; font-size:11px;">Scheduled reports also land on Telegram.</div>
      </div>
    </section>
  </div>

<script>
/* ═════════════════════════════════════════════════════════════════
   PAGE CONFIG
   ═════════════════════════════════════════════════════════════════ */
const BACKEND_URL = "https://rayven-backend.rayanfahil2.workers.dev";
const UNLOCK_PASSWORD = "bifrost";

window.ASSISTANT = {
  id: 'odin',
  name: 'ODIN',
  nameVariants: ['odin', 'oden', 'odan', 'odein', 'otan', 'o din', 'oh din'],
  bareNameSafe: ['odin'],
  sleepLine: "The High Seat empties. Wake me when it matters.",
  wakeGreeting: "[WAKE_TRIGGER] Rayan just said your wake word. Greet him briefly, then ask something proactive."
};

/* ═════════════════════════════════════════════════════════════════
   SHELL ADAPTER
   ═════════════════════════════════════════════════════════════════ */
const tbUser = document.getElementById('tbUser'), tbAssistant = document.getElementById('tbAssistant');
function tbShow(layerEl, otherEl, text) {
  layerEl.querySelector('.inner').textContent = text;
  layerEl.classList.toggle('small', text.length > 130);
  otherEl.classList.remove('visible');
  layerEl.classList.add('visible');
}
window.SHELL = {
  setState(s) { window.Scene && window.Scene.setState(s); },
  wakeCinematic(done) {
    document.getElementById('wakeFlash').classList.remove('fire');
    if (window.Scene) window.Scene.wakeCinematic(done); else setTimeout(done, 400);
    setTimeout(() => document.getElementById('wakeFlash').classList.add('fire'), 900);
  },
  showUserText(t) { tbShow(tbUser, tbAssistant, t); },
  showAssistantText(t) { tbShow(tbAssistant, tbUser, t); },
  setVoiceStatus(t) { document.getElementById('voiceStatus').textContent = t; },
  setMicState(cls) {
    const b = document.getElementById('micBtn');
    b.classList.remove('listening', 'awake', 'muted', 'paused');
    if (cls) b.classList.add(cls);
  },
  onLocalCommand(text) { return handleLocalCommand(text); }
};

/* ═══ ENGINE-BEGIN ═══ ASGARD VOICE ENGINE v2 ═══════════════════════
   IDENTICAL across THOR / LOKI / ODIN pages — one engine, three shells.
   Fix a bug here, copy the whole block to the other two files.
   Wake words, mic handling, double-clap, barge-in, turn-taking,
   ElevenLabs playback, backend chat. Reads window.ASSISTANT + window.SHELL.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  const A = window.ASSISTANT, S = window.SHELL;
  const LS = k => `va:${A.id}:${k}`;
  const store = {
    get(k, d) { const v = localStorage.getItem(LS(k)); return v === null ? d : v; },
    set(k, v) { localStorage.setItem(LS(k), String(v)); },
    num(k, d) { const v = parseFloat(this.get(k, d)); return isNaN(v) ? d : v; },
    bool(k, d) { return this.get(k, d ? '1' : '0') === '1'; }
  };

  const GREETINGS = ['hey', 'yo', 'okay', 'ok', 'hi', 'wake up', 'wakeup', 'wake-up'];
  const STOP_PHRASES = ["stop talking", "shut up", "be quiet", "stop it", "hush", "silence", "stop"];
  const SLEEP_PHRASES = ["go to sleep", "sleep now", "power down", "goodnight", "good night"];

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let wakeRec = null, convoRec = null, bargeRec = null;
  let voiceActive = false, awake = false, micMuted = false, listeningPaused = false;
  let speaking = false;

  // -------- fuzzy wake matching: multi-variant + levenshtein, never one exact phrase --------
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    return dp[m][n];
  }
  const WAKE_PHRASES = [];
  for (const g of GREETINGS) for (const v of A.nameVariants) WAKE_PHRASES.push(`${g} ${v}`);
  for (const v of A.nameVariants) WAKE_PHRASES.push(`${v} wake up`);

  function wakeMatch(transcript) {
    if (!store.bool('wakeEnabled', true)) return false;
    const clean = transcript.toLowerCase().replace(/[^a-z\s-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!clean) return false;
    if (WAKE_PHRASES.some(p => clean.includes(p))) return true;
    // fuzzy: greeting word followed by something within edit distance of the name
    const maxDist = { strict: 0, normal: 1, loose: 2 }[store.get('wakeSensitivity', 'normal')] ?? 1;
    const words = clean.split(' ');
    const canonical = A.nameVariants[0];
    for (let i = 0; i < words.length; i++) {
      const isGreet = GREETINGS.includes(words[i]) || (words[i] === 'wake' && words[i + 1] === 'up');
      if (!isGreet) continue;
      const nextIdx = (words[i] === 'wake' && words[i + 1] === 'up') ? i + 2 : i + 1;
      const next = words[nextIdx];
      if (next && next.length >= 3 && levenshtein(next, canonical) <= maxDist) return true;
    }
    // bare-name wake — off by default, safe forms only, still fuzzy-checked
    if (store.bool('bareNameWake', false)) {
      for (const w of words) {
        if (A.bareNameSafe.includes(w)) return true;
        if (w.length >= canonical.length && levenshtein(w, canonical) <= Math.min(maxDist, 1)) return true;
      }
    }
    return false;
  }
  function matchesAny(t, list) { const c = t.toLowerCase().trim(); return list.some(p => c.includes(p)); }

  // -------- mic / clap shared audio graph --------
  let micCtx = null, micAnalyser = null, micData = null, micStream = null;
  async function ensureMicGraph() {
    if (micAnalyser) return true;
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { S.setVoiceStatus('Microphone permission denied.'); return false; }
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 512;
    micAnalyser.smoothingTimeConstant = 0;
    src.connect(micAnalyser);
    micData = new Uint8Array(micAnalyser.fftSize);
    startClapLoop();
    return true;
  }
  function instantVolume() {
    if (!micAnalyser) return 0;
    micAnalyser.getByteTimeDomainData(micData);
    let s = 0;
    for (let i = 0; i < micData.length; i++) { const n = (micData[i] - 128) / 128; s += n * n; }
    return Math.sqrt(s / micData.length);
  }

  // -------- double-clap wake (carried from the proven pre-ASGARD build) --------
  let clapBaseline = 0.02, clapFirst = 0, clapLastSpike = 0;
  const CLAP_MIN_GAP = 150, CLAP_MAX_GAP = 700;
  function startClapLoop() {
    function loop() {
      if (micAnalyser && voiceActive && !awake && !micMuted && !speaking &&
          store.bool('clapEnabled', true) && document.visibilityState === 'visible') {
        const vol = instantVolume();
        if (vol < clapBaseline * 1.5) clapBaseline = clapBaseline * 0.98 + vol * 0.02;
        const sens = store.num('clapSensitivity', 1); // 0.5 = needs louder claps, 2 = hair trigger
        const threshold = Math.max(0.14 / sens, (clapBaseline * 6) / sens);
        const now = Date.now();
        if (vol > threshold) {
          if (now - clapLastSpike >= CLAP_MIN_GAP) {
            if (clapFirst === 0) clapFirst = now;
            else if (now - clapFirst <= CLAP_MAX_GAP) { clapFirst = 0; clapLastSpike = now; triggerWake(); }
            else clapFirst = now;
            clapLastSpike = now;
          }
        } else if (clapFirst !== 0 && now - clapFirst > CLAP_MAX_GAP) clapFirst = 0;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // -------- wake listening --------
  function startWakeListening() {
    if (!SR || !voiceActive || awake || micMuted) return;
    S.setState('sleeping');
    S.setMicState('listening');
    S.setVoiceStatus(`Say “Hey ${A.name.charAt(0) + A.name.slice(1).toLowerCase()}” — or double clap.`);
    wakeRec = new SR();
    wakeRec.continuous = true;
    wakeRec.interimResults = true;
    wakeRec.lang = 'en-US';
    wakeRec.maxAlternatives = 5;
    wakeRec.onresult = (event) => {
      if (awake || micMuted || document.visibilityState !== 'visible') return;
      for (let r = event.resultIndex; r < event.results.length; r++)
        for (let alt = 0; alt < event.results[r].length; alt++)
          if (wakeMatch(event.results[r][alt].transcript)) { triggerWake(); return; }
    };
    wakeRec.onend = () => { if (voiceActive && !awake && !micMuted) setTimeout(() => { try { startWakeListening(); } catch (e) {} }, 120); };
    wakeRec.onerror = () => { if (voiceActive && !awake && !micMuted) setTimeout(() => { try { startWakeListening(); } catch (e) {} }, 250); };
    try { wakeRec.start(); } catch (e) {}
  }

  function triggerWake() {
    if (awake || micMuted) return;
    awake = true;
    listeningPaused = true;
    if (wakeRec) { try { wakeRec.stop(); } catch (e) {} }
    S.setMicState('awake');
    S.setVoiceStatus(`${A.name} is waking…`);
    const greetingPromise = fetchWakeGreeting();
    S.wakeCinematic(() => {
      greetingPromise.then(greeting => {
        S.showAssistantText(greeting);
        speak(greeting, () => resumeListening());
      });
    });
  }

  async function fetchWakeGreeting() {
    const timeout = new Promise(res => setTimeout(() => res("Welcome back, sir."), 6500));
    const req = (async () => {
      try {
        const r = await fetch(BACKEND_URL, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ assistant: A.id, message: A.wakeGreeting })
        });
        const d = await r.json();
        return d.reply || "Welcome back, sir.";
      } catch (e) { return "Welcome back, sir."; }
    })();
    return Promise.race([req, timeout]);
  }

  // -------- awake conversation loop --------
  function resumeListening() {
    listeningPaused = false;
    if (awake && !micMuted) {
      S.setMicState('awake');
      S.setState('listening');
      S.setVoiceStatus('Awake — your turn.');
      startConvoListening();
    }
  }
  function startConvoListening() {
    if (!SR || !awake || micMuted || listeningPaused) return;
    convoRec = new SR();
    convoRec.continuous = true;
    convoRec.interimResults = false;
    convoRec.lang = 'en-US';
    convoRec.onresult = (event) => {
      if (micMuted || listeningPaused) return;
      const last = event.results[event.results.length - 1];
      const transcript = last && last[0] ? last[0].transcript.trim() : '';
      if (!transcript) return;
      listeningPaused = true;
      S.setMicState('paused');
      try { convoRec.stop(); } catch (e) {}
      if (matchesAny(transcript, STOP_PHRASES)) { stopSpeaking(); resumeListening(); return; }
      if (matchesAny(transcript, SLEEP_PHRASES)) { Engine.sleep(); return; }
      sendMessage(transcript);
    };
    convoRec.onend = () => { if (awake && !micMuted && !listeningPaused) setTimeout(() => { if (awake && !micMuted && !listeningPaused) startConvoListening(); }, 120); };
    convoRec.onerror = () => { if (awake && !micMuted && !listeningPaused) setTimeout(() => { if (awake && !micMuted && !listeningPaused) startConvoListening(); }, 250); };
    try { convoRec.start(); } catch (e) {}
  }

  // -------- barge-in: while speaking, listen ONLY for stop phrases --------
  function startBargeListening() {
    if (!SR || micMuted) return;
    stopBargeListening();
    bargeRec = new SR();
    bargeRec.continuous = true;
    bargeRec.interimResults = true;
    bargeRec.lang = 'en-US';
    bargeRec.onresult = (event) => {
      if (!speaking) return;
      for (let r = event.resultIndex; r < event.results.length; r++) {
        if (matchesAny(event.results[r][0].transcript, STOP_PHRASES)) {
          stopSpeaking();
          resumeListening();
          return;
        }
      }
    };
    try { bargeRec.start(); } catch (e) {}
  }
  function stopBargeListening() { if (bargeRec) { try { bargeRec.onresult = null; bargeRec.stop(); } catch (e) {} bargeRec = null; } }

  // -------- chat turn --------
  async function sendMessage(text) {
    if (!text || !text.trim()) return;
    text = text.trim();
    if (S.onLocalCommand && S.onLocalCommand(text)) { resumeListening(); return; }
    S.showUserText(text);
    S.setState('thinking');
    S.setVoiceStatus(`${A.name} is thinking…`);
    try {
      const r = await fetch(BACKEND_URL, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ assistant: A.id, message: text })
      });
      const d = await r.json();
      const reply = d.reply || d.error || '(no reply)';
      S.showAssistantText(reply);
      speak(reply, () => { if (awake) resumeListening(); else { S.setState('sleeping'); S.setMicState(voiceActive ? 'listening' : null); } });
    } catch (err) {
      S.showAssistantText(`Connection error: ${err.message}`);
      S.setState(awake ? 'listening' : 'sleeping');
      if (awake) resumeListening();
    }
  }

  // -------- TTS: ElevenLabs via backend, tapped through an analyser --------
  let ttsCtx = null, ttsAnalyser = null, ttsData = null, currentSource = null, currentOnDone = null;
  let synthFallback = false;
  function getTtsCtx() {
    if (!ttsCtx) {
      ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
      ttsAnalyser = ttsCtx.createAnalyser();
      ttsAnalyser.fftSize = 256;
      ttsAnalyser.smoothingTimeConstant = 0.72;
      ttsAnalyser.connect(ttsCtx.destination); // must reach destination or audio is silent
      ttsData = new Uint8Array(128);
    }
    if (ttsCtx.state === 'suspended') ttsCtx.resume().catch(() => {});
    return ttsCtx;
  }
  function stopSpeaking() {
    if (currentSource) { try { currentSource.onended = null; currentSource.stop(); } catch (e) {} currentSource = null; }
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    speaking = false; synthFallback = false;
    stopBargeListening();
    currentOnDone = null;
  }
  function speak(text, onDone) {
    const cleaned = String(text).replace(/[*_#`]/g, '').trim();
    stopSpeaking();
    if (!cleaned) { if (onDone) onDone(); return; }
    speaking = true;
    S.setState('speaking');
    S.setVoiceStatus(`${A.name} is speaking — say "stop" to cut in.`);
    currentOnDone = onDone;
    startBargeListening();
    fetch(`${BACKEND_URL}/tts`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: cleaned, persona: A.id })
    })
      .then(res => { if (!res.ok) throw new Error('TTS ' + res.status); return res.arrayBuffer(); })
      .then(buf => getTtsCtx().decodeAudioData(buf))
      .then(audioBuffer => {
        if (!speaking) return; // barged before playback started
        const ctx = getTtsCtx();
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.playbackRate.value = store.num('rate', 1);
        source.detune.value = store.num('pitch', 0) * 100;
        const gain = ctx.createGain();
        source.connect(gain);
        gain.connect(ttsAnalyser);
        const now = ctx.currentTime, fade = 0.02;
        const dur = audioBuffer.duration / source.playbackRate.value;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(1, now + fade);
        if (dur > fade * 2) { gain.gain.setValueAtTime(1, now + dur - fade); gain.gain.linearRampToValueAtTime(0, now + dur); }
        currentSource = source;
        source.onended = () => {
          currentSource = null; speaking = false;
          stopBargeListening();
          const cb = currentOnDone; currentOnDone = null;
          if (cb) cb();
        };
        source.start(0);
      })
      .catch(err => {
        console.error('ElevenLabs TTS failed, browser voice fallback:', err);
        if (!speaking) return;
        if ('speechSynthesis' in window) {
          synthFallback = true;
          const u = new SpeechSynthesisUtterance(cleaned);
          u.rate = store.num('rate', 1);
          u.pitch = Math.max(0, Math.min(2, 1 + store.num('pitch', 0) / 12));
          const finish = () => {
            speaking = false; synthFallback = false;
            stopBargeListening();
            const cb = currentOnDone; currentOnDone = null;
            if (cb) cb();
          };
          u.onend = finish; u.onerror = finish;
          window.speechSynthesis.speak(u);
        } else {
          speaking = false;
          const cb = currentOnDone; currentOnDone = null;
          if (cb) cb();
        }
      });
  }

  // -------- levels the shell polls from its render loop (no engine rAF) --------
  function getAudioLevel() {
    if (speaking && synthFallback) return 0.25 + 0.35 * Math.abs(Math.sin(performance.now() / 170));
    if (!speaking || !ttsAnalyser || !currentSource) return 0;
    ttsAnalyser.getByteFrequencyData(ttsData);
    let sum = 0;
    for (let i = 2; i < 60; i++) sum += ttsData[i];
    return Math.min(1, (sum / 58) / 150);
  }
  function getMicLevel() {
    if (!awake || speaking || micMuted) return 0;
    return Math.min(1, instantVolume() * 6);
  }

  // -------- public engine API --------
  const Engine = {
    async startVoice() {
      if (!SR) { S.setVoiceStatus('Voice recognition unsupported here — try Chrome.'); return; }
      if (voiceActive) return;
      if (!(await ensureMicGraph())) return;
      voiceActive = true;
      startWakeListening();
    },
    wake() { if (voiceActive) triggerWake(); else this.startVoice().then(() => triggerWake()); },
    sleep() {
      const line = A.sleepLine;
      const finish = () => {
        awake = false; listeningPaused = false;
        if (convoRec) { try { convoRec.stop(); } catch (e) {} }
        S.setState('sleeping');
        if (voiceActive && !micMuted) startWakeListening(); else S.setMicState(null);
        S.setVoiceStatus(voiceActive ? `Asleep — “Hey ${A.name.charAt(0) + A.name.slice(1).toLowerCase()}” or double clap wakes me.` : 'Voice off.');
      };
      if (awake) { S.showAssistantText(line); speak(line, finish); } else finish();
    },
    toggleMute() {
      micMuted = !micMuted;
      if (micMuted) {
        if (wakeRec) { try { wakeRec.stop(); } catch (e) {} }
        if (convoRec) { try { convoRec.stop(); } catch (e) {} }
        stopBargeListening();
        S.setMicState('muted');
        S.setVoiceStatus('Mic muted.');
      } else {
        S.setMicState(awake ? 'awake' : 'listening');
        if (awake) { if (!listeningPaused && !speaking) startConvoListening(); } else if (voiceActive) startWakeListening();
        S.setVoiceStatus(awake ? 'Awake — your turn.' : 'Listening for the wake word.');
      }
      return micMuted;
    },
    // Push-to-talk: press = wake if needed + listen for one utterance
    pttDown() {
      if (micMuted) return;
      stopSpeaking();
      if (!awake) { awake = true; if (wakeRec) { try { wakeRec.stop(); } catch (e) {} } S.setState('listening'); }
      listeningPaused = false;
      S.setMicState('awake');
      S.setVoiceStatus('Push-to-talk — speak now.');
      if (!voiceActive) { voiceActive = true; ensureMicGraph(); }
      startConvoListening();
    },
    sendText(t) { stopSpeaking(); if (!awake) { awake = true; S.setState('listening'); } listeningPaused = true; sendMessage(t); },
    speak, stopSpeaking, getAudioLevel, getMicLevel,
    isAwake: () => awake, isSpeaking: () => speaking, isVoiceActive: () => voiceActive, isMuted: () => micMuted,
    store
  };
  window.Engine = Engine;
})();
/* ═══ ENGINE-END ═══ */


/* ═════════════════════════════════════════════════════════════════
   SHELL LOGIC — the High Seat
   ═════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(BACKEND_URL + path, opts).then(r => r.json());
const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

(function () {
  const lock = $('lockScreen'), input = $('lockInput');
  if (sessionStorage.getItem('asgard:unlocked') === '1') { lock.classList.add('hidden'); }
  else setTimeout(() => input.focus(), 300);
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (input.value === UNLOCK_PASSWORD) { sessionStorage.setItem('asgard:unlocked', '1'); lock.classList.add('hidden'); }
    else { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.value = ''; }
  });
})();

function handleLocalCommand(text) {
  const t = text.toLowerCase().trim();
  if (/^switch to thor$/.test(t)) { location.href = '/thor/'; return true; }
  if (/^switch to loki$/.test(t)) { location.href = '/loki/'; return true; }
  if (/^switch to odin$/.test(t)) return true;
  return false;
}

async function refreshKpis() {
  const row = $('kpiRow');
  let kpis = [];
  try { kpis = await api('/kpi'); } catch (e) { row.innerHTML = ''; return; }
  row.innerHTML = '';
  if (!kpis.length) {
    row.insertAdjacentHTML('beforeend', '<div class="kpiCard empty">No numbers recorded yet — the board is honest, not decorated. Add the first KPI worth watching.</div>');
  }
  for (const k of kpis) {
    const card = document.createElement('div'); card.className = 'kpiCard';
    card.innerHTML = `<div class="kLabel">${String(k.label || '—').replace(/</g, '&lt;')}</div><div class="kValue">${String(k.value ?? '—').replace(/</g, '&lt;')}${k.unit ? `<span style="font-size:12px;color:var(--text-dim);"> ${k.unit}</span>` : ''}</div><div class="kWhen">${String(k.updated || '').slice(5, 10)}</div>`;
    card.title = 'Click to update · long-press to remove';
    card.addEventListener('click', async () => {
      const nv = prompt(`New value for "${k.label}":`, k.value);
      if (nv === null) return;
      if (nv === '') { if (confirm(`Remove KPI "${k.label}"?`)) { await post('/kpi', { action: 'remove', id: k.id }); refreshKpis(); } return; }
      await post('/kpi', { action: 'update', id: k.id, item: { value: nv } });
      refreshKpis();
    });
    row.appendChild(card);
  }
  const add = document.createElement('div'); add.className = 'kpiCard add'; add.textContent = '+';
  add.addEventListener('click', async () => {
    const label = prompt('KPI name (e.g. "Monthly revenue"):'); if (!label) return;
    const value = prompt(`Current value of "${label}":`); if (value === null) return;
    const unit = prompt('Unit (optional, e.g. $, followers):') || '';
    await post('/kpi', { action: 'add', item: { label, value, unit } });
    refreshKpis();
  });
  row.appendChild(add);
}

async function refreshGoals() {

  const el = $('goalList');
  if (!goals.length) { el.innerHTML = '<div class="emptyState">No goals recorded. Name one, and it will be measured.</div>'; return; }
  el.innerHTML = '';
  for (const g of goals) {
    const row = document.createElement('div'); row.className = 'goalRow';

    row.innerHTML = `<div class="goalTop"><span class="goalTitle">${String(g.title).replace(/</g, '&lt;')}</span><span class="goalPct">${pct}%</span></div>

    row.title = 'Click to update progress';
    row.style.cursor = 'pointer';

function setRow(labelHtml, controlEl) {
  const row = document.createElement('div'); row.className = 'setRow';
  const lab = document.createElement('label'); lab.innerHTML = labelHtml;
  row.appendChild(lab); row.appendChild(controlEl);
  return row;
}
function mkToggle(key, def) {
  const wrap = document.createElement('label'); wrap.className = 'toggle';
  const input = document.createElement('input'); input.type = 'checkbox';
  input.checked = Engine.store.bool(key, def);
  const slider = document.createElement('span'); slider.className = 'slider';
  input.addEventListener('change', () => Engine.store.set(key, input.checked ? '1' : '0'));
  wrap.appendChild(input); wrap.appendChild(slider);
  return wrap;
}
function mkRange(key, def, min, max, step) {
  const input = document.createElement('input'); input.type = 'range';
  input.min = min; input.max = max; input.step = step;
  input.value = Engine.store.num(key, def);
  input.addEventListener('input', () => Engine.store.set(key, input.value));
  return input;
}
function mkSelect(key, def, options) {
  const sel = document.createElement('select');
  for (const [v, label] of options) { const o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); }
  sel.value = Engine.store.get(key, def);
  sel.addEventListener('change', () => Engine.store.set(key, sel.value));
  return sel;
}

// Per-tool permission levels (auto / notify / confirm / off) — backend-enforced.
function appendPermissionsEditor(s) {
  const wrap = document.createElement('div');
  wrap.innerHTML = '<h3 style="margin-top:18px;">🔐 Tool Permissions</h3><div class="muted">Loading…</div>';
  s.appendChild(wrap);
  api('/permissions/all').then(d => {
    wrap.innerHTML = '<h3 style="margin-top:18px;">🔐 Tool Permissions</h3><div class="muted" style="margin-bottom:6px;">auto = just do it · notify = do it and tell you · confirm = ask first · off = disabled</div>';
    for (const t of d.tools) {
      const sel = document.createElement('select');
      for (const lv of ['auto', 'notify', 'confirm', 'off']) { const o = document.createElement('option'); o.value = lv; o.textContent = lv; sel.appendChild(o); }
      sel.value = t.level;
      if (t.hardConfirm) [...sel.options].forEach(o => { if (o.value === 'auto' || o.value === 'notify') o.disabled = true; });
      sel.addEventListener('change', () => post('/permissions', { tool: t.tool, level: sel.value }));
      wrap.appendChild(setRow(`${t.tool}${t.hardConfirm ? '<span class="hint">sends real messages — hardwired to confirm, can only be switched off</span>' : ''}`, sel));
    }
  }).catch(() => { wrap.innerHTML += '<div class="emptyState">Backend unreachable.</div>'; });
}

async function renderHistorySheet() {
  const s = $('drawerSheet'); s.innerHTML = '<h3>🕘 Conversation History</h3>';
  const search = document.createElement('input'); search.className = 'rowInput'; search.placeholder = 'Search history…';
  s.appendChild(search);
  const listEl = document.createElement('div'); listEl.style.marginTop = '10px'; s.appendChild(listEl);
  let turns = [];
  try { const d = await api('/history?persona=odin'); turns = d.turns || []; }
  catch (e) { listEl.innerHTML = '<div class="emptyState">Backend unreachable.</div>'; return; }
  function render(filter) {
    const f = (filter || '').toLowerCase();
    const rows = turns.filter(t => !f || t.text.toLowerCase().includes(f));
    listEl.innerHTML = rows.length ? '' : '<div class="emptyState">Nothing matches.</div>';
    for (const t of [...rows].reverse()) {

    }
  }
  search.addEventListener('input', () => render(search.value));
  render('');
}
async function renderActivitySheet() {
  const s = $('drawerSheet'); s.innerHTML = '<h3>📡 Live Tool Activity</h3><div class="muted">Loading…</div>';
  try {
    const log = await api('/activity');
    s.innerHTML = '<h3>📡 Live Tool Activity</h3>';

    for (const it of items) {

async function renderStatusSheet() {
  const s = $('drawerSheet'); s.innerHTML = '<h3>🛰 System Status</h3><div class="muted">Checking…</div>';
  const cards = [];
  cards.push(['Backend', window._pingMs != null ? `Online · ${window._pingMs}ms round-trip` : 'Unreachable']);
  try {
    const st = await api('/status');
    for (const [id, p] of Object.entries(st.personas || {})) cards.push([p.name, (p.status && p.status.task) ? `${p.status.task}` : 'idle']);
  } catch (e) { cards.push(['Personas', 'Status unavailable']); }
  try {
    const cfg = await api('/assistant-config');
    const d = cfg['config:odin:report:day'], h = cfg['config:odin:report:hour'] || 9;
    const dayNames = { daily: 'daily', 0: 'Sundays', 1: 'Mondays', 2: 'Tuesdays', 3: 'Wednesdays', 4: 'Thursdays', 5: 'Fridays', 6: 'Saturdays' };
    cards.push(['Business report', d ? `${dayNames[d] || d} at ${(h % 12 || 12)}${h < 12 ? 'am' : 'pm'} Pacific` : 'Off — set a schedule in Reports']);
  } catch (e) {}
  cards.push(['Voice engine', Engine.isVoiceActive() ? (Engine.isMuted() ? 'Active · muted' : 'Active') : 'Not started (tap the mic)']);
  s.innerHTML = '<h3>🛰 System Status</h3><div class="statGrid">' +
    cards.map(([t, v]) => `<div class="statCard"><b>${t}</b>${String(v).replace(/</g, '&lt;')}</div>`).join('') + '</div>';
}

<!-- ═══════════════ THREE.JS HIGH SEAT SCENE ═══════════════ -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stageCanvas');
const stage = document.getElementById('centerStage');
const fxLevel = { low: 0.4, med: 0.7, high: 1 }[localStorage.getItem('va:odin:fx') || 'high'] || 1;
const perfSetting = localStorage.getItem('va:odin:perf') || 'auto';
const isSmall = Math.min(innerWidth, innerHeight) < 700;
const lite = perfSetting === 'lite' || (perfSetting === 'auto' && isSmall);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: !lite, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, lite ? 1 : 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 60);
camera.position.set(0, 0.8, 8.2);
camera.lookAt(0, 0.9, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const keyLight = new THREE.DirectionalLight(0xfff2d0, 2.2); keyLight.position.set(4, 5, 5); scene.add(keyLight);
const rimLight = new THREE.PointLight(0x5a7fd4, 12, 32); rimLight.position.set(-5, 3, -4); scene.add(rimLight);
const goldLight = new THREE.PointLight(0xd8b25a, 5, 24); goldLight.position.set(3, -3, 3); scene.add(goldLight);
scene.add(new THREE.AmbientLight(0x1c2438, 1.5));

// ---- materials ----
const silverMat = new THREE.MeshStandardMaterial({ color: 0xc8ceda, metalness: 0.95, roughness: 0.25 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xd8b25a, metalness: 1.0, roughness: 0.2 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a2032, metalness: 0.6, roughness: 0.5 });

// ---- Gungnir — built along local Y, then posed diagonally (tip upper-LEFT) ----
const spear = new THREE.Group();
const SHAFT_LEN = 5.2;

const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, SHAFT_LEN, 12), silverMat);
spear.add(shaft);

// gold rings along the shaft
for (const y of [-2.1, -1.2, -0.3, 0.7, 1.5]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.022, 8, 16), goldMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  spear.add(ring);
}

// spearhead: elongated blade + two curved side prongs + gold collar
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.09, 0.28, 10), goldMat);
collar.position.y = SHAFT_LEN / 2 + 0.1;
spear.add(collar);
const blade = new THREE.Mesh(new THREE.ConeGeometry(0.14, 1.25, 6), silverMat);
blade.scale.z = 0.45;
blade.position.y = SHAFT_LEN / 2 + 0.9;
spear.add(blade);
for (const sx of [-1, 1]) {
  const prong = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.62, 6), goldMat);
  prong.scale.z = 0.5;
  prong.position.set(sx * 0.18, SHAFT_LEN / 2 + 0.42, 0);
  prong.rotation.z = sx * -0.42;
  spear.add(prong);
}
// butt cap
const buttCap = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 8), goldMat);
buttCap.rotation.x = Math.PI;
buttCap.position.y = -SHAFT_LEN / 2 - 0.12;
spear.add(buttCap);

// rune sigils along the shaft — ignite one by one on wake
const RUNES = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾ';
const runeSprites = [];
function runeSprite(ch) {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.fillStyle = '#ffdf94';
  ctx.font = 'bold 46px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 32, 34);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
  return new THREE.Sprite(mat);
}
for (let i = 0; i < 8; i++) {
  const s = runeSprite(RUNES[i % RUNES.length]);
  s.scale.setScalar(0.34);
  s.position.set(0.16, -2.3 + i * 0.62, 0.05);
  spear.add(s);
  runeSprites.push(s);
}

// pose: tip upper-LEFT, butt lower-RIGHT (positive z-roll leans +Y toward -X)
spear.rotation.z = 2.28 - Math.PI / 2; // ≈ +39° lean
spear.position.set(0.1, 0.9, 0);
scene.add(spear);

// the single eye — a faint gold iris behind the spear (Odin's motif)
function glowSprite(colorInner, colorOuter) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 128);
  g.addColorStop(0, colorInner); g.addColorStop(0.5, colorOuter); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
}
const eyeGlow = glowSprite('rgba(216,178,90,0.5)', 'rgba(44,74,143,0.25)');
eyeGlow.scale.set(10, 10, 1);
eyeGlow.position.set(0, 0.9, -3);
scene.add(eyeGlow);
const iris = glowSprite('rgba(242,212,136,0.9)', 'rgba(216,178,90,0.12)');
iris.scale.set(2.2, 2.2, 1);
iris.position.set(0, 0.9, -2.8);
scene.add(iris);

// ---- Bifrost beam (hidden until wake) ----
function bifrostTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 128, 0);
  const stops = [[0, 'rgba(255,120,120,0)'], [0.2, 'rgba(255,180,90,0.5)'], [0.4, 'rgba(255,240,150,0.85)'], [0.6, 'rgba(150,255,190,0.6)'], [0.8, 'rgba(120,170,255,0.5)'], [1, 'rgba(170,120,255,0)']];
  for (const [o, col] of stops) g.addColorStop(o, col);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 512);
  return new THREE.CanvasTexture(c);
}
const bifrost = new THREE.Mesh(
  new THREE.PlaneGeometry(2.2, 14),
  new THREE.MeshBasicMaterial({ map: bifrostTexture(), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
);
bifrost.rotation.z = 0.25;
bifrost.position.set(-6, 1, -3.5);
scene.add(bifrost);

// ---- two ravens (hidden until wake) ----
function makeRaven() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.5, 6), darkMat);
  body.rotation.z = -Math.PI / 2;
  g.add(body);
  const wingGeo = new THREE.PlaneGeometry(0.55, 0.2);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x141a2c, metalness: 0.4, roughness: 0.6, side: THREE.DoubleSide });
  const w1 = new THREE.Mesh(wingGeo, wingMat); w1.position.set(0, 0.05, 0.22); g.add(w1);
  const w2 = new THREE.Mesh(wingGeo, wingMat); w2.position.set(0, 0.05, -0.22); g.add(w2);
  g.visible = false;
  g.userData.wings = [w1, w2];
  scene.add(g);
  return g;
}
const raven1 = makeRaven(), raven2 = makeRaven();

// ---- bloom ----
let composer = null, bloomPass = null;
if (!lite) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.5, 0.7, 0.55);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
}

// ---- states ----
const STATES = {
  sleeping: { rot: 0.04, bob: 0.04, rune: 0.05, eye: 0.12, bloom: 0.28, exposure: 0.8 },
  listening: { rot: 0.18, bob: 0.08, rune: 0.55, eye: 0.5, bloom: 0.6, exposure: 1.0 },
  thinking: { rot: 0.5, bob: 0.1, rune: 1.0, eye: 0.9, bloom: 0.75, exposure: 1.05 },
  speaking: { rot: 0.22, bob: 0.08, rune: 0.8, eye: 0.75, bloom: 0.7, exposure: 1.05 }
};
let stateName = 'sleeping';
let cur = { ...STATES.sleeping };
let cinematic = null;

window.Scene = {
  setState(s) {
    const map = { idle: 'sleeping', talking: 'speaking' };
    stateName = STATES[s] ? s : (map[s] || 'sleeping');
  },
  // Golden runes ignite up the shaft → Bifrost sweeps through → two ravens
  // streak past → the eye brightens and holds.
  wakeCinematic(done) {
    cinematic = { t: 0, done, wallStart: performance.now() };
    raven1.visible = raven2.visible = true;
  }
};

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  const audio = window.Engine ? window.Engine.getAudioLevel() : 0;
  const mic = window.Engine ? window.Engine.getMicLevel() : 0;

  const target = STATES[stateName];
  for (const k of Object.keys(cur)) cur[k] += (target[k] - cur[k]) * Math.min(1, dt * 2.2);

  // ---- wake cinematic ----
  let cinRune = 0, cinGlow = 0;
  if (cinematic) {
    cinematic.t += dt;
    const T = cinematic.t;
    const hardStop = now - cinematic.wallStart > 4500;
    // phase 1 (0–1.1s): runes ignite from butt to tip
    cinRune = T / 1.1;
    // phase 2 (0.7–1.7s): Bifrost sweeps across
    if (T > 0.7) {
      const p = Math.min(1, (T - 0.7) / 1.0);
      bifrost.material.opacity = Math.sin(p * Math.PI) * 0.85;
      bifrost.position.x = -6 + easeOutCubic(p) * 12;
    }
    // phase 3 (0.9–2.1s): ravens streak past on crossing arcs
    if (T > 0.9) {
      const p = Math.min(1, (T - 0.9) / 1.2);
      raven1.position.set(-6 + p * 12, 2.6 - Math.sin(p * Math.PI) * 0.9, -1.5);
      raven1.rotation.z = -0.15;
      raven2.position.set(6 - p * 12, 1.4 + Math.sin(p * Math.PI) * 0.7, -2.2);
      raven2.rotation.y = Math.PI;
      for (const r of [raven1, raven2]) {
        r.userData.wings[0].rotation.x = Math.sin(t * 26) * 0.8;
        r.userData.wings[1].rotation.x = -Math.sin(t * 26) * 0.8;
      }
    }
    cinGlow = Math.min(1, T / 1.6);
    if (T >= 2.3 || hardStop) {
      bifrost.material.opacity = 0;
      raven1.visible = raven2.visible = false;
      const cb = cinematic.done; cinematic = null;
      stateName = 'listening';
      if (cb) cb();
    }
  }

  // ---- rune glow (per-sprite so the ignition travels up the shaft) ----
  for (let i = 0; i < runeSprites.length; i++) {
    const base = cur.rune * (0.55 + 0.45 * Math.sin(t * 2.2 + i * 0.9));
    let ignite = 0;
    if (cinematic || cinRune > 0) {
      const litPoint = cinRune * (runeSprites.length + 2);
      ignite = Math.max(0, Math.min(1, litPoint - i)) * 1.4;
    }
    runeSprites[i].material.opacity = Math.min(1, Math.max(base, ignite) + audio * 0.5);
  }

  // ---- spear motion: slow majestic turn around its long axis + gentle drift ----
  spear.rotation.y += dt * cur.rot * (1 + mic);
  spear.position.y = 0.9 + Math.sin(t * 0.9) * cur.bob;
  spear.position.x = 0.1 + Math.cos(t * 0.7) * cur.bob * 0.5;

  // ---- the eye ----
  const pulse = stateName === 'thinking' ? 0.2 * Math.sin(t * 6) : 0;
  iris.material.opacity = 0.25 + cur.eye * 0.6 + pulse + audio * 0.5 + cinGlow * 0.5;
  iris.scale.setScalar(2.2 + Math.sin(t * 1.5) * 0.08 + audio * 0.7);
  eyeGlow.material.opacity = 0.15 + cur.eye * 0.35 + audio * 0.25 + cinGlow * 0.35;
  rimLight.intensity = 8 + cur.eye * 10 + audio * 20 + cinGlow * 22;
  goldLight.intensity = 4 + cur.rune * 6 + audio * 12;
  renderer.toneMappingExposure = cur.exposure + audio * 0.12 + cinGlow * 0.15;

  if (composer && bloomPass) {
    bloomPass.strength = (cur.bloom + audio * 0.45 + cinGlow * 0.55) * fxLevel;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
