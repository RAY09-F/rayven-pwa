<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASGARD</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;height:100%;overflow:hidden;color:#e8ecf5;
  font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

/* ---- tab bar ---------------------------------------------------------- */
#bar{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;gap:5px;padding:8px 10px;
  background:#020306;border-bottom:1px solid #14161d}
.tab{padding:6px 13px;border:1px solid #262933;background:#06070b;color:#767b88;cursor:pointer;
  font:700 9px/1 'JetBrains Mono',monospace;letter-spacing:.18em;border-radius:2px;
  transition:color .18s,background .18s,border-color .18s}
.tab:hover{color:#e8ecf5;border-color:#3d424f}
.tab.t.on{background:#6fc8ff;color:#04121e;border-color:#bfe6ff}
.tab.l.on{background:#3f9c68;color:#021007;border-color:#7ecb9c}
.tab.o.on{background:#f0b64a;color:#1a1003;border-color:#ffdc9a}
.tab.h.on{background:#3dff9a;color:#021208;border-color:#8fffc8}
#brand{margin-left:auto;align-self:center;font:700 9px/1 'JetBrains Mono',monospace;
  letter-spacing:.22em;color:#4a4f5c;padding-right:4px;font-variant-numeric:tabular-nums;
  white-space:nowrap}

/* ---- stage ------------------------------------------------------------ */
#wrap{position:fixed;inset:36px 0 0 0}
.stage{position:absolute;inset:0;display:none}
.stage.on{display:block}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vig{position:absolute;inset:0;pointer-events:none}

/* ---- wordmark --------------------------------------------------------- */
.name{position:absolute;left:50%;top:4%;transform:translateX(-50%) translateY(10px);
  font-family:Cinzel,Georgia,serif;font-weight:900;letter-spacing:.34em;text-indent:.34em;
  font-size:clamp(21px,4.6vw,50px);white-space:nowrap;opacity:0;
  transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.22,1,.36,1)}
.name.in{opacity:1;transform:translateX(-50%) translateY(0)}
.name .strike{position:absolute;left:-2%;top:52%;height:2px;width:104%;transform:scaleX(0);
  transform-origin:left center;transition:transform .5s cubic-bezier(.7,0,.3,1)}
.name.struck .strike{transform:scaleX(1)}
.sub{position:absolute;left:50%;top:calc(4% + clamp(36px,7.2vw,78px));transform:translateX(-50%);
  font-size:9px;letter-spacing:.5em;text-indent:.5em;white-space:nowrap;opacity:0;
  transition:opacity 1.3s ease .3s}
.sub.in{opacity:.8}

/* ---- panels: two flex columns so they physically cannot overlap ------- */
.col{position:absolute;top:15%;bottom:80px;width:min(31vw,224px);display:flex;flex-direction:column;
  gap:9px;overflow:hidden;pointer-events:none}
.colL{left:14px;align-items:flex-start}
.colR{right:14px;align-items:flex-end;text-align:right}
.pan{width:100%;padding:8px 10px;font-size:9px;line-height:1.55;letter-spacing:.04em;
  border:1px solid;background:rgba(1,2,5,.70);border-radius:2px;
  opacity:0;transform:translateY(8px);
  transition:opacity .85s cubic-bezier(.22,1,.36,1),transform .85s cubic-bezier(.22,1,.36,1)}
.pan.in{opacity:1;transform:none}
.pan h4{font:700 8px/1 'JetBrains Mono',monospace;letter-spacing:.26em;margin-bottom:7px;opacity:.62}
.pan.grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.pan.grow .feed{flex:1;height:auto;min-height:52px}
.pan.grow .trace{flex:1;display:flex;flex-direction:column;justify-content:space-around}

/* ---- reasoning trace --------------------------------------------------- */
.trace{margin-top:2px}
.trace p{display:flex;align-items:center;gap:7px;font-size:8px;line-height:1.5;letter-spacing:.03em;
  opacity:.34;transition:opacity .45s}
.trace p b{flex:0 0 6px;height:6px;border:1px solid currentColor;border-radius:50%;font-size:0;
  transition:background .45s,box-shadow .45s}
.trace p span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.trace p.done{opacity:.5}
.trace p.done b{background:currentColor;opacity:.55}
.trace p.act{opacity:1;font-weight:700}
.trace p.act b{background:currentColor;box-shadow:0 0 9px currentColor}
.trace p em{font-style:normal;font-size:7px;opacity:.5;letter-spacing:.1em}
.row{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.row b{font-weight:400;opacity:.5}
.val{font-variant-numeric:tabular-nums;font-weight:700}
.bar2{height:3px;background:rgba(255,255,255,.09);margin:5px 0 7px;border-radius:2px;overflow:hidden}
.bar2 i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);
  transition:transform 1.1s cubic-bezier(.22,1,.36,1);will-change:transform}
.mini{display:flex;gap:2px;align-items:flex-end;height:22px;margin-top:4px}
.mini i{flex:1;background:currentColor;opacity:.5;transform-origin:bottom;transform:scaleY(.1);
  transition:transform .55s cubic-bezier(.22,1,.36,1);will-change:transform}

/* ---- ticker ----------------------------------------------------------- */
.tick{position:absolute;bottom:0;left:0;right:0;height:22px;overflow:hidden;border-top:1px solid;
  background:rgba(1,2,5,.82);font-size:9px;letter-spacing:.13em;opacity:0;
  transition:opacity 1.1s ease}
.tick.in{opacity:1}
.tick div{position:absolute;white-space:nowrap;line-height:22px;will-change:transform}

/* ---- flash / shock ---------------------------------------------------- */
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}

/* ---- HELA gate -------------------------------------------------------- */
#gate{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:9px;opacity:0;pointer-events:none;
  transition:opacity 1s ease}
#gate.in{opacity:1;pointer-events:auto}
#gate label{font-size:8px;letter-spacing:.42em;text-indent:.42em;color:#3dff9a;opacity:.85;
  background:rgba(0,0,0,.75);padding:5px 12px;border-radius:2px}
#gate input{background:rgba(1,2,5,.88);border:1px solid #123f2a;color:#3dff9a;padding:9px 14px;
  font:400 12px/1 'JetBrains Mono',monospace;letter-spacing:.34em;text-align:center;width:216px;
  border-radius:2px;outline:none;transition:border-color .2s,box-shadow .2s}
#gate input:focus{border-color:#3dff9a;box-shadow:0 0 0 1px rgba(61,255,154,.28),0 0 22px rgba(61,255,154,.16)}
#gate input.bad{border-color:#c0392b;animation:shk .34s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#gmsg{font-size:8px;letter-spacing:.28em;color:#3dff9a;opacity:0;transition:opacity .4s;height:10px}

/* ---- HUD frame: brackets, rulers, reticle ------------------------------ */
.brk{position:absolute;width:26px;height:26px;border:1px solid;opacity:.5}
.brk.tl{top:8px;left:8px;border-right:0;border-bottom:0}
.brk.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.brk.bl{bottom:78px;left:3px;width:18px;height:18px;border-right:0;border-top:0}
.brk.br{bottom:78px;right:3px;width:18px;height:18px;border-left:0;border-top:0}
.rail{position:absolute;top:12%;bottom:84px;width:12px;opacity:.75;pointer-events:none}
.rail.l{left:2px}.rail.r{right:2px}
.rail i{position:absolute;right:0;width:6px;height:1px;background:currentColor;opacity:.55}
.rail.l i{left:0;right:auto}
.rail i.maj{width:11px;opacity:.85}
.rail em{position:absolute;left:0;right:0;height:2px;background:currentColor;
  box-shadow:0 0 8px currentColor;will-change:transform}
.retA{position:absolute;left:50%;top:0;width:1px;height:26px;background:currentColor;opacity:.22}
.retB{position:absolute;left:50%;transform:translateX(-50%);top:26px;width:56px;height:1px;
  background:currentColor;opacity:.22}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.055;
  background:repeating-linear-gradient(0deg,rgba(190,214,240,.5) 0 1px,transparent 1px 3px)}
@keyframes railsweep{0%{transform:translateY(0)}100%{transform:translateY(calc(100vh - 220px))}}
.rail em{animation:railsweep 7s cubic-bezier(.6,0,.4,1) infinite alternate}
.rail.r em{animation-duration:9.5s;animation-delay:-2s}

/* ---- log feed ---------------------------------------------------------- */
.pan.log{padding-bottom:5px}
.feed{height:78px;overflow:hidden;position:relative;margin-top:2px}
.feed b{display:block;font-weight:400;font-size:8px;line-height:1.62;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.62}
.feed b.hot{opacity:1;font-weight:700}
.feed b i{opacity:.4;font-style:normal;margin-right:5px}

/* ---- LED bank ---------------------------------------------------------- */
.leds{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.leds s{width:9px;height:9px;border:1px solid currentColor;opacity:.3;text-decoration:none;
  border-radius:1px;transition:opacity .35s,background .35s}
.leds s.on{opacity:1;background:currentColor;box-shadow:0 0 7px currentColor}
.leds s.warn{opacity:.85;background:#c9873a;border-color:#c9873a;box-shadow:0 0 7px #c9873a}

/* ---- split bars -------------------------------------------------------- */
.split{margin-top:5px}
.split div{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.split u{text-decoration:none;flex:0 0 26px;opacity:.55;font-size:8px}
.split span{flex:1;height:4px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
.split span i{display:block;height:100%;width:100%;background:currentColor;transform-origin:left;
  transform:scaleX(0);transition:transform 1s cubic-bezier(.22,1,.36,1);will-change:transform}
.split em{flex:0 0 30px;text-align:right;font-style:normal;font-size:8px;font-variant-numeric:tabular-nums}

/* ---- bottom rail ------------------------------------------------------- */
.rail2{position:absolute;left:14px;right:14px;bottom:26px;height:46px;display:flex;gap:10px;
  align-items:stretch;opacity:0;transform:translateY(8px);
  transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.rail2.in{opacity:1;transform:none}
.rail2 .box{border:1px solid;background:rgba(1,2,5,.70);border-radius:2px;
  padding:4px 8px;display:flex;flex-direction:column;justify-content:space-between}
.rail2 .box>u{text-decoration:none;font:700 7px/1 'JetBrains Mono',monospace;letter-spacing:.24em;opacity:.55}
.bx1{flex:0 0 206px}.bx2{flex:1;min-width:0}.bx3{flex:0 0 262px}
.rail2 canvas{width:100%;height:24px;display:block}
.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chips{align-items:center;flex-wrap:wrap;gap:4px 5px}
.chips s{text-decoration:none;font-size:7px;letter-spacing:.14em;border:1px solid;padding:2px 6px;
  border-radius:1px;opacity:.28;white-space:nowrap;transition:opacity .4s,box-shadow .4s,background .4s}
.chips s.on{opacity:1;background:rgba(255,255,255,.07);font-weight:700;
  box-shadow:0 0 9px currentColor,inset 0 0 6px rgba(255,255,255,.06)}
.tl2{display:flex;gap:2px;align-items:flex-end;height:24px}
.tl2 i{flex:1;background:currentColor;opacity:.4;transform-origin:bottom;transform:scaleY(.08);
  transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
.tl2 i.now{opacity:1}

/* ---- chrome ----------------------------------------------------------- */
#fps{position:fixed;right:12px;top:12px;z-index:95;font-size:8px;color:#4a4f5c;letter-spacing:.1em;
  font-variant-numeric:tabular-nums;pointer-events:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:95;font-size:8px;
  color:#3a3f4c;letter-spacing:.1em;pointer-events:none;white-space:nowrap}
@media(max-width:900px){ .bx3{display:none} }
@media(max-width:640px){
  .col{width:44vw;top:12.5%;bottom:auto;height:46%}
  .pan{font-size:8px;padding:5px 7px}
  .pan h4{letter-spacing:.16em}
  #hint{display:none}.tab{padding:6px 9px;letter-spacing:.12em}
  #brand{letter-spacing:.10em;font-size:8px}
  .rail,.brk,.retA,.retB,.rail2{display:none}
  .feed{height:auto;min-height:44px}
  .pan.grow .feed{min-height:40px}
  /* keep only the two panels that grow — they fill the band and the scene
     keeps the bottom half of the screen to itself */
  .col .pan.opt:not(.grow){display:none}
}
@media(max-height:620px){ .col .pan.opt{display:none} .rail2{display:none} }
</style></head><body>
<div id="bar"></div>
<div id="wrap"></div>
<div id="hint">1-4 switch · drag to orbit · W replays the wake</div>
<script>
'use strict';
/* ===========================================================================
   ASGARD 3D — four scenes on one hand-rolled 3D engine, drawn in canvas 2D.

   Three.js is deliberately not used. The page already needs CDN-failure
   fallbacks, and a 2.7GB Chromebook can drop to software WebGL where a heavy
   scene simply dies. This is a few hundred lines, has zero dependencies, and
   every frame was verified headlessly before it shipped.

   It is real 3D: points live in world space, are rotated by real matrices,
   projected through a perspective camera, back-face culled, depth sorted
   painter-style, lit by a fixed light vector and fogged by distance.
=========================================================================== */

/* ---- maths ------------------------------------------------------------ */
const V = (x,y,z)=>({x,y,z});
const rotY=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c+p.z*s,y:p.y,z:-p.x*s+p.z*c};};
const rotX=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return{x:p.x,y:p.y*c-p.z*s,z:p.y*s+p.z*c};};
const rotZ=(p,a)=>{const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c,z:p.z};};
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y, a.z*b.x-a.x*b.z, a.x*b.y-a.y*b.x);
function norm(a){const l=Math.hypot(a.x,a.y,a.z)||1;return V(a.x/l,a.y/l,a.z/l);}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
// ease-out cubic, used everywhere a thing should arrive rather than travel
const eo=t=>1-Math.pow(1-clamp(t,0,1),3);
const ei=t=>clamp(t,0,1)*clamp(t,0,1)*clamp(t,0,1);
// smooth 0->1->0 window, for one-shot flashes inside a timeline
const pulse=(t,a,b)=>{if(t<a||t>b)return 0;const u=(t-a)/(b-a);return Math.sin(u*Math.PI);};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);

/* ---- camera & projection ---------------------------------------------- */
// Anything behind the camera plane returns null and MUST be skipped: a point
// at negative depth projects to a mirrored position and reads as a glitch.
// View rotation. Applied here AND in the solid pipeline, so depth sorting and
// back-face culling stay correct when the scene is orbited.
function view(p,cam){
  const y=cam.yaw||0, q=cam.pitch||0;   // coerce: one axis set and the other
  if(!y&&!q) return p;                  // undefined used to poison every point
  return rotX(rotY(p,y),q);
}
function project(p,cam){
  p=view(p,cam);
  const z=p.z+cam.dist;
  if(z<0.16) return null;
  const k=cam.f/z;
  return {x:cam.cx+p.x*k, y:cam.cy-p.y*k, z, k};
}
function makeCam(w,h,dist,fov){
  const f=(Math.min(w,h)*0.5)/Math.tan((fov||1.05)/2);
  return {cx:w/2, cy:h/2, dist:dist||6, f, w, h, sx:0, sy:0};
}
const fog=(z,near,far)=>clamp(1-(z-(near||3))/((far||16)-(near||3)),0,1);

/* ---- batched point drawing -------------------------------------------
   Building an rgba() string per particle per frame doubled p95 on the last
   build. Points are bucketed by colour and alpha decile so fillStyle changes
   a couple of dozen times a frame instead of a couple of thousand.        */
const STATS={faces:0,pts:0};
function Batch(x){this.x=x;this.m=new Map();}
Batch.prototype.add=function(rgb,a,px,py,s){
  if(a<=0.02||s<=0)return;
  const k=rgb+'|'+(a<1?(a*12|0):12);
  let arr=this.m.get(k); if(!arr){arr=[];this.m.set(k,arr);}
  arr.push(px,py,s);
};
Batch.prototype.flush=function(){
  const x=this.x;
  for(const [k,arr] of this.m){
    if(!arr.length) continue;
    const i=k.lastIndexOf('|');
    x.fillStyle='rgba('+k.slice(0,i)+','+((+k.slice(i+1)+0.5)/12).toFixed(3)+')';
    STATS.pts+=arr.length/3;
    for(let j=0;j<arr.length;j+=3){const s=arr[j+2];x.fillRect(arr[j]-s*0.5,arr[j+1]-s*0.5,s,s);}
    arr.length=0;
  }
};

/* ---- solid geometry ----------------------------------------------------
   Filled, shaded, depth-sorted quads. This is the difference between a scene
   that reads as a point cloud and one that reads as an object.            */
function boxVerts(c,h){
  return [V(c.x-h.x,c.y-h.y,c.z-h.z),V(c.x+h.x,c.y-h.y,c.z-h.z),
          V(c.x+h.x,c.y+h.y,c.z-h.z),V(c.x-h.x,c.y+h.y,c.z-h.z),
          V(c.x-h.x,c.y-h.y,c.z+h.z),V(c.x+h.x,c.y-h.y,c.z+h.z),
          V(c.x+h.x,c.y+h.y,c.z+h.z),V(c.x-h.x,c.y+h.y,c.z+h.z)];
}
const BOX_FACES=[[0,1,2,3],[4,5,6,7],[0,4,7,3],[1,5,6,2],[3,2,6,7],[0,1,5,4]];
function xform(verts,fn){const o=new Array(verts.length);for(let i=0;i<verts.length;i++)o[i]=fn(verts[i]);return o;}

const LIGHT=norm(V(-0.42,0.82,-0.38));
// Collect faces into a shared list so every solid in a scene sorts against
// every other one — per-object sorting is what makes cheap 3D look wrong.
function pushSolid(list,verts,faces,rgb,opt){
  opt=opt||{};
  for(let fi=0;fi<faces.length;fi++){
    const f=faces[fi], n=f.length;
    let cx=0,cy=0,cz=0;
    for(let i=0;i<n;i++){cx+=verts[f[i]].x;cy+=verts[f[i]].y;cz+=verts[f[i]].z;}
    cx/=n;cy/=n;cz/=n;
    let nrm=norm(cross(sub(verts[f[1]],verts[f[0]]),sub(verts[f[2]],verts[f[0]])));
    // Flip toward outward using the solid's own centroid — removes any
    // dependence on face winding, which is where hand-built meshes go wrong.
    if(opt.centre&&dot(nrm,sub(V(cx,cy,cz),opt.centre))<0) nrm=mul(nrm,-1);
    const cam=opt.cam;
    const cv=view(V(cx,cy,cz),cam), nv=view(nrm,cam);
    const facing=dot(nv,V(cv.x,cv.y,cv.z+cam.dist));
    if(opt.cull!==false&&facing>0) continue;      // back face
    // light is fixed in world space, so shading uses the world normal
    const lum=0.16+0.84*Math.max(0,dot(nrm,LIGHT));
    list.push({f,verts,rgb:opt.rgb||rgb,z:cv.z,lum,alpha:opt.alpha==null?1:opt.alpha,
               edge:opt.edge,edgeA:opt.edgeA==null?0.5:opt.edgeA,ew:opt.ew||1});
  }
}
function drawFaces(x,cam,list){
  STATS.faces+=list.length;
  list.sort((a,b)=>b.z-a.z);                        // painter: far first
  for(let i=0;i<list.length;i++){
    const F=list[i], pts=[];
    let ok=true;
    for(let j=0;j<F.f.length;j++){const s=project(F.verts[F.f[j]],cam);if(!s){ok=false;break;}pts.push(s);}
    if(!ok) continue;
    const g=fog(F.z+cam.dist,2,22);
    x.beginPath();x.moveTo(pts[0].x,pts[0].y);
    for(let j=1;j<pts.length;j++)x.lineTo(pts[j].x,pts[j].y);
    x.closePath();
    const c=F.rgb.split(',');
    const l=F.lum*(0.35+0.65*g);
    x.fillStyle='rgba('+((c[0]*l)|0)+','+((c[1]*l)|0)+','+((c[2]*l)|0)+','+(F.alpha*(0.3+0.7*g)).toFixed(3)+')';
    x.fill();
    if(F.edge){x.strokeStyle='rgba('+F.edge+','+(F.edgeA*g).toFixed(3)+')';x.lineWidth=F.ew;x.stroke();}
  }
}

/* ---- line / point helpers --------------------------------------------- */
function path3(x,pts,cam,rgb,alpha,width){
  if(alpha<=0.01)return;
  let started=false;x.beginPath();
  for(let i=0;i<pts.length;i++){
    const s=project(pts[i],cam);
    if(!s){started=false;continue;}
    if(!started){x.moveTo(s.x,s.y);started=true;} else x.lineTo(s.x,s.y);
  }
  x.strokeStyle='rgba('+rgb+','+alpha.toFixed(3)+')';x.lineWidth=width||1;x.stroke();
}
function loop3(x,pts,cam,rgb,alpha,width){
  if(alpha<=0.01||!pts.length)return;
  const q=pts.slice();q.push(pts[0]);path3(x,q,cam,rgb,alpha,width);
}
// A soft additive glow at a world position. This is what makes a point read
// as light instead of as confetti. Expensive — used on tens, never thousands.
function glow3(x,p,cam,rgb,alpha,radius){
  const s=project(p,cam); if(!s)return null;
  const r=Math.max(2,radius*s.k*0.01);
  const g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,r);
  g.addColorStop(0,'rgba('+rgb+','+alpha.toFixed(3)+')');
  g.addColorStop(0.45,'rgba('+rgb+','+(alpha*0.32).toFixed(3)+')');
  g.addColorStop(1,'rgba('+rgb+',0)');
  x.fillStyle=g;x.beginPath();x.arc(s.x,s.y,r,0,6.2832);x.fill();
  return s;
}
function ring3(n,r,tiltX,tiltZ,yOff){
  const out=[];
  for(let i=0;i<n;i++){
    const a=(i/n)*6.2832;
    let p=V(Math.cos(a)*r,yOff||0,Math.sin(a)*r);
    if(tiltX)p=rotX(p,tiltX);
    if(tiltZ)p=rotZ(p,tiltZ);
    out.push(p);
  }
  return out;
}
function sphereCloud(n,r,jit){
  const out=[],ga=Math.PI*(3-Math.sqrt(5));   // golden angle: even, no pole clumping
  for(let i=0;i<n;i++){
    const y=1-(i/(n-1))*2, rad=Math.sqrt(Math.max(0,1-y*y)), th=ga*i;
    const rr=r*(1+(Math.random()-0.5)*(jit||0));
    out.push(V(Math.cos(th)*rad*rr,y*rr,Math.sin(th)*rad*rr));
  }
  return out;
}
function bolt(a,b,segs,spread){
  const pts=[a];
  for(let i=1;i<segs;i++){
    const t=i/segs, w=Math.sin(t*Math.PI);
    pts.push(V(a.x+(b.x-a.x)*t+(Math.random()-0.5)*spread*w,
               a.y+(b.y-a.y)*t+(Math.random()-0.5)*spread*w,
               a.z+(b.z-a.z)*t+(Math.random()-0.5)*spread*w));
  }
  pts.push(b);return pts;
}
function floorGrid(x,cam,rgb,t,span,alpha,reveal){
  const R=reveal==null?1:reveal;
  if(R<=0)return;
  const drift=(t*0.55)%1;
  for(let i=-span;i<=span;i++){
    const zz=i+drift;
    if(Math.abs(zz)>span*R) continue;
    const f=fog(zz+cam.dist,0,span*1.7);
    path3(x,[V(-span,-2.3,zz),V(span,-2.3,zz)],cam,rgb,alpha*f*0.9,1);
  }
  for(let i=-span;i<=span;i++){
    if(Math.abs(i)>span*R) continue;
    path3(x,[V(i,-2.3,-span),V(i,-2.3,span)],cam,rgb,alpha*0.34,1);
  }
}

/* Many short 3D segments in one stroke call, split into a few depth buckets
   so distance still fades. 340 rain streaks cost 3 strokes, not 340. */
function streaks(x,cam,segsArr,rgb,width){
  const B=4;
  for(let b=0;b<B;b++){
    let any=false;x.beginPath();
    for(let i=0;i<segsArr.length;i++){
      const S=segsArr[i];
      const a=project(S[0],cam), c=project(S[1],cam);
      if(!a||!c) continue;
      const g=fog(a.z,1,20), bucket=clamp(Math.floor(g*B),0,B-1);
      if(bucket!==b) continue;
      x.moveTo(a.x,a.y);x.lineTo(c.x,c.y);any=true;
    }
    if(any){x.strokeStyle='rgba('+rgb+','+(0.06+0.20*(b/(B-1))).toFixed(3)+')';
            x.lineWidth=width*(0.6+0.7*(b/(B-1)));x.stroke();}
  }
}

/* A double-sided quad. Cards have no inside, so back-face culling is wrong
   for them — instead the two sides get different colours, which is what
   makes a mirror read as a mirror when it turns over. */
function pushQuad(list,verts,cam,front,back,opt){
  opt=opt||{};
  let cx=0,cy=0,cz=0;
  for(let i=0;i<4;i++){cx+=verts[i].x;cy+=verts[i].y;cz+=verts[i].z;}
  cx/=4;cy/=4;cz/=4;
  const n=norm(cross(sub(verts[1],verts[0]),sub(verts[2],verts[0])));
  const cv=view(V(cx,cy,cz),cam), nv=view(n,cam);
  const facing=dot(nv,V(cv.x,cv.y,cv.z+cam.dist));
  const lum=0.20+0.80*Math.abs(dot(n,LIGHT));
  list.push({f:[0,1,2,3],verts,rgb:facing<0?front:back,z:cv.z,lum,
             alpha:opt.alpha==null?1:opt.alpha,edge:opt.edge,
             edgeA:opt.edgeA==null?0.5:opt.edgeA,ew:opt.ew||1});
}
// An N-gon, same pipeline as pushQuad. Some shapes are one silhouette and
// chopping them into quads is what makes them read as assembled plates.
function pushPoly(list,verts,cam,front,back,opt){
  opt=opt||{};
  const n=verts.length;
  let cx=0,cy=0,cz=0;
  for(let i=0;i<n;i++){cx+=verts[i].x;cy+=verts[i].y;cz+=verts[i].z;}
  cx/=n;cy/=n;cz/=n;
  const nr=norm(cross(sub(verts[1],verts[0]),sub(verts[2],verts[0])));
  const cv=view(V(cx,cy,cz),cam), nv=view(nr,cam);
  const f=[];for(let i=0;i<n;i++)f.push(i);
  list.push({f,verts,rgb:dot(nv,V(cv.x,cv.y,cv.z+cam.dist))<0?front:back,z:cv.z,
             lum:0.22+0.78*Math.abs(dot(nr,LIGHT)),
             alpha:opt.alpha==null?1:opt.alpha,edge:opt.edge,
             edgeA:opt.edgeA==null?0.5:opt.edgeA,ew:opt.ew||1});
}

    S.tellT=5.5;S.tellCard=0;S.tellAmt=0;S.named=false;S.n1=0;S.n2=0;S.spinT=0;
  },
  draw(x,cam,t,dt,W,S,B){
    const wake=W<this.wakeLen;
    cam.cx=cam.w/2;cam.cy=cam.h/2;
    // the tell: everything stops, one mirror gives itself away, everything resumes
    S.tellT-=dt;
    if(S.tellT<=0){S.tellT=7.5+Math.random()*5;S.tellCard=(Math.random()*S.cards.length)|0;S.tellAmt=1;
      LOG('loki','MIRROR '+String(S.tellCard+1).padStart(2,'0')+' GAVE ITSELF AWAY',true);}
    S.tellAmt=Math.max(0,S.tellAmt-dt*1.15);
    const freeze=1-S.tellAmt*0.92;
    S.spinT=(S.spinT||0)+dt*freeze;
    const T=S.spinT;

    if(wake&&!S.named){
      if(W>3.40&&!S.n1){S.n1=1;SETNAME('ODIN');}
      if(W>4.10&&!S.n2){S.n2=1;GLITCHNAME('LOKI',['ODIN','L0KI','LOKI','0DIN','LOKI']);S.named=true;}
    }

    floorGrid(x,cam,this.rgb,t,9,0.13,wake?eo(seg(W,1.6,3.2)):1);

    const faces=[];

    /* ---- twin tetrahedra --------------------------------------------- */
    const tetA=wake?eo(seg(W,2.20,3.20)):1;
    if(tetA>0.02){
      const sc=0.80*tetA;
      const t1=xform(TETRA,p=>mul(rotY(rotX(p,T*0.5),T*0.85),sc));
      const t2=xform(TETRA,p=>mul(rotZ(rotY(p,-T*0.7),T*0.4),sc*1.42));
      pushSolid(faces,t1,TETRA_F,'30,86,56',{centre:V(0,0,0),cam:cam,cull:false,
        alpha:0.68*tetA,edge:this.hot,edgeA:0.95*tetA,ew:1.8});
      pushSolid(faces,t2,TETRA_F,'12,38,24',{centre:V(0,0,0),cam:cam,cull:false,
        alpha:0.30*tetA,edge:this.rgb,edgeA:0.55*tetA,ew:1});
      // ghosts: the same shape, three beats behind, which is the whole joke
      for(let g=1;g<=3;g++){
        const lag=T-g*0.20, s2=sc*(1+g*0.14);
        const tg=xform(TETRA,p=>mul(rotY(rotX(p,lag*0.5),lag*0.85),s2));
        pushSolid(faces,tg,TETRA_F,'10,30,20',{centre:V(0,0,0),cam:cam,cull:false,
          alpha:0.10*tetA/g,edge:this.rgb,edgeA:0.22*tetA/g,ew:1});
      }
    }

    /* ---- the mirror cards -------------------------------------------- */
    const FLOOR=-2.30;
    for(let i=0;i<S.cards.length;i++){
      const c=S.cards[i];
      let born=1, fly=1;
      if(wake){
        if(W<c.tIn) continue;
        born=clamp((W-c.tIn)/0.34,0,1);
        fly=eo(clamp((W-c.tIn)/0.75,0,1));
      }
      const ang=(c.slot/c.n)*6.2832+T*c.spd;
      const pos=V(Math.cos(ang)*c.r*fly, lerp(0,c.y,fly), Math.sin(ang)*c.r*fly);
      // Near clip fade. Without it a pane that swings past the lens becomes a
      // full-screen slab and buries the readouts.
      const vz=view(pos,cam).z+cam.dist;
      const nearF=clamp((vz-1.5)/2.2,0,1);
      if(nearF<0.02) continue;
      const flip=T*(0.62+c.ri*0.20)+c.fp;
      const w=0.30*born, hgt=0.50*born;
      const hit=(i===S.tellCard)?S.tellAmt:0;
      const local=[V(-w,-hgt,0),V(w,-hgt,0),V(w,hgt,0),V(-w,hgt,0)];
      const place=p=>add(rotY(p,flip+ang),pos);
      pushQuad(faces,local.map(place),cam,
        hit>0.02?'204,255,224':'70,176,116',
        hit>0.02?'160,240,192':'13,40,26',
        {alpha:0.9*born*nearF,edge:hit>0.02?'238,255,246':this.hot,
         edgeA:(0.60+0.4*hit)*born*nearF,ew:hit>0.02?2.4:1.2});
      // the reflection: same pane mirrored through the floor. This is the
      // difference between a carousel and a hall.
      const refl=local.map(p=>{const q=place(p);return V(q.x,2*FLOOR-q.y,q.z);});
      pushQuad(faces,refl,cam,'26,72,48','10,30,20',
        {alpha:0.40*born*nearF,edge:this.rgb,edgeA:0.24*born*nearF,ew:1});
    }
    drawFaces(x,cam,faces);

    /* ---- edge sparkle on the ring planes ------------------------------ */
    x.globalCompositeOperation='lighter';
    for(let k=0;k<3;k++){
      const R=S.rings[k];
      const a=wake?seg(W,1.2+k*0.3,2.6+k*0.3):1;
      if(a<0.02) continue;
      loop3(x,ring3(72,R.r,0,0,R.y),cam,this.rgb,0.16*a,1);
      loop3(x,ring3(72,R.r,0,0,2*FLOOR-R.y),cam,this.rgb,0.05*a,1);
    }
    if(!wake||W>3.0){
      glow3(x,V(0,0,0),cam,this.hot,0.15,220);
      // one travelling highlight, so the hall always has a light moving in it
      const a=T*0.55, R=S.rings[1];
      glow3(x,V(Math.cos(a)*R.r,R.y,Math.sin(a)*R.r),cam,this.hot,0.26,95);
      glow3(x,V(0,FLOOR+0.02,0),cam,this.rgb,0.10,300);
    }
    x.globalCompositeOperation='source-over';
  }
};

/* Eight rune shapes as line segments in local [-1,1] space. Real angular
   Elder-Futhark-ish strokes rather than random scribble — straight cuts only,
   because runes were carved, not written. */
const RUNES=[
  [[0,-1,0,1],[0,0.4,0.7,1],[0,0.4,-0.7,1]],
  [[-0.6,-1,-0.6,1],[-0.6,1,0.6,0.3],[0.6,0.3,-0.6,-0.3]],
  [[0,-1,0,1],[-0.7,0.6,0.7,0.6],[-0.7,-0.2,0.7,-0.2]],
  [[-0.7,-1,0,1],[0,1,0.7,-1]],
  [[-0.6,-1,-0.6,1],[0.6,-1,0.6,1],[-0.6,0.5,0.6,-0.5]],
  [[0,-1,0,1],[-0.7,1,0,0.2],[0.7,1,0,0.2]],
  [[-0.7,-1,-0.7,1],[-0.7,1,0.7,1],[-0.7,0,0.4,0]],
  [[-0.7,0,0,1],[0,1,0.7,0],[0.7,0,0,-1],[0,-1,-0.7,0]]
];

  init(S,w,h){

        const wob=1+Math.sin(a*3+t*1.3+i)*0.035;
        // 'open' squashes the ring flat, which is the lid rather than a fade
        pts.push(V(Math.cos(a)*R.r*wob, Math.sin(a)*R.r*wob*open, R.z));

      const f=fog(R.z+cam.dist,1,17);

        S.mote[i*4+1]=r;S.mote[i*4+2]=z;
        const a=S.mote[i*4]+t*0.22;
        const s=project(V(Math.cos(a)*r,Math.sin(a)*r*open,z),cam); if(!s) continue;

      // glyphs are legible instead of edge-on. Each one stands radially.

      const sweep=(t*0.42)%1;
      for(let i=0;i<N;i++){

        const a=(i/N)*6.2832+spin;
        const ca=Math.cos(a), sa=Math.sin(a);

          return V(ca*rr - sa*lx, sa*rr + ca*lx, RZ);

          const g=G[s2];
          path3(x,[P(g[0],g[1]),P(g[2],g[3])],cam,this.hot,glowNow*0.9,1.6);
        }
      }
      const collar=[];
      for(let j=0;j<96;j++){const a=(j/96)*6.2832;collar.push(V(Math.cos(a)*RR,Math.sin(a)*RR,RZ));}
      loop3(x,collar,cam,this.rgb,runeP*0.16,1);
      x.globalCompositeOperation='source-over';
    }
  }
};

    const CH='ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>/\\|=+*#$%&';
    S.chars=CH;S.cw=26;S.chh=30;
    const mk=(col)=>{
      const c=document.createElement('canvas');
      c.width=S.cw*CH.length;c.height=S.chh;
      const g=c.getContext('2d');
      g.font='700 21px "JetBrains Mono",ui-monospace,monospace';
      g.textAlign='center';g.textBaseline='middle';g.fillStyle=col;
      for(let i=0;i<CH.length;i++) g.fillText(CH[i],i*S.cw+S.cw/2,S.chh/2);
      return c;
    };
    S.atlasG=mk('#3dff9a');S.atlasW=mk('#eafff4');S.atlasReady=true;
    }
    // Widened from r=1.0: at the old radius every strand projected to nearly
    // the same few columns and the glyphs stacked into a solid green slab.
    S.TOP=4.05;
    S.N=76;S.st=[];
    for(let i=0;i<S.N;i++){
      const a=(i*2.399), r=Math.sqrt((i+0.5)/S.N)*1.34;
      S.st.push({x:Math.cos(a)*r, z:Math.sin(a)*r,
        y:-2.3+Math.random()*6.6, spd:1.8+Math.random()*2.4,
        len:5+((Math.random()*8)|0), seed:(Math.random()*997)|0,
        swap:Math.random()*0.4});
    }
    S.rings=[];
    for(let i=0;i<8;i++) S.rings.push({y:-2.15+i*0.84, ph:i*0.8, flash:0});
    S.typed=-1;S.struck=false;S.gateShown=false;S.boost=S.boost||0;S.erupted=false;
    if(S.unlocked===undefined)S.unlocked=false;
  },
  draw(x,cam,t,dt,W,S,B){
    const wake=W<this.wakeLen;
    cam.cx=cam.w/2;cam.cy=cam.h/2;
    const core = wake?eo(seg(W,0.45,1.45)):1;    // the seed line rises
    const erupt= wake?seg(W,1.20,2.70):1;        // strands appear bottom-up
    const collars=wake?seg(W,1.80,3.45):1;
    const top=-2.3+core*(S.TOP+2.3);
    S.boost=lerp(S.boost,S.unlocked?1:0,Math.min(1,dt*2.2));

    if(wake){
      if(W>=3.55&&W<4.55){
        const n=clamp(Math.floor((W-3.55)/0.24)+1,0,4);
        if(n!==S.typed){S.typed=n;SETNAME('HELA'.slice(0,n));}
      } else if(W>=4.55&&S.typed!==4){S.typed=4;SETNAME('HELA');}
      if(W>=4.72&&!S.struck){S.struck=true;STRIKE(true);FLASH(0.30);}
      if(W>=3.30&&!S.erupted){S.erupted=true;FLASH(0.22);}
    }

    /* ---- the core seed line -------------------------------------------- */
    if(core<0.999||wake){
      x.globalCompositeOperation='lighter';
      path3(x,[V(0,-2.3,0),V(0,top,0)],cam,this.hot,0.55*(1-erupt*0.75),2.4);
      glow3(x,V(0,-2.3,0),cam,this.hot,0.5*(1-erupt*0.6),120);
      glow3(x,V(0,top,0),cam,this.hot,0.42*(1-erupt*0.8),90);
      x.globalCompositeOperation='source-over';
    }

    /* ---- containment collars ------------------------------------------- */
    x.globalCompositeOperation='lighter';
    const rib=[];
    for(let i=0;i<S.rings.length;i++){
      const R=S.rings[i];
      const on=clamp((collars*8)-i,0,1);
      if(on<0.02) continue;
      if(on>0.9&&!R.snapped){R.snapped=true;R.flash=1;
        LOG('hela','COLLAR '+(i+1)+'/8 ENGAGED');}
      R.flash=Math.max(0,R.flash-dt*2.4);
      const rad=(1.86+Math.sin(t*0.8+R.ph)*0.06)*(0.4+0.6*eo(on))*(1+S.boost*0.10);
      const pts=ring3(52,rad,0,0,R.y).map(p=>rotY(p,t*(i%2?0.30:-0.24)));
      loop3(x,pts,cam,R.flash>0.02?this.hot:this.rgb,(0.18+0.55*R.flash+S.boost*0.18)*on,R.flash>0.02?2.4:1.2);
      rib.push({pts,on});
    }
    // vertical ribs tying the collars into a cage
    if(rib.length>1){
      for(let k=0;k<52;k+=4){
        for(let i=0;i<rib.length-1;i++){
          const a=Math.min(rib[i].on,rib[i+1].on);
          if(a<0.05) continue;
          path3(x,[rib[i].pts[k],rib[i+1].pts[k]],cam,this.rgb,0.055*a,1);
        }
      }
    }
    x.globalCompositeOperation='source-over';

    /* ---- the falling glyph strands -------------------------------------- */
    const sorted=S.st.slice().sort((a,b)=>b.z-a.z);       // painter, 64 items
    const rate=(1+S.boost*0.7);
    for(let i=0;i<sorted.length;i++){
      const s=sorted[i];
      s.y-=s.spd*dt*rate*(wake?clamp(erupt*1.4,0,1):1);
      if(s.y<-2.3-s.len*0.30){s.y=top+Math.random()*0.9;s.seed=(Math.random()*997)|0;}
      // strands ignite from the floor upward during the eruption
      const gate=wake?clamp(erupt*1.5-(i/sorted.length)*0.5,0,1):1;
      if(gate<0.03) continue;
      const px=s.x*(0.35+0.65*core), pz=s.z*(0.35+0.65*core);
      for(let j=0;j<s.len;j++){
        const gy=s.y+j*0.30;
        if(gy>top+0.4||gy<-2.34) continue;
        const p=project(V(px,gy,pz),cam); if(!p) continue;
        const dep=fog(p.z,3,13);
        const fade=1-j/s.len;
        const a=gate*fade*(0.18+0.46*dep)*(0.85+S.boost*0.35);
        if(a<0.035) continue;
        const idx=(s.seed+j*31+((t*(3+s.swap*9))|0)*7)%S.chars.length;
        const hgt=Math.max(5,S.chh*p.k*0.0082);
        const wid=hgt*(S.cw/S.chh);
        x.globalAlpha=Math.min(1,a);
        STATS.pts++;
        x.drawImage(j===0?S.atlasW:S.atlasG, idx*S.cw,0,S.cw,S.chh,
                    p.x-wid/2, p.y-hgt/2, wid, hgt);
      }
    }
    x.globalAlpha=1;

    /* ---- floor pool and gate reveal ------------------------------------- */
    x.globalCompositeOperation='lighter';
    glow3(x,V(0,-2.28,0),cam,this.rgb,0.16+0.14*S.boost,260);
    const ph=(t*0.36)%1;
    loop3(x,ring3(48,ph*4.2,0,0,-2.29),cam,this.rgb,(1-ph)*0.14*(0.5+erupt*0.5),1.2);
    if(S.unlocked){
      for(let k=0;k<3;k++){
        const q=((t*0.5+k/3)%1);
        loop3(x,ring3(48,1.86+q*3.2,0,0,lerp(-2.2,4.2,q)),cam,this.hot,(1-q)*0.16,1);
      }
    }
    x.globalCompositeOperation='source-over';
    if(wake&&W>5.35&&!S.gateShown){S.gateShown=true;SHOWGATE(true);}
  }
};

/* ---- scene hooks ------------------------------------------------------- */
function FLASH(a){flashAmt=Math.max(flashAmt,a);}
function SHAKE(px){shakeAmt=Math.max(shakeAmt,px);}
function SHAKEV(dt){const v=shakeAmt;shakeAmt=Math.max(0,shakeAmt-dt*44);return v;}
function SETNAME(s2){const u=UI[active.key];if(u.txt.textContent!==s2){u.txt.textContent=s2;}
  if(s2&&!u.name.classList.contains('in'))u.name.classList.add('in');}
function STRIKE(on){UI[active.key].name.classList.toggle('struck',!!on);}
function GLITCHNAME(final,frames){
  const u=UI[active.key];let i=0;
  const step=()=>{ if(i<frames.length){u.txt.textContent=frames[i++];setTimeout(step,58+Math.random()*46);}
                   else u.txt.textContent=final; };
  step();
}

/* ---- panel life: eased readouts, no per-frame DOM writes --------------- */
const NUMRE=/\d[\d,]*(?:\.\d+)?/;
function nudge(){
  const u=UI[active.key];
  u.pans.forEach(P=>{
    if(!P.el.classList.contains('in')) return;
    if(P.def.live){fillSystem(P);return;}            // real numbers, never jittered
    P.leds.forEach((L,i)=>{
      const warn=Math.random()<0.03;
      L.classList.toggle('warn',warn);
      L.classList.toggle('on',!warn&&Math.random()>0.05);
    });
    P.split.forEach((I,i)=>{
      const d=(P.def.split&&P.def.split[i])?P.def.split[i][1]:0.5;
      const v=clamp(d+(Math.random()-0.5)*0.10,0.04,1);
      I.style.transform='scaleX('+v.toFixed(3)+')';
      const em=I.parentElement.nextElementSibling;
      if(em&&/%$/.test(em.textContent)) em.textContent=Math.round(v*100)+'%';
    });
    P.vals.forEach(v=>{
      const m=v.textContent.match(NUMRE); if(!m) return;
      if(v._base==null) v._base=parseFloat(m[0].replace(/[\s,]/g,''));
      const base=v._base;
      const nv=base*(1+(Math.random()-0.5)*0.035);
      const dec=(m[0].split('.')[1]||'').length;
      const cap=/%/.test(v.textContent)?Math.min(nv,100):nv;   // no 101% uptime
      const shown=dec?cap.toFixed(dec):Math.round(cap).toLocaleString('en-US');
      v.textContent=v.textContent.replace(NUMRE,shown);
    });
    if(P.bar) P.bar.style.transform='scaleX('+clamp(P.def.bar+(Math.random()-0.5)*0.06,0.04,1)+')';
    P.mini.forEach(i2=>{i2.style.transform='scaleY('+(0.12+Math.random()*0.88).toFixed(3)+')';});
  });
}
setInterval(()=>{if(active&&!document.hidden)nudge();},1900);

/* ---- telemetry ---------------------------------------------------------
   Every number in the SYSTEM panel is read off this machine. Nothing here is
   invented — if a browser will not report a value it shows a dash rather than
   a plausible-looking lie.                                                  */
const T0=performance.now();
const TEL={heap:null,cores:navigator.hardwareConcurrency||null,
  dev:navigator.deviceMemory||null,link:null,batt:null,
  frame:16.7,faces:0,pts:0,fps:60};
(function(){
  const c=navigator.connection;
  if(c){ const upd=()=>{TEL.link=(c.effectiveType||'?')+(c.downlink?' · '+c.downlink+' Mb':'');};
         upd(); if(c.addEventListener) c.addEventListener('change',upd); }
  if(navigator.getBattery) navigator.getBattery().then(b=>{
    const upd=()=>{TEL.batt=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'');};
    upd(); b.addEventListener('levelchange',upd); b.addEventListener('chargingchange',upd);
  }).catch(()=>{});
})();
function telRead(){
  const m=performance.memory;
  if(m) TEL.heap=(m.usedJSHeapSize/1048576).toFixed(1)+' MB';
  return TEL;
}
const upSince=()=>{
  const s2=Math.floor((performance.now()-T0)/1000);
  return String(Math.floor(s2/60)).padStart(2,'0')+':'+String(s2%60).padStart(2,'0');
};
function fillSystem(P){
  telRead();
  const put=(i,v)=>{if(P.vals[i])P.vals[i].textContent=v;};
  put(0,TEL.heap||(TEL.dev?TEL.dev+' GB DEV':'—'));
  put(1,(TEL.cores||'—')+(TEL.batt?' · '+TEL.batt:''));
  put(2,TEL.link||'—');
  put(3,TEL.frame.toFixed(1)+' ms · '+TEL.fps+'f');
  put(4,(TEL.faces?TEL.faces+'q / ':'')+TEL.pts+'p');
}

/* ---- live log feed -----------------------------------------------------
   Real events go in first; the persona's ambient lines only fill the gaps,
   so what you are reading is mostly the page describing itself.            */
const LOGS={};

function clockNow(){
  const d=new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
       +':'+String(d.getSeconds()).padStart(2,'0');
}
function LOG(key,text,hot){
  const L=LOGS[key]; if(!L) return;
  L.lines.unshift({t:clockNow(),m:text,hot:!!hot});
  if(L.lines.length>14) L.lines.length=14;
  L.dirty=true;
}
function paintFeeds(){

/* ---- bottom rail: frame histogram, status chips, session timeline ------- */
const FRAMES=new Float32Array(84); let fi=0;
const BUCKETS=new Float32Array(40); let bIdx=0, bAcc=0, bT=0;
function paintRail(){
  const u=UI[active.key], sc=active;
  const c=u.cvF; if(!c) return;
  const x=c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);

    x.fillRect(i*w,c.height-h,Math.max(1,w-1),h);
  }
  // the 16.7ms line — the thing every bar is being judged against

  x.fillRect(0,c.height-(16.7/33)*c.height,c.width,1);
  const bars=u.tl2.children;
  for(let i=0;i<bars.length;i++){

    bars[i].style.transform='scaleY('+(0.06+Math.min(1,v)*0.94).toFixed(3)+')';
    bars[i].classList.toggle('now',i===bars.length-1);
  }
}
/* The trace walks one step at a time. It is a loop, not a claim about what
   the backend is doing this second — but the cadence is the real point. */
let traceStep=0, traceT=0;
function paintTrace(dt){
  traceT+=dt;
  if(traceT<1.15) return;
  traceT=0;
  const u=UI[active.key];
  u.pans.forEach(P=>{
    if(!P.trace.length||!P.el.classList.contains('in')) return;
    const n=P.trace.length;
    P.trace.forEach((row,i)=>{
      row.classList.toggle('act',i===traceStep);
      row.classList.toggle('done',i<traceStep);
      const em=row.children[2];
      em.textContent = i<traceStep?'OK' : i===traceStep?'\u2022\u2022\u2022' : '';
    });
    // P.trace holds the DOM rows; the labels live on the definition
    if(traceStep===n-1) LOG(active.key,String(P.def.trace[n-1]).toUpperCase()+' \u2014 CYCLE COMPLETE');
  });
  traceStep=(traceStep+1)%6;
}

function paintChips(){
  const u=UI[active.key];
  const cs=u.chips.children;
  for(let i=0;i<cs.length;i++){
    let on=true;
    const label=cs[i].textContent;
    if(label==='GATE') on=!!state.hela.unlocked;      // genuinely reflects the seal
    else if(label==='INDEX') on=false;                // she is not indexed, by design
    else on=Math.random()>0.06;                       // everything else blips
    cs[i].classList.toggle('on',on);
  }
}

/* ---- reveal timeline --------------------------------------------------- */
function applyReveal(sc,w){
  const u=UI[sc.key], r=REV[sc.key];
  if(!r.writes) u.name.classList.toggle('in',w>=r.name);
  u.sub.classList.toggle('in',w>=r.sub);
  u.pans.forEach((P,i)=>P.el.classList.toggle('in',w>=r.pan+i*0.13));
  u.tick.classList.toggle('in',w>=r.tick);
  if(u.rail2) u.rail2.classList.toggle('in',w>=r.pan+0.45);
  if(w>=r.pan&&!u._nudged){u._nudged=1;setTimeout(nudge,60);}
}

/* ---- routing ----------------------------------------------------------- */
function go(key,replay){
  const sc=SCENES.find(s2=>s2.key===key)||SCENES[0];
  if(active===sc&&!replay) return;
  active=sc;
  SCENES.forEach(s2=>{
    UI[s2.key].tab.classList.toggle('on',s2===sc);
    UI[s2.key].stage.classList.toggle('on',s2===sc);
  });
  const u=UI[sc.key];
  u.name.classList.remove('in','struck');u.sub.classList.remove('in');
  u.tick.classList.remove('in');u.pans.forEach(P=>P.el.classList.remove('in'));
  u._nudged=0;
  u.txt.textContent=REV[sc.key].writes?'':sc.name;
  SHOWGATE(false);
  const g=$('#gmsg'); if(g){g.style.opacity=0;g.textContent='';}
  cam.yaw=0;cam.pitch=sc.pitch0||0;cam.dist=sc.dist;
  sc.init(state[sc.key],W,H);
  state[sc.key]._online=0;
  LOGS[sc.key].lines.length=0;
  LOG(sc.key,'WAKE SEQUENCE INITIATED',true);
  LOG(sc.key,'VIEWPORT '+W+'\u00d7'+H+' @'+DPR.toFixed(2)+'x');
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  wakeStart=performance.now()/1000;
  shakeAmt=0;flashAmt=0;
  try{history.replaceState(null,'','#'+sc.key);}catch(e){}
  document.title='ASGARD · '+sc.name;
}

/* ---- camera & resize --------------------------------------------------- */
let cam=makeCam(800,600,7,1.05);
function resize(){
  const r=wrap.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=Math.max(320,Math.round(r.width));H=Math.max(240,Math.round(r.height));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(active) LOG(active.key,'VIEWPORT '+W+'\u00d7'+H+' @'+DPR.toFixed(2)+'x');
  const yaw=cam.yaw||0,pitch=cam.pitch||0,d=cam.dist;
  cam=makeCam(W,H,d,active?active.fov:1.05);
  cam.yaw=yaw;cam.pitch=pitch;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(active) active.init(state[active.key],W,H);
}
let rt=0;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,140);});

/* ---- orbit ------------------------------------------------------------- */
let drag=null;
cv.style.touchAction='none';
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw||0,pitch:cam.pitch||0};
  cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  cam.yaw=clamp(drag.yaw+(e.clientX-drag.x)*0.0042,-0.85,0.85);
  cam.pitch=clamp(drag.pitch+(e.clientY-drag.y)*0.0032,-0.42,0.42);
});
addEventListener('pointerup',()=>{
  if(drag&&active) LOG(active.key,'ORBIT yaw '+(cam.yaw>=0?'+':'')+cam.yaw.toFixed(2)
    +' · pitch '+(cam.pitch>=0?'+':'')+cam.pitch.toFixed(2));
  drag=null;
});
addEventListener('pointercancel',()=>{drag=null;});

addEventListener('hashchange',()=>{
  const k=location.hash.replace('#','').toLowerCase();
  if(SCENES.some(s2=>s2.key===k)) go(k,true);
});

/* ---- keys -------------------------------------------------------------- */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='4') go(SCENES[+k-1].key,true);
  if(k==='w') go(active.key,true);
});

/* ---- HELA gate --------------------------------------------------------- */
(function(){
  const inp=document.querySelector('#gate input'); if(!inp) return;
  const msg=$('#gmsg');
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const S=state.hela;
    if(inp.value.trim().toLowerCase()==='death'){
      S.unlocked=true;inp.value='';inp.blur();
      msg.textContent='SEAL RELEASED';msg.style.opacity=1;
      LOG('hela','SEAL RELEASED \u00b7 VAULT READABLE',true);
      FLASH(0.55);SHAKE(14);
      SHOWGATE(false);
      UI.hela.name.classList.remove('struck');
      const set=(pi,ri,txt)=>{const v=UI.hela.pans[pi].vals[ri];if(v){v.textContent=txt;v._base=null;}};
      set(2,2,'RELEASED'); set(0,1,'OPEN'); set(1,2,'READABLE');
      UI.hela.pans[2].def.bar=0.94;
      setTimeout(()=>{UI.hela.pans.forEach(P=>P.el.classList.add('in'));nudge();},200);
    }else{
      inp.classList.add('bad');inp.value='';
      msg.textContent='DENIED';msg.style.opacity=1;
      LOG('hela','GATE ATTEMPT REJECTED',true);
      setTimeout(()=>inp.classList.remove('bad'),380);
      setTimeout(()=>{msg.style.opacity=0;},1400);
    }
  });
})();

/* ---- the loop ---------------------------------------------------------- */
let last=performance.now()/1000, fpsAcc=0, fpsN=0, fpsT=0;
let paintT=0, chipT=0, ambT=0;
function frame(now){
  requestAnimationFrame(frame);
  const T=now/1000;
  let dt=T-last; last=T;
  if(document.hidden) return;
  if(dt>0.1) dt=0.1;                       // a tab-switch stall must not teleport
  if(dt<=0) dt=1/60;

  const sc=active, u=UI[sc.key], S=state[sc.key];
  const w=T-wakeStart;

  // frame histogram + session buckets, both fed by real elapsed time
  FRAMES[fi]=dt*1000; fi=(fi+1)%FRAMES.length;
  bAcc++; bT+=dt; BUCKETS[bIdx]=Math.min(1,bAcc/72);
  if(bT>=1.2){bIdx=(bIdx+1)%40;bAcc=0;bT=0;BUCKETS[bIdx]=0;}

  // wash, never clear: trails are most of why this reads as smooth
  ctx.fillStyle='rgba(0,0,0,'+REV[sc.key].wash+')';
  ctx.fillRect(0,0,W,H);

  STATS.faces=0;STATS.pts=0;
  sc.draw(ctx,cam,T,dt,w,S,BATCH);
  BATCH.flush();
  TEL.faces=STATS.faces|0;TEL.pts=STATS.pts|0;
  applyReveal(sc,w);

  // DOM work is rate-limited on purpose: per-frame writes are what wrecked
  // the frame budget on the last build
  if(T-paintT>0.25){paintT=T;paintFeeds();if(u.rail2.classList.contains('in'))paintRail();}
  if(T-chipT>1.6){chipT=T;if(u.rail2.classList.contains('in'))paintChips();}
  paintTrace(dt);
  if(T-ambT>2.6){
    ambT=T;
    if(w>REV[sc.key].tick&&sc.logs){
      const L=LOGS[sc.key];
      LOG(sc.key,sc.logs[L.i%sc.logs.length]);L.i++;
    }
  }
  if(!S._online&&w>sc.wakeLen){S._online=1;LOG(sc.key,sc.name+' ONLINE · ALL SYSTEMS NOMINAL',true);}

  // ticker
  if(u.tick.classList.contains('in')){
    u.tickX-=dt*46;
    const span=u.tickIn.scrollWidth/3;
    if(span&&u.tickX<-span) u.tickX+=span;
    u.tickIn.style.transform='translateX('+u.tickX.toFixed(1)+'px)';
  }
  // flash decay
  if(flashAmt>0.002){u.flash.style.opacity=flashAmt.toFixed(3);flashAmt-=dt*3.4;}
  else if(u.flash.style.opacity!=='0'){u.flash.style.opacity='0';flashAmt=0;}

  fpsAcc+=dt;fpsN++;
  if(T-fpsT>0.5){
    fpsT=T;
    TEL.fps=Math.round(fpsN/fpsAcc); TEL.frame=fpsAcc/fpsN*1000;
    brandEl.textContent='ASGARD · '+TEL.fps+' FPS · '+TEL.frame.toFixed(1)+' ms';
    fpsAcc=0;fpsN=0;
  }
}

/* ---- boot -------------------------------------------------------------- */
(function boot(){
  const q=new URLSearchParams(location.search).get('p');
  const path=location.pathname.toLowerCase();
  const hash=location.hash.replace('#','').toLowerCase();
  let key=(q||hash||'').toLowerCase();
  if(!SCENES.some(s2=>s2.key===key)){
    key=SCENES.map(s2=>s2.key).find(k=>path.indexOf(k)>=0)||'thor';
  }
  active=SCENES.find(s2=>s2.key===key);
  resize();
  go(key,true);
  requestAnimationFrame(frame);
})();
window.AsgardWake=k=>go(k||active.key,true);
</script></body></html>
