<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASGARD · Command center</title><link rel="icon" href="/brand/asgard-crown.ico"><style>body{margin:0;background:#080c12;color:#e9eee9;font:18px system-ui}main{max-width:1400px;padding:5vw;margin:auto}header{display:flex;justify-content:space-between;align-items:center}a{color:#e6c37c}h1{font-weight:400;font-size:48px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}article{padding:28px;border:1px solid #e6c37c44;border-radius:14px}strong{display:block;font-size:36px;margin-top:12px}small,p{color:#b7c0c8}#health{padding:20px 0}button{padding:12px;background:#e6c37c;border:0;border-radius:8px;font:inherit}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:4px}</style><main><header><a href="/">◈ ASGARD</a><time id="clock"></time></header><h1>Your command center.</h1><p>Second-monitor view · paper account and this PC’s available sensors.</p><div id="metrics" class="grid"></div><p id="health" role="status"></p><div id="pc" class="grid"></div><p id="local">Local sensors require this browser’s existing PC-light pairing.</p><p><a href="/trading-lab.html">Research, date filters & decision journal ↗</a></p><button id="full">Full screen</button></main><script type="module">
const money=n=>Number.isFinite(n)?n.toLocaleString('en-US',{style:'currency',currency:'USD'}):'Unavailable';const tile=(label,v)=>{const a=document.createElement('article'),s=document.createElement('small'),b=document.createElement('strong');s.textContent=label;b.textContent=v;a.append(s,b);return a;};
async function refresh(){document.querySelector('#clock').textContent=new Date().toLocaleString();try{const r=await fetch('/paper-trading/status');if(!r.ok)throw Error('Status unavailable');const s=await r.json(),v=s.valuation;document.querySelector('#metrics').replaceChildren(tile('Marked PAPER equity',money(v?.equity)),tile('Available cash',money(s.currentCash)),tile('Realized P/L',money(s.allTime.pnl)),tile('Open P/L',money(v?.unrealizedPnl)));document.querySelector('#health').textContent=(s.scheduler?.alert||'Scheduler healthy')+' · cached marks, before exit costs.';}catch(e){document.querySelector('#health').textContent=e.message;}try{const token=localStorage.getItem('asgard:pc-lights-key');if(!token)return;const r=await fetch('http://127.0.0.1:18771/telemetry',{headers:{'X-ASGARD-Key':token},signal:AbortSignal.timeout(4000)});if(!r.ok)return;const p=await r.json();document.querySelector('#pc').replaceChildren(tile('GPU temperature',p.gpu?.temperature==null?'Unavailable':p.gpu.temperature+' °C'),tile('GPU utilization',p.gpu?.utilization==null?'Unavailable':p.gpu.utilization+'%'),tile('Available memory',p.freeMemoryGB+' GB'));document.querySelector('#local').textContent='Local sensor readout. Fortnite FPS and CPU temperature are not measured here.';}catch{document.querySelector('#local').textContent='Local sensors unavailable. Open on the paired PC.';}}
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen().catch(()=>{});refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></html>
