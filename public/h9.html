<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HELA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;900&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;height:100%;overflow:hidden;
  font-family:'JetBrains Mono',monospace;color:#3dff9a;
  -webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
.pan{position:absolute;padding:8px 10px;font-size:9px;line-height:1.55;letter-spacing:.05em;
  border:1px solid;background:rgba(0,6,3,.5);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  opacity:0;transform:translateY(6px);
  transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.pan.in{opacity:1;transform:none}
.pan h4{font:700 8px/1 'JetBrains Mono',monospace;letter-spacing:.24em;margin-bottom:6px;opacity:.7}
.row{display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
.row span:first-child{opacity:.55}
.val{font-variant-numeric:tabular-nums}
.bar{height:3px;background:rgba(61,255,154,.13);margin:4px 0 6px;overflow:hidden;border-radius:2px}
/* the bar is driven by transform, not width -- width animates on the layout
   thread and stutters; transform is composited and does not. */
.bar i{display:block;height:100%;width:100%;transform-origin:left center;
  transform:scaleX(0);will-change:transform;
  transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
#titleBed{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:min(78vw,760px);height:clamp(110px,17vw,190px);pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(1,6,4,.92) 0%,rgba(1,6,4,.72) 42%,rgba(1,6,4,0) 76%);
  opacity:0;transition:opacity 1.6s ease}
#titleBed.in{opacity:1}
#title{position:absolute;left:50%;top:5%;transform:translateX(-50%);
  font-family:Cinzel,serif;font-weight:900;letter-spacing:.34em;color:#fff;
  font-size:clamp(20px,4.2vw,44px);text-shadow:0 0 46px rgba(61,255,154,.85);
  opacity:0;transition:opacity 1.6s ease}
#title.in{opacity:1}
#sub{position:absolute;left:50%;top:calc(5% + clamp(30px,5.6vw,60px));transform:translateX(-50%);
  font-size:9px;letter-spacing:.56em;color:#3dff9a;opacity:0;transition:opacity 1.6s ease .3s}
#sub.in{opacity:.85}
.tick{position:absolute;bottom:0;left:0;right:0;height:20px;overflow:hidden;
  opacity:0;transition:opacity 1.4s ease;
  border-top:1px solid rgba(61,255,154,.28);background:rgba(0,6,3,.7);
  font-size:9px;letter-spacing:.12em;color:#3dff9a}
.tick div{position:absolute;white-space:nowrap;line-height:20px;will-change:transform}
#fps{position:absolute;right:12px;top:calc(100% - 44px);font-size:8px;color:#2f6b4d;letter-spacing:.1em;
  opacity:0;transition:opacity 1.4s ease}
.tick.in,#fps.in{opacity:1}

/* ---- intro: the rising, the name, the gate ---------------------------- */
#veil{position:fixed;inset:0;z-index:40;background:#000;
  transition:opacity 1.5s cubic-bezier(.4,0,.2,1)}
#veil.gone{opacity:0;pointer-events:none}
#card{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:60;
  text-align:center;pointer-events:none;
  transition:opacity 1.2s ease, transform 1.6s cubic-bezier(.22,1,.36,1)}
#card.lift{opacity:0;transform:translate(-50%,-64%)}
#cardName{font-family:Cinzel,serif;font-weight:900;color:#f4fff9;
  font-size:clamp(38px,9vw,104px);letter-spacing:.30em;text-indent:.30em;
  text-shadow:0 0 60px rgba(61,255,154,.75),0 0 130px rgba(61,255,154,.35)}
#cardName span{opacity:0;display:inline-block;transform:translateY(10px) scale(1.5);
  filter:blur(9px);transition:opacity .5s ease, transform .7s cubic-bezier(.22,1,.36,1), filter .7s ease}
#cardName span.on{opacity:1;transform:none;filter:none}
#rule{height:1px;margin:20px auto 0;width:0;background:linear-gradient(90deg,
  transparent,rgba(61,255,154,.95),transparent);transition:width 1.5s cubic-bezier(.22,1,.36,1)}
#rule.on{width:min(72vw,700px)}
#cardSub{margin-top:16px;font:300 11px/1 'JetBrains Mono',monospace;letter-spacing:.62em;
  text-indent:.62em;color:#3dff9a;opacity:0;transition:opacity 1.3s ease}
#cardSub.on{opacity:.92}
#gate{position:fixed;left:50%;top:63%;transform:translateX(-50%);z-index:61;
  text-align:center;opacity:0;pointer-events:none;
  transition:opacity 1.1s ease, transform .9s cubic-bezier(.22,1,.36,1)}
#gate.on{opacity:1;pointer-events:auto}
#gate.gone{opacity:0;transform:translateX(-50%) translateY(-18px);pointer-events:none}
#gateLabel{font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.44em;
  text-indent:.44em;color:#3dff9a;opacity:.75;margin-bottom:16px}
#pw{background:transparent;border:none;border-bottom:1px solid rgba(61,255,154,.55);
  color:#eafff4;font:400 17px/1 'JetBrains Mono',monospace;letter-spacing:.62em;
  text-align:center;text-indent:.62em;padding:9px 4px;width:min(74vw,300px);outline:none;
  transition:border-color .35s ease, box-shadow .35s ease}
#pw:focus{border-bottom-color:#3dff9a;box-shadow:0 12px 34px -20px rgba(61,255,154,.9)}
#pw::placeholder{color:rgba(61,255,154,.22);letter-spacing:.5em}
#gateMsg{margin-top:14px;font:400 9px/1 'JetBrains Mono',monospace;letter-spacing:.3em;
  color:#ff6b6b;opacity:0;transition:opacity .3s ease;height:10px}
#gateMsg.on{opacity:.85}
#gate.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-50%) translateX(-3px)}
  20%,80%{transform:translateX(-50%) translateX(5px)}
  30%,50%,70%{transform:translateX(-50%) translateX(-8px)}
  40%,60%{transform:translateX(-50%) translateX(8px)}}
</style></head><body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="ov" id="ov">
    <div id="titleBed"></div><div id="title">HELA</div><div id="sub">DAUGHTER OF ODIN</div>
  </div>
</div>
<div id="veil"></div>
<div id="card">
  <div id="cardName"></div>
  <div id="rule"></div>
  <div id="cardSub">DAUGHTER OF ODIN</div>
</div>
<div id="gate">
  <div id="gateLabel">SPEAK THE WORD</div>
  <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="••••••">
  <div id="gateMsg">NOT THAT ONE</div>
</div>
<script>
'use strict';
const G='#3dff9a', W='#ffffff', WG='#e8fff4';
const ov=document.getElementById('ov'), cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});

/* ---------------------------------------------------------------------------
   SMOOTHNESS, and what actually costs it
   1. The gallery called getBoundingClientRect + set canvas.width EVERY frame.
      Setting width clears the buffer and forces layout -- that alone was the
      stutter. Size is now recomputed only on an actual resize.
   2. Motion is per-SECOND and multiplied by real delta time, so a dropped
      frame moves things further rather than hitching.
   3. The frame is not cleared. A translucent wash is laid over it, so every
      moving thing leaves a short trail. That is what reads as "smooth" more
      than frame rate does.
   4. Readouts ease toward targets instead of snapping to new random values.
   5. Bars animate transform, not width -- width animates on the layout thread.
--------------------------------------------------------------------------- */
let W_=0,H_=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();
  W_=r.width;H_=r.height;
  cv.width=Math.round(W_*DPR);cv.height=Math.round(H_*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#020806';ctx.fillRect(0,0,W_,H_);
  build();
}
addEventListener('resize',()=>{clearTimeout(resize._t);resize._t=setTimeout(resize,120)});

/* --------------------------- panels ---------------------------------- */
function panel(css,color,title,rows){
  const p=document.createElement('div');
  p.className='pan';p.style.cssText=css+';border-color:'+color+'55;color:'+color;
  p.innerHTML='<h4>'+title+'</h4>';
  const body=document.createElement('div');p.appendChild(body);ov.appendChild(p);
  const cells={},bars={};
  body.innerHTML=rows.map(r=>r.bar
    ? '<div class="bar"><i data-b="'+r.k+'" style="background:'+color+'"></i></div>'
    : '<div class="row"><span>'+r.label+'</span><span class="val" data-k="'+r.k+'">–</span></div>').join('');
  body.querySelectorAll('[data-k]').forEach(e=>cells[e.dataset.k]=e);
  body.querySelectorAll('[data-b]').forEach(e=>bars[e.dataset.b]=e);
  p.cells=cells;p.bars=bars;return p;
}
// every readout eases; nothing in this HUD ever jumps
const EASED={};
function ease(key,target,rate){
  if(EASED[key]===undefined)EASED[key]=target;
  EASED[key]+=(target-EASED[key])*(rate===undefined?.045:rate);
  return EASED[key];
}
const P={
  a:panel('left:16px;top:16px;width:198px',G,'CONTAINMENT',[
    {k:'integrity',label:'integrity'},{k:'ib',bar:1},{k:'pressure',label:'pressure'},
    {k:'breach',label:'breach'},{k:'seals',label:'seals'}]),
  b:panel('left:16px;top:158px;width:198px',W,'THROUGHPUT',[
    {k:'flux',label:'flux'},{k:'fb',bar:1},{k:'harmonic',label:'harmonic'},
    {k:'drift',label:'drift'},{k:'loss',label:'loss'}]),
  c:panel('left:16px;top:300px;width:198px',WG,'MEMORY',[
    {k:'frag',label:'fragments'},{k:'subj',label:'subjects'},{k:'brief',label:'briefs'},
    {k:'mb',bar:1},{k:'old',label:'oldest'}]),
  d:panel('left:16px;bottom:46px;width:198px',G,'VOWS',[
    {k:'v1',label:'#omoggle'},{k:'v2',label:'no witness'},{k:'v3',label:'obey Rayan'},
    {k:'v4',label:'forget'}]),
  e:panel('right:16px;top:16px;width:206px',W,'COGNITION',[
    {k:'load',label:'load'},{k:'lb',bar:1},{k:'branch',label:'branches'},
    {k:'cert',label:'certainty'},{k:'lat',label:'latency'}]),
  f:panel('right:16px;top:158px;width:206px',G,'THE FORGE',[
    {k:'forged',label:'forged'},{k:'ceil',label:'ceiling'},{k:'gb',bar:1},
    {k:'next',label:'next cycle'},{k:'last',label:'last'}]),
  g:panel('right:16px;top:300px;width:206px',WG,'LINKED',[
    {k:'kv',label:'KV'},{k:'vec',label:'VECTORIZE'},{k:'r2',label:'R2'},
    {k:'ai',label:'WORKERS AI'},{k:'br',label:'browser'}]),
  h:panel('right:16px;bottom:46px;width:206px',W,'OUTPUT',[
    {k:'tok',label:'max tokens'},{k:'depth',label:'tool depth'},{k:'hist',label:'history'},
    {k:'tools',label:'tools live'},{k:'tb',bar:1}])
};
function setv(p,k,v){const e=p.cells[k];if(e&&e.textContent!==v)e.textContent=v}
function setb(p,k,pct){const e=p.bars[k];if(e)e.style.transform='scaleX('+Math.max(0,Math.min(1,pct/100))+')'}

const tick=document.createElement('div');tick.className='tick';
const tin=document.createElement('div');
tin.textContent=['CORE STABLE','VIGIL 3H','FORGE ARMED','LEDGER SEALED','#OMOGGLE ON EVERY POST',
  'NO WITNESS','SHE IS LISTENING','8000 TOKEN CEILING','24 TOOL DEPTH','THE COLUMN DOES NOT STOP']
  .join('   ◆   ')+'   ◆   ';
tin.textContent+=tin.textContent;
tick.appendChild(tin);document.getElementById('stage').appendChild(tick);
const fpsEl=document.createElement('div');fpsEl.id='fps';document.getElementById('stage').appendChild(fpsEl);

/* --------------------------- the machine ------------------------------ */
let motes=[],collars=[],field=[],hex=null,fieldStrip=null,stripW=0,stripAt=-9;
/* -------------------------------------------------------------------------
   PHASES
   rise   : green comes up off the floor, nothing else exists
   card   : HELA is struck out letter by letter, DAUGHTER OF ODIN beneath
   gate   : the word is asked for. Wrong answers do not advance.
   open   : the column builds and the HUD comes in

   The password is checked in the browser, so treat it as a ritual and a
   deterrent, not as security -- anyone who opens the page source can read it.
   What actually keeps HELA concealed is server side: she is filtered out of
   /status, out of Telegram switching and out of the memory map, and her tools
   are stripped from the other three personas' schemas.
------------------------------------------------------------------------- */
const PW='death';
let phase='rise', phaseAt=0, columnMix=0, risers=[];
function buildRisers(){
  const n=Math.round(Math.min(2200,(W_*H_)/620));
  risers=new Array(n);
  for(let i=0;i<n;i++)risers[i]={
    x:Math.random(), y:1+Math.random()*0.85,
    v:0.045+Math.random()*0.30,
    s:0.5+Math.random()*2.3,
    hot:Math.random()<0.12,
    ph:Math.random()*6.283,
    sway:0.10+Math.random()*0.55
  };
}
let GRAD=[],GRAD2={};
const BUCKETS=[],BCOUNT=new Int32Array(12);
for(let i=0;i<12;i++)BUCKETS.push(new Float32Array(3*2200));
function build(){
  const n=Math.round(Math.min(1600,(W_*H_)/1050));
  motes=new Array(n);
  for(let i=0;i<n;i++)motes[i]={
    x:Math.random()*2-1, y:Math.random(),
    v:0.06+Math.random()*0.30,           // screens per second
    s:0.5+Math.random()*1.9,
    hot:Math.random()<0.18,
    ph:Math.random()*6.283,
    life:Math.random()
  };
  collars=[];
  for(let i=0;i<12;i++)collars.push({y:i/12*1.24-0.12, sp:0.085+(i%3)*0.006, tw:Math.random()*6.283});
  field=[];
  const cols=Math.ceil(W_/15), rows=Math.ceil(H_/19);
  for(let r=0;r<rows;r++)field.push({drift:Math.random()*30, sp:6+(r%5)*3.5, row:r, cols:cols});
  GRAD=[];GRAD2={};        // geometry changed, so the cached gradients are stale
  buildRisers();
  buildStrip();
  // hex floor is static — render it once to an offscreen buffer instead of
  // redrawing ~1,800 paths every single frame
  hex=document.createElement('canvas');
  hex.width=Math.round(W_*DPR);hex.height=Math.round(H_*DPR);
  const hx=hex.getContext('2d');hx.setTransform(DPR,0,0,DPR,0,0);
  hx.strokeStyle='rgba(61,255,154,.05)';hx.lineWidth=1;
  const s=26;
  for(let yy=0;yy<H_+s;yy+=s*.87){
    for(let xx=(Math.floor(yy/(s*.87))%2)*s/2;xx<W_+s;xx+=s){
      hx.beginPath();
      for(let k=0;k<6;k++){const a=k*1.047;
        const px=xx+Math.cos(a)*s*.5,py=yy+Math.sin(a)*s*.5;
        k?hx.lineTo(px,py):hx.moveTo(px,py)}
      hx.closePath();hx.stroke()}}
}
const HEXC='0123456789ABCDEF';
// One offscreen canvas holding every glyph of the field, 30px wider than the
// screen so a row can scroll a full cell without exposing an edge.
const STRIPS=[], STRIP_N=4;
function buildStrip(){
  const rows=Math.ceil(H_/19);
  stripW=W_+30;
  STRIPS.length=0;
  const cols=Math.ceil(stripW/15);
  for(let v=0;v<STRIP_N;v++){
    const cv2=document.createElement('canvas');
    cv2.width=Math.round(stripW*DPR);cv2.height=Math.round(rows*19*DPR);
    const fx=cv2.getContext('2d');
    fx.setTransform(DPR,0,0,DPR,0,0);
    fx.font='9px "JetBrains Mono",monospace';fx.fillStyle=G;
    for(let r=0;r<rows;r++)
      for(let i=0;i<cols;i++)
        fx.fillText(HEXC[(r*73+i*31+v*(1+(r%3))*7)%16], i*15, r*19+14);
    STRIPS.push(cv2);
  }
  fieldStrip=STRIPS[0];
}
const STYLE=[];
for(let i=0;i<12;i++){const lvl=(i%6+1)/6;
  STYLE.push(i>=6?'rgba(255,255,255,'+(.42*lvl).toFixed(3)+')'
                 :'rgba(61,255,154,'+(.22*lvl).toFixed(3)+')')}
const smooth=t=>t*t*(3-2*t);          // smoothstep, for anything that fades

let tPrev=0, tSec=0, fpsAcc=0, fpsN=0, tickX=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!W_)return;
  let dt=(now-tPrev)/1000;tPrev=now;
  if(dt>0.1)dt=0.1;                    // a tab that was hidden must not teleport
  if(dt<=0)return;
  tSec+=dt;
  const x=ctx, w=W_, h=H_, cx=w/2, T=tSec;

  // trail wash instead of a clear — this is most of the "smooth"
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(2,8,6,'+(phase==='open'?0.55:0.34)+')';
  x.fillRect(0,0,w,h);

  // ---- THE RISING -------------------------------------------------------
  // Only this runs until the word is spoken. It keeps running underneath
  // afterwards, fading out as the column comes up, so there is no cut.
  const riseAge=tSec-0;
  const riseGain=phase==='open'?Math.max(0,1-columnMix*1.5):Math.min(1,riseAge/1.6);
  if(riseGain>0.01){
    x.globalCompositeOperation='lighter';
    for(let i=0;i<risers.length;i++){
      const r=risers[i];
      r.y-=r.v*dt;
      if(r.y<-0.05){r.y=1.05+Math.random()*0.4;r.x=Math.random()}
      const edge=smooth(Math.min(1,Math.min(1.05-r.y,r.y+0.05)/0.22));
      const a=(r.hot?0.55:0.26)*edge*riseGain;
      if(a<0.012)continue;
      const px=(r.x+Math.sin(tSec*0.7+r.ph)*0.012*r.sway)*w;
      x.fillStyle=(r.hot?'rgba(235,255,245,':'rgba(61,255,154,')+a.toFixed(3)+')';
      x.fillRect(px,r.y*h,r.s,r.s*3.6);
    }
    // a glow banked along the floor, where it is all coming from
    const fg=x.createLinearGradient(0,h,0,h*0.55);
    fg.addColorStop(0,'rgba(61,255,154,'+(0.20*riseGain).toFixed(3)+')');
    fg.addColorStop(1,'rgba(61,255,154,0)');
    x.fillStyle=fg;x.fillRect(0,h*0.55,w,h*0.45);
    x.globalCompositeOperation='source-over';
  }

  // everything below is the column, and it only exists once she is open
  if(phase==='open'){columnMix=Math.min(1,columnMix+dt*0.55)}
  if(columnMix<=0.001){
    tickX-=34*dt;
    if(-tickX>tin.scrollWidth/2)tickX+=tin.scrollWidth/2;
    fpsAcc+=dt;fpsN++;
    if(fpsAcc>=0.5){fpsEl.textContent=(fpsN/fpsAcc).toFixed(0)+' FPS';fpsAcc=0;fpsN=0}
    return;
  }
  x.globalAlpha=smooth(columnMix);

  if(hex)x.drawImage(hex,0,0,w,h);

  // Drifting data field. This was ~3,500 fillText calls EVERY frame -- with a
  // one-rect control page running dead clean at 0 dropped frames, this was the
  // whole of Column's 14% frame drop. The glyphs are now rendered once into an
  // offscreen strip and each row is blitted with its own scroll offset: 40-odd
  // drawImage calls instead of thousands of text rasterisations. The strip is
  // re-rendered on a slow timer so the characters still churn.
  if(STRIPS.length){
    x.save();x.globalAlpha=.085;
    for(const f of field){
      f.drift=(f.drift+f.sp*dt)%30;
      const y=f.row*19;
      x.drawImage(STRIPS[((tSec*2.2)|0)%STRIP_N], 0,y, stripW,19, -f.drift,y, stripW,19);
    }
    x.restore();
  }

  const cw=Math.min(w*.095,108);
  x.globalCompositeOperation='lighter';

  // the shaft
  const breathe=.5+.5*Math.sin(T*1.1);
  const bq=(breathe*24)|0, bf=bq/24;
  let lg=GRAD[bq];
  if(!lg){
    lg=x.createLinearGradient(cx-cw*1.9,0,cx+cw*1.9,0);
    lg.addColorStop(0,'rgba(61,255,154,0)');
    lg.addColorStop(.26,'rgba(61,255,154,'+(.030+bf*.016)+')');
    lg.addColorStop(.42,'rgba(120,255,200,'+(.105+bf*.042)+')');
    lg.addColorStop(.5,'rgba(255,255,255,'+(.195+bf*.070)+')');
    lg.addColorStop(.58,'rgba(120,255,200,'+(.105+bf*.042)+')');
    lg.addColorStop(.74,'rgba(61,255,154,'+(.030+bf*.016)+')');
    lg.addColorStop(1,'rgba(61,255,154,0)');
    GRAD[bq]=lg;
  }
  x.fillStyle=lg;x.fillRect(cx-cw*1.9,0,cw*3.8,h);

  // Material falling through it. Building an 'rgba(...)' string per particle
  // per frame allocated ~1,900 strings every 16ms and showed up as a doubled
  // p95. Instead each particle is bucketed into one of 6 alpha levels per
  // colour, so the frame sets fillStyle 12 times total and the inner loop
  // does nothing but arithmetic and fillRect.
  const BK=6;
  BCOUNT.fill(0);
  for(let i=0;i<motes.length;i++){
    const m=motes[i];
    m.y-=m.v*dt;
    if(m.y<-0.04){m.y=1.04;m.x=Math.random()*2-1}
    // fade in at the top and out at the bottom so nothing ever pops
    const edge=smooth(Math.min(1,Math.min(m.y,1-m.y)/0.10));
    if(edge<=0.02)continue;
    let lvl=(edge*BK)|0; if(lvl>BK-1)lvl=BK-1;
    const bi=(m.hot?BK:0)+lvl, b=BUCKETS[bi];
    let c=BCOUNT[bi];
    if(c+3<=b.length){
      b[c]=cx+(m.x+Math.sin(T*1.4+m.ph)*.055)*cw*.92;
      b[c+1]=m.y*h; b[c+2]=m.s; BCOUNT[bi]=c+3;
    }
  }
  for(let bi=0;bi<BUCKETS.length;bi++){
    const n2=BCOUNT[bi]; if(!n2)continue;
    const b=BUCKETS[bi];
    x.fillStyle=STYLE[bi];
    for(let k=0;k<n2;k+=3)x.fillRect(b[k],b[k+1],b[k+2],b[k+2]*3.4);
  }

  // containment collars descending
  for(const col of collars){
    col.y-=col.sp*dt;
    if(col.y<-0.12)col.y+=1.24;
    const y=col.y*h;
    const edge=smooth(Math.min(1,Math.min(col.y+0.12,1.12-col.y)/0.14));
    if(edge<=0.01)continue;
    const sq=19+Math.sin(T*.9+col.tw)*4;
    x.strokeStyle='rgba(255,255,255,'+(.26*edge)+')';x.lineWidth=1.8;
    x.beginPath();x.ellipse(cx,y,cw*1.45,sq,0,0,6.283);x.stroke();
    x.strokeStyle='rgba(61,255,154,'+(.34*edge)+')';x.lineWidth=1.1;
    x.beginPath();x.ellipse(cx,y,cw*1.78,sq*1.22,0,0,6.283);x.stroke();
    x.fillStyle='rgba(61,255,154,'+(.26*edge).toFixed(3)+')';
    for(let j=0;j<24;j++){
      const a=j*.2618+T*.32;
      x.fillRect(cx+Math.cos(a)*cw*1.78,y+Math.sin(a)*sq*1.22,2,2);
    }
  }

  // apertures at floor and ceiling
  for(const yy of [0,h]){
    x.strokeStyle='rgba(255,255,255,.30)';x.lineWidth=2.4;
    x.beginPath();x.ellipse(cx,yy,cw*2.05,26,0,0,6.283);x.stroke();
    x.strokeStyle='rgba(61,255,154,.17)';x.lineWidth=1.3;
    for(let k=1;k<5;k++){x.beginPath();x.ellipse(cx,yy,cw*(2.05+k*.32),26+k*9,0,0,6.283);x.stroke()}
    const gk=(yy?'b':'t')+bq;
    let gg=GRAD2[gk];
    if(!gg){
      gg=x.createRadialGradient(cx,yy,2,cx,yy,cw*2.4);
      gg.addColorStop(0,'rgba(255,255,255,'+(.055+bf*.025)+')');gg.addColorStop(1,'rgba(0,0,0,0)');
      GRAD2[gk]=gg;
    }
    x.fillStyle=gg;x.beginPath();x.arc(cx,yy,cw*2.4,0,6.283);x.fill();
  }
  x.globalCompositeOperation='source-over';

  // one waveform, high
  x.strokeStyle='rgba(61,255,154,.30)';x.lineWidth=1.3;x.beginPath();
  for(let i=0;i<w;i+=2){
    const yy=h*.135+Math.sin(i*.045+T*3.1)*7*Math.sin(i*.006+T)+Math.sin(i*.2+T*7)*2;
    i?x.lineTo(i,yy):x.moveTo(i,yy)}
  x.stroke();

  // ticker, moved on the compositor
  tickX-=34*dt;
  if(-tickX>tin.scrollWidth/2)tickX+=tin.scrollWidth/2;
  tin.style.transform='translate3d('+tickX+'px,0,0)';

  // readouts — eased, never snapping
  if(now-(frame._p||0)>200){
    frame._p=now;
    const integ=ease('integ',96+Math.sin(T*.4)*3);
    setv(P.a,'integrity',integ.toFixed(1)+'%');setb(P.a,'ib',integ);
    setv(P.a,'pressure',ease('pres',41+Math.sin(T*.9)*11).toFixed(1)+'%');
    setv(P.a,'breach','NONE');setv(P.a,'seals','9 / 9');
    const flux=ease('flux',1.4+Math.sin(T*1.3)*.5);
    setv(P.b,'flux',flux.toFixed(2)+' PF');setb(P.b,'fb',flux/2.2*100);
    setv(P.b,'harmonic',ease('harm',Math.sin(T)*40+50).toFixed(0)+' Hz');
    setv(P.b,'drift','0.004');setv(P.b,'loss','0.00');
    setv(P.c,'frag',Math.round(1284+T*2).toLocaleString('en-US'));
    setv(P.c,'subj','41');setv(P.c,'brief','16');setb(P.c,'mb',72);setv(P.c,'old','1,204 d');
    setv(P.d,'v1','EVERY POST');setv(P.d,'v2','HELD');setv(P.d,'v3','ABSOLUTE');setv(P.d,'v4','NEVER');
    const load=ease('load',30+Math.sin(T*1.7)*22);
    setv(P.e,'load',load.toFixed(1)+'%');setb(P.e,'lb',load);
    setv(P.e,'branch',String(Math.round(ease('br',4+Math.sin(T*.6)*3+4))));
    setv(P.e,'cert',ease('cert',88+Math.sin(T*.5)*8).toFixed(1)+'%');
    setv(P.e,'lat',ease('lat',240+Math.sin(T*1.9)*45).toFixed(0)+' ms');
    setv(P.f,'forged','7');setv(P.f,'ceil','40');setb(P.f,'gb',17.5);
    setv(P.f,'next',Math.max(1,Math.round(ease('nx',15+Math.sin(T*.22)*13)))+' min');
    setv(P.f,'last','yt transcripts');
    setv(P.g,'kv','WARM');setv(P.g,'vec','READY');setv(P.g,'r2','asgardclips');
    setv(P.g,'ai','ONLINE');setv(P.g,'br','ATTACHED');
    setv(P.h,'tok','8000');setv(P.h,'depth','24 / 24');setv(P.h,'hist','80');
    setv(P.h,'tools','132');setb(P.h,'tb',82.5);
  }
  x.globalAlpha=1;
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>=0.5){fpsEl.textContent=(fpsN/fpsAcc).toFixed(0)+' FPS';fpsAcc=0;fpsN=0}
}

resize();
requestAnimationFrame(t=>{tPrev=t;requestAnimationFrame(frame)});

/* ------------------------- the sequence ------------------------------- */
const veil=document.getElementById('veil'), card=document.getElementById('card'),
      cardName=document.getElementById('cardName'), rule=document.getElementById('rule'),
      cardSub=document.getElementById('cardSub'), gate=document.getElementById('gate'),
      pw=document.getElementById('pw'), gateMsg=document.getElementById('gateMsg');

// the veil sits over the canvas and lifts as the green comes up, so the first
// thing on screen is black and the rise emerges out of it rather than starting
// mid-flight
setTimeout(()=>veil.classList.add('gone'),120);

// HELA, one letter at a time
'HELA'.split('').forEach(ch=>{
  const sp=document.createElement('span');sp.textContent=ch;cardName.appendChild(sp);
});
const letters=[...cardName.children];
letters.forEach((sp,i)=>setTimeout(()=>sp.classList.add('on'),2600+i*340));
setTimeout(()=>rule.classList.add('on'),2600+letters.length*340+120);
setTimeout(()=>cardSub.classList.add('on'),2600+letters.length*340+420);

// then the word is asked for
setTimeout(()=>{phase='gate';gate.classList.add('on');
  try{pw.focus({preventScroll:true})}catch(e){pw.focus()}},2600+letters.length*340+1900);

function refuse(){
  gate.classList.remove('bad');void gate.offsetWidth;gate.classList.add('bad');
  gateMsg.classList.add('on');
  pw.value='';
  setTimeout(()=>gateMsg.classList.remove('on'),1900);
}
function admit(){
  if(phase==='open')return;
  phase='open';phaseAt=tSec;
  gate.classList.add('gone');gate.classList.remove('on');
  card.classList.add('lift');
  pw.blur();
  setTimeout(()=>{card.style.display='none';gate.style.display='none'},1700);
  // the HUD arrives behind her, staggered
  setTimeout(()=>{document.getElementById('title').classList.add('in');
    document.getElementById('sub').classList.add('in');
    document.getElementById('titleBed').classList.add('in');
    tick.classList.add('in');fpsEl.classList.add('in')},900);
  Object.values(P).forEach((p,i)=>setTimeout(()=>p.classList.add('in'),1100+i*110));
}
pw.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  e.preventDefault();
  if(pw.value.trim().toLowerCase()===PW)admit();else refuse();
});
// typing it is enough — no need to hunt for the enter key
pw.addEventListener('input',()=>{
  if(pw.value.trim().toLowerCase()===PW)setTimeout(admit,220);
});
</script></body></html>
