<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06120c">
<title>LOKI — Trickster's Court</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06120c;
  --bg2: #0a1a12;
  --panel: rgba(13, 33, 23, 0.82);
  --panel-border: rgba(46, 190, 110, 0.25);
  --green: #2ebe6e;
  --green-dim: rgba(46, 190, 110, 0.5);
  --gold: #e8c468;
  --gold-dim: rgba(232, 196, 104, 0.5);
  --blue: #4aa8ff;
  --blue-dim: rgba(74, 168, 255, 0.45);
  --text: #e2f0e6;
  --text-dim: #7fa18b;
  --danger: #ff5d6c;
  --ok: #58d68d;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  background:
    radial-gradient(ellipse at 18% -8%, rgba(46,190,110,0.14) 0%, transparent 45%),
    radial-gradient(ellipse at 85% 108%, rgba(74,168,255,0.1) 0%, transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  font-size: 14.5px;
  user-select: none; -webkit-user-select: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input, textarea { user-select: text; -webkit-user-select: text; }

/* ---------- lock ---------- */
#lockScreen {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  background: radial-gradient(ellipse at 50% 30%, #0d2417 0%, #040b07 70%);
  transition: opacity 0.7s ease, visibility 0.7s;
}
#lockScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#lockScreen .sigil { font-family: 'Grenze Gotisch', serif; font-size: 52px; color: var(--green); letter-spacing: 8px; text-shadow: 0 0 34px var(--blue-dim); transform: rotate(-2deg); }
#lockScreen .subtitle { color: var(--text-dim); letter-spacing: 4px; font-size: 12px; text-transform: uppercase; }
#lockInput {
  background: rgba(46,190,110,0.07); border: 1px solid var(--panel-border); border-radius: 10px;
  color: var(--text); font-family: inherit; font-size: 17px; letter-spacing: 3px;
  padding: 10px 18px; text-align: center; outline: none; width: 230px; transform: rotate(0.8deg);
}
#lockInput:focus { border-color: var(--green); box-shadow: 0 0 18px rgba(46,190,110,0.25); }
#lockInput.shake { animation: shake 0.35s; }
@keyframes shake { 0%,100%{transform:rotate(0.8deg) translateX(0)} 25%{transform:rotate(0.8deg) translateX(-8px)} 75%{transform:rotate(0.8deg) translateX(8px)} }

/* ---------- header — tilted wordmark, off-kilter on purpose ---------- */
#topBar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20; height: 54px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  background: linear-gradient(180deg, rgba(6,18,12,0.92), rgba(6,18,12,0));
  padding-top: env(safe-area-inset-top);
}
#wordmark { font-family: 'Grenze Gotisch', serif; font-size: 25px; letter-spacing: 4px; color: var(--green); display: flex; align-items: baseline; gap: 10px; transform: rotate(-1.2deg); }
#wordmark .court { font-size: 10px; letter-spacing: 3px; color: var(--gold-dim); font-family: 'Space Grotesk'; transform: rotate(1.2deg); }
#statusStrip { display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: 1px; color: var(--text-dim); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #555; margin-right: 5px; vertical-align: 1px; transition: background .4s, box-shadow .4s; }
.dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.dot.warn { background: var(--gold); box-shadow: 0 0 8px var(--gold-dim); }
.dot.off { background: var(--danger); }
#switcher { position: relative; }
#switcherMenu {
  position: absolute; right: 0; top: 110%; background: var(--panel); border: 1px solid var(--panel-border);
  border-radius: 10px; overflow: hidden; display: none; min-width: 150px; backdrop-filter: blur(12px); z-index: 30;
}
#switcherMenu.open { display: block; }
#switcherMenu a { display: block; padding: 10px 16px; color: var(--text); text-decoration: none; font-size: 13px; letter-spacing: 2px; }
#switcherMenu a:hover { background: rgba(46,190,110,0.15); }

/* ---------- asymmetric court layout ---------- */
#appGrid {
  position: fixed; inset: 0; top: 54px; bottom: 58px;
  display: grid; grid-template-columns: 340px 1fr 300px; gap: 12px; padding: 8px 12px 8px 20px;
  max-width: 1520px; margin: 0 auto;
}
#colLeft { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; scrollbar-width: thin; padding: 6px 6px 12px 2px; }
#colRight { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; scrollbar-width: thin; padding: 26px 2px 12px 6px; }
#colLeft::-webkit-scrollbar, #colRight::-webkit-scrollbar { width: 4px; }
#colLeft::-webkit-scrollbar-thumb, #colRight::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }
#centerStage { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; min-width: 0; }
#stageCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* tilted cards — each panel leans its own way, straightens on hover */
.panel {
  background: var(--panel); border: 1px solid var(--panel-border); border-radius: var(--radius);
  backdrop-filter: blur(10px); overflow: hidden; flex-shrink: 0;
  transition: transform 0.35s cubic-bezier(.2,.9,.3,1.2), box-shadow 0.35s;
  box-shadow: 0 6px 24px rgba(0,0,0,0.35);
}
#colLeft .panel:nth-child(odd) { transform: rotate(-0.9deg); }
#colLeft .panel:nth-child(even) { transform: rotate(0.7deg); margin-left: 10px; }
#colRight .panel:nth-child(odd) { transform: rotate(1deg); }
#colRight .panel:nth-child(even) { transform: rotate(-0.7deg); margin-right: 8px; }
.panel:hover { transform: rotate(0deg); box-shadow: 0 10px 32px rgba(46,190,110,0.12); }
.panel > header {
  display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; cursor: pointer;
  font-family: 'Grenze Gotisch', serif; font-size: 17px; letter-spacing: 2px; color: var(--gold);
  border-bottom: 1px solid transparent; transition: border-color .3s;
}
.panel:not(.collapsed) > header { border-bottom-color: rgba(46,190,110,0.14); }
.panel > header .chev { color: var(--text-dim); font-size: 11px; transition: transform 0.25s ease; font-family: 'Space Grotesk'; }
.panel.collapsed > header .chev { transform: rotate(-90deg); }
.panel > .body { padding: 11px 14px; }
.panel.collapsed > .body { display: none; }
.btn {
  border: 1px solid var(--panel-border); background: rgba(46,190,110,0.09); color: var(--text);
  font-family: inherit; font-size: 12.5px; font-weight: 600; letter-spacing: 0.6px; border-radius: 9px;
  padding: 7px 13px; cursor: pointer; transition: all 0.16s ease;
}
.btn:hover { border-color: var(--green); background: rgba(46,190,110,0.2); }
.btn:active { transform: translateY(1px) scale(0.97); }
.btn:disabled { opacity: 0.35; cursor: default; transform: none; }
.btn.gold { border-color: var(--gold-dim); color: var(--gold); background: rgba(232,196,104,0.07); }
.btn.gold:hover { background: rgba(232,196,104,0.16); border-color: var(--gold); }
.btn.blue { border-color: var(--blue-dim); color: var(--blue); background: rgba(74,168,255,0.08); }
.btn.blue:hover { background: rgba(74,168,255,0.16); border-color: var(--blue); }
.btn.small { font-size: 11px; padding: 4px 9px; }
.rowInput {
  background: rgba(4,11,7,0.65); border: 1px solid var(--panel-border); border-radius: 8px;
  color: var(--text); font-family: inherit; font-size: 13px; padding: 6px 10px; outline: none; width: 100%;
}
.rowInput:focus { border-color: var(--green-dim); }
.muted { color: var(--text-dim); font-size: 12.5px; }
.emptyState { color: var(--text-dim); font-size: 12.5px; font-style: italic; padding: 4px 0; }

/* ---------- text box + input ---------- */
#textBox {
  position: relative; z-index: 5; width: min(560px, 92%); height: 64px; margin-bottom: 10px;
  background: linear-gradient(180deg, rgba(13,33,23,0.88), rgba(8,20,14,0.92));
  border: 1px solid var(--panel-border); border-radius: 14px; transform: rotate(-0.4deg);
  box-shadow: 0 4px 30px rgba(0,0,0,0.45), inset 0 0 24px rgba(46,190,110,0.05);
  overflow: hidden; flex-shrink: 0;
}
.tbLayer {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: 8px 18px; text-align: center; font-size: 16px; font-weight: 500; line-height: 1.25;
  opacity: 0; transition: opacity 0.45s ease; overflow-y: auto; scrollbar-width: none;
}
.tbLayer::-webkit-scrollbar { display: none; }
.tbLayer.visible { opacity: 1; }
.tbLayer.user { color: var(--text-dim); font-style: italic; }
.tbLayer.assistant { color: var(--text); }
.tbLayer.small { font-size: 13px; align-items: flex-start; }
.tbLayer .inner { max-height: 100%; width: 100%; }
#inputRow { position: relative; z-index: 5; display: flex; align-items: center; gap: 8px; width: min(560px, 92%); margin-bottom: 6px; flex-shrink: 0; }
#userInput {
  flex: 1; background: rgba(13,33,23,0.75); border: 1px solid var(--panel-border); border-radius: 20px;
  color: var(--text); font-family: inherit; font-size: 14px; padding: 8px 16px; outline: none; min-width: 0;
}
#userInput:focus { border-color: var(--green-dim); }
.iconBtn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--panel-border); flex-shrink: 0;
  background: rgba(13,33,23,0.75); color: var(--text-dim); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.18s ease;
}
.iconBtn:hover { border-color: var(--green); color: var(--text); background: rgba(46,190,110,0.13); }
.iconBtn:active { transform: scale(0.92); }
.iconBtn:disabled { opacity: 0.35; cursor: default; }
.iconBtn.danger { border-color: var(--danger); color: var(--danger); }
#micBtn.listening { border-color: var(--green); color: var(--green); animation: micPulse 1.6s ease-in-out infinite; }
#micBtn.awake { border-color: var(--gold); color: var(--gold); animation: micPulse 1s ease-in-out infinite; }
#micBtn.muted { border-color: var(--danger); color: var(--danger); animation: none; }
#micBtn.paused { border-color: var(--text-dim); color: var(--text-dim); animation: none; }
@keyframes micPulse { 0%,100% { box-shadow: 0 0 4px rgba(46,190,110,0.2); } 50% { box-shadow: 0 0 18px rgba(46,190,110,0.55); } }
#pttBtn.held { border-color: var(--gold); color: var(--bg); background: var(--gold); }
#voiceStatus { position: relative; z-index: 5; font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 8px; height: 15px; text-align: center; }

/* ---------- brief card ---------- */
#briefText { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; max-height: 220px; overflow-y: auto; scrollbar-width: thin; }
#briefMeta { font-size: 11px; color: var(--text-dim); margin-top: 7px; }

/* ---------- calendar ---------- */
#calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
#calTitle { font-family: 'Grenze Gotisch', serif; font-size: 16px; color: var(--text); letter-spacing: 1px; }
#calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 11.5px; }
#calGrid .dow { color: var(--text-dim); font-size: 10px; padding: 3px 0; }
.calDay { padding: 5px 0; border-radius: 6px; position: relative; cursor: pointer; color: var(--text); }
.calDay.dim { color: var(--text-dim); opacity: 0.4; }
.calDay.today { background: rgba(46,190,110,0.2); font-weight: 700; }
.calDay.hasEv::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--gold); }
.calDay.sel { outline: 1px solid var(--blue); }
.evRow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13px; }
.evRow:last-child { border-bottom: none; }
.evRow .evWhen { color: var(--gold); font-size: 11.5px; white-space: nowrap; font-weight: 600; }
.evRow .grow { flex: 1; min-width: 0; }

/* ---------- ledger (todos) ---------- */
.listRow { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13.5px; }
.listRow:last-child { border-bottom: none; }
.listRow .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.listRow.done .grow { text-decoration: line-through; color: var(--text-dim); }
.listRow .age { font-size: 10.5px; color: var(--text-dim); white-space: nowrap; }
.listRow .age.old { color: var(--danger); }
.tinyBtn { border: none; background: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 2px 5px; }
.tinyBtn:hover { color: var(--text); }
.tinyBtn.danger:hover { color: var(--danger); }

/* ---------- questions feed ---------- */
.qRow { padding: 7px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13px; }
.qRow .qWhen { color: var(--text-dim); font-size: 10.5px; display: block; margin-bottom: 2px; }

/* ---------- drawer ---------- */
#drawerBar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 58px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(0deg, rgba(6,18,12,0.95), rgba(6,18,12,0));
  padding-bottom: env(safe-area-inset-bottom);
}
.drawerTab {
  border: 1px solid var(--panel-border); background: rgba(13,33,23,0.85); color: var(--text-dim);
  font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
  border-radius: 18px; padding: 8px 15px; cursor: pointer; transition: all 0.18s;
}
.drawerTab:nth-child(odd) { transform: rotate(-1deg); }
.drawerTab:nth-child(even) { transform: rotate(1deg); }
.drawerTab:hover { color: var(--text); border-color: var(--green-dim); transform: rotate(0); }
.drawerTab.active { color: var(--gold); border-color: var(--gold-dim); background: rgba(232,196,104,0.08); }
#drawerSheet {
  position: fixed; left: 50%; transform: translate(-50%, 115%) rotate(0.3deg); bottom: 64px; z-index: 25;
  width: min(680px, 94vw); max-height: 58vh; overflow-y: auto;
  background: rgba(8,20,14,0.96); border: 1px solid var(--panel-border); border-radius: 16px;
  backdrop-filter: blur(16px); padding: 16px; scrollbar-width: thin;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform 0.35s cubic-bezier(.2,.9,.25,1), opacity 0.3s, visibility 0.35s;
}
#drawerSheet.open { transform: translate(-50%, 0) rotate(0deg); opacity: 1; visibility: visible; pointer-events: auto; }
#drawerSheet h3 { font-family: 'Grenze Gotisch', serif; font-size: 19px; letter-spacing: 2px; color: var(--gold); margin-bottom: 12px; }
.setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13.5px; }
.setRow:last-child { border-bottom: none; }
.setRow label { color: var(--text); }
.setRow .hint { display: block; font-size: 11px; color: var(--text-dim); }
.setRow input[type=range] { width: 130px; accent-color: var(--green); }
.setRow select {
  background: rgba(4,11,7,0.8); color: var(--text); border: 1px solid var(--panel-border);
  border-radius: 6px; padding: 4px 8px; font-family: inherit; font-size: 12.5px; outline: none;
}
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle .slider { position: absolute; inset: 0; background: rgba(46,190,110,0.15); border-radius: 12px; cursor: pointer; transition: background 0.25s; }
.toggle .slider::before { content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--text-dim); top: 3px; left: 3px; transition: all 0.25s; }
.toggle input:checked + .slider { background: rgba(232,196,104,0.35); }
.toggle input:checked + .slider::before { background: var(--gold); transform: translateX(18px); }
.memRow { padding: 7px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13px; }
.memRow .memDate { color: var(--text-dim); font-size: 11px; margin-right: 8px; }
.memRow .memShared { color: var(--blue); font-size: 10.5px; letter-spacing: 1px; margin-left: 6px; }
.memRow .memActions { float: right; }
.histRow { padding: 6px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 13px; }
.histRow .who { font-weight: 700; letter-spacing: 1px; font-size: 11px; margin-right: 7px; }
.histRow .who.u { color: var(--blue); }
.histRow .who.a { color: var(--gold); }
.actRow { padding: 6px 0; border-bottom: 1px dashed rgba(46,190,110,0.12); font-size: 12.5px; display: flex; gap: 9px; }
.actRow .when { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
.statGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.statCard { background: rgba(46,190,110,0.07); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; }
.statCard b { display: block; font-size: 11px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px; }

/* wake blast overlay */
#wakeFlash {
  position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 42%, rgba(160,210,255,0.85), rgba(74,168,255,0.35) 40%, transparent 70%);
}
#wakeFlash.fire { animation: flashAnim 0.8s ease-out forwards; }
@keyframes flashAnim { 0% { opacity: 0; } 14% { opacity: 1; } 100% { opacity: 0; } }

@media (max-width: 1080px) { #appGrid { grid-template-columns: 300px 1fr 270px; } }
@media (max-width: 860px) {
  html, body { overflow: auto; }
  #appGrid { position: static; display: flex; flex-direction: column; gap: 12px; margin-top: 54px; margin-bottom: 66px; padding: 0 12px; height: auto; }
  #centerStage { order: 0; height: 58vh; min-height: 400px; flex-shrink: 0; }
  #colLeft { order: 1; } #colRight { order: 2; padding-top: 0; }
  #colLeft, #colRight { overflow: visible; }
  #statusStrip span.lbl { display: none; }
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="sigil">LOKI</div>
  <div class="subtitle">The Trickster's Court</div>
  <input type="password" id="lockInput" autocomplete="off" placeholder="passphrase">
</div>

<div id="wakeFlash"></div>

<header id="topBar">
  <div id="wordmark">🃏 LOKI <span class="court">THE TRICKSTER'S COURT</span></div>
  <div id="statusStrip">
    <span><i class="dot" id="dotBackend"></i><span class="lbl">CORE</span></span>
    <span><i class="dot" id="dotVoice"></i><span class="lbl">VOICE</span></span>
    <span id="switcher">
      <button class="btn small" id="switcherBtn">SWITCH ▾</button>
      <div id="switcherMenu">
        <a href="/thor/">⚡ THOR</a>
        <a href="/odin/">👁 ODIN</a>
        <a href="/hub/">🏰 ASGARD HUB</a>
      </div>
    </span>
  </div>
</header>

<main id="appGrid">
  <div id="colLeft">
    <section class="panel" data-panel="brief">
      <header><span>📜 Today's Brief</span><span class="chev">▾</span></header>
      <div class="body">
        <div id="briefText" class="emptyState">No brief yet.</div>
        <div id="briefMeta"></div>
        <div style="display:flex; gap:8px; margin-top:10px; align-items:center;">
          <button class="btn gold" id="briefNow">Brief me now</button>
          <span class="muted" style="flex:1;">Daily at</span>
          <select id="briefHour" class="rowInput" style="width:86px;">
            <option value="">off</option>
          </select>
        </div>
        <div class="muted" style="margin-top:6px; font-size:11px;">Scheduled briefs also land on Telegram.</div>
      </div>
    </section>

    <section class="panel" data-panel="ledger">
      <header><span>📓 The Ledger</span><span class="chev">▾</span></header>
      <div class="body">
        <div id="todoList"><div class="emptyState">Loading…</div></div>
        <div style="display:flex; gap:7px; margin-top:9px;">
          <input class="rowInput" id="todoInput" placeholder="What are you putting off now?">
          <button class="btn small" id="todoAdd">Add</button>
        </div>
        <div id="doneWrap" style="margin-top:8px;"></div>
      </div>
    </section>
  </div>

  <div id="centerStage">
    <canvas id="stageCanvas"></canvas>
    <div id="textBox">
      <div class="tbLayer user" id="tbUser"><div class="inner"></div></div>
      <div class="tbLayer assistant" id="tbAssistant"><div class="inner"></div></div>
    </div>
    <div id="inputRow">
      <button class="iconBtn" id="micBtn" title="Start voice">🎙</button>
      <input id="userInput" placeholder="Type to Loki…" autocomplete="off">
      <button class="iconBtn" id="sendBtn" title="Send">➤</button>
      <button class="iconBtn" id="pttBtn" title="Hold to talk">🗣</button>
      <button class="iconBtn" id="muteBtn" title="Mute">🔇</button>
      <button class="iconBtn" id="sleepBtn" title="Sleep">🌙</button>
    </div>

<div id="drawerSheet"></div>

<script>
/* ═════════════════════════════════════════════════════════════════
   PAGE CONFIG
   ═════════════════════════════════════════════════════════════════ */
const BACKEND_URL = "https://asgrard-backend.rayanfahil2.workers.dev";
const UNLOCK_PASSWORD = "bifrost";

window.ASSISTANT = {
  id: 'loki',
  name: 'LOKI',
  // "low key"/"lowkey" wake ONLY with a greeting in front — Rayan says those in
  // normal conversation, so they are never in bareNameSafe.
  nameVariants: ['loki', 'lokie', 'lokey', 'low key', 'lowkey', 'loci'],
  bareNameSafe: ['loki'],
  sleepLine: "Fine — the court adjourns. Your dodged tasks are still counted.",
  wakeGreeting: "[WAKE_TRIGGER] Rayan just said your wake word. Greet him briefly, then ask something proactive."
};

/* ═════════════════════════════════════════════════════════════════
   SHELL ADAPTER
   ═════════════════════════════════════════════════════════════════ */
const tbUser = document.getElementById('tbUser'), tbAssistant = document.getElementById('tbAssistant');
function tbShow(layerEl, otherEl, text) {
  layerEl.querySelector('.inner').textContent = text;
  layerEl.classList.toggle('small', text.length > 130);
  otherEl.classList.remove('visible');
  layerEl.classList.add('visible');
}
window.SHELL = {
  setState(s) { window.Scene && window.Scene.setState(s); },
  wakeCinematic(done) {
    document.getElementById('wakeFlash').classList.remove('fire');
    if (window.Scene) window.Scene.wakeCinematic(done); else setTimeout(done, 400);
    setTimeout(() => document.getElementById('wakeFlash').classList.add('fire'), 480);
  },
  showUserText(t) { tbShow(tbUser, tbAssistant, t); },
  showAssistantText(t) { tbShow(tbAssistant, tbUser, t); },
  setVoiceStatus(t) { document.getElementById('voiceStatus').textContent = t; },
  setMicState(cls) {
    const b = document.getElementById('micBtn');
    b.classList.remove('listening', 'awake', 'muted', 'paused');
    if (cls) b.classList.add(cls);
  },
  onLocalCommand(text) { return handleLocalCommand(text); }
};

/* ═══ ENGINE-BEGIN ═══ ASGARD VOICE ENGINE v2 ═══════════════════════
   IDENTICAL across THOR / LOKI / ODIN pages — one engine, three shells.
   Fix a bug here, copy the whole block to the other two files.
   Wake words, mic handling, double-clap, barge-in, turn-taking,
   ElevenLabs playback, backend chat. Reads window.ASSISTANT + window.SHELL.
   ══════════════════════════════════════════════════════════════════ */
(function () {
  const A = window.ASSISTANT, S = window.SHELL;
  const LS = k => `va:${A.id}:${k}`;
  const store = {
    get(k, d) { const v = localStorage.getItem(LS(k)); return v === null ? d : v; },
    set(k, v) { localStorage.setItem(LS(k), String(v)); },
    num(k, d) { const v = parseFloat(this.get(k, d)); return isNaN(v) ? d : v; },
    bool(k, d) { return this.get(k, d ? '1' : '0') === '1'; }
  };

  const GREETINGS = ['hey', 'yo', 'okay', 'ok', 'hi', 'wake up', 'wakeup', 'wake-up'];
  const STOP_PHRASES = ["stop talking", "shut up", "be quiet", "stop it", "hush", "silence", "stop"];
  const SLEEP_PHRASES = ["go to sleep", "sleep now", "power down", "goodnight", "good night"];

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let wakeRec = null, convoRec = null, bargeRec = null;
  let voiceActive = false, awake = false, micMuted = false, listeningPaused = false;
  let speaking = false;

  // -------- fuzzy wake matching: multi-variant + levenshtein, never one exact phrase --------
  function levenshtein(a, b) {
    const m = a.length, n = b.length;
    const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++)
      for (let j = 1; j <= n; j++)
        dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    return dp[m][n];
  }
  const WAKE_PHRASES = [];
  for (const g of GREETINGS) for (const v of A.nameVariants) WAKE_PHRASES.push(`${g} ${v}`);
  for (const v of A.nameVariants) WAKE_PHRASES.push(`${v} wake up`);

  function wakeMatch(transcript) {
    if (!store.bool('wakeEnabled', true)) return false;
    const clean = transcript.toLowerCase().replace(/[^a-z\s-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!clean) return false;
    if (WAKE_PHRASES.some(p => clean.includes(p))) return true;
    // fuzzy: greeting word followed by something within edit distance of the name
    const maxDist = { strict: 0, normal: 1, loose: 2 }[store.get('wakeSensitivity', 'normal')] ?? 1;
    const words = clean.split(' ');
    const canonical = A.nameVariants[0];
    for (let i = 0; i < words.length; i++) {
      const isGreet = GREETINGS.includes(words[i]) || (words[i] === 'wake' && words[i + 1] === 'up');
      if (!isGreet) continue;
      const nextIdx = (words[i] === 'wake' && words[i + 1] === 'up') ? i + 2 : i + 1;
      const next = words[nextIdx];
      if (next && next.length >= 3 && levenshtein(next, canonical) <= maxDist) return true;
    }
    // bare-name wake — off by default, safe forms only, still fuzzy-checked
    if (store.bool('bareNameWake', false)) {
      for (const w of words) {
        if (A.bareNameSafe.includes(w)) return true;
        if (w.length >= canonical.length && levenshtein(w, canonical) <= Math.min(maxDist, 1)) return true;
      }
    }
    return false;
  }
  function matchesAny(t, list) { const c = t.toLowerCase().trim(); return list.some(p => c.includes(p)); }

  // -------- mic / clap shared audio graph --------
  let micCtx = null, micAnalyser = null, micData = null, micStream = null;
  async function ensureMicGraph() {
    if (micAnalyser) return true;
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { S.setVoiceStatus('Microphone permission denied.'); return false; }
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 512;
    micAnalyser.smoothingTimeConstant = 0;
    src.connect(micAnalyser);
    micData = new Uint8Array(micAnalyser.fftSize);
    startClapLoop();
    return true;
  }
  function instantVolume() {
    if (!micAnalyser) return 0;
    micAnalyser.getByteTimeDomainData(micData);
    let s = 0;
    for (let i = 0; i < micData.length; i++) { const n = (micData[i] - 128) / 128; s += n * n; }
    return Math.sqrt(s / micData.length);
  }

  // -------- double-clap wake (carried from the proven pre-ASGARD build) --------
  let clapBaseline = 0.02, clapFirst = 0, clapLastSpike = 0;
  const CLAP_MIN_GAP = 150, CLAP_MAX_GAP = 700;
  function startClapLoop() {
    function loop() {
      if (micAnalyser && voiceActive && !awake && !micMuted && !speaking &&
          store.bool('clapEnabled', true) && document.visibilityState === 'visible') {
        const vol = instantVolume();
        if (vol < clapBaseline * 1.5) clapBaseline = clapBaseline * 0.98 + vol * 0.02;
        const sens = store.num('clapSensitivity', 1); // 0.5 = needs louder claps, 2 = hair trigger
        const threshold = Math.max(0.14 / sens, (clapBaseline * 6) / sens);
        const now = Date.now();
        if (vol > threshold) {
          if (now - clapLastSpike >= CLAP_MIN_GAP) {
            if (clapFirst === 0) clapFirst = now;
            else if (now - clapFirst <= CLAP_MAX_GAP) { clapFirst = 0; clapLastSpike = now; triggerWake(); }
            else clapFirst = now;
            clapLastSpike = now;
          }
        } else if (clapFirst !== 0 && now - clapFirst > CLAP_MAX_GAP) clapFirst = 0;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  // -------- wake listening --------
  function startWakeListening() {
    if (!SR || !voiceActive || awake || micMuted) return;
    S.setState('sleeping');
    S.setMicState('listening');
    S.setVoiceStatus(`Say “Hey ${A.name.charAt(0) + A.name.slice(1).toLowerCase()}” — or double clap.`);
    wakeRec = new SR();
    wakeRec.continuous = true;
    wakeRec.interimResults = true;
    wakeRec.lang = 'en-US';
    wakeRec.maxAlternatives = 5;
    wakeRec.onresult = (event) => {
      if (awake || micMuted || document.visibilityState !== 'visible') return;
      for (let r = event.resultIndex; r < event.results.length; r++)
        for (let alt = 0; alt < event.results[r].length; alt++)
          if (wakeMatch(event.results[r][alt].transcript)) { triggerWake(); return; }
    };
    wakeRec.onend = () => { if (voiceActive && !awake && !micMuted) setTimeout(() => { try { startWakeListening(); } catch (e) {} }, 120); };
    wakeRec.onerror = () => { if (voiceActive && !awake && !micMuted) setTimeout(() => { try { startWakeListening(); } catch (e) {} }, 250); };
    try { wakeRec.start(); } catch (e) {}
  }

  function triggerWake() {
    if (awake || micMuted) return;
    awake = true;
    listeningPaused = true;
    if (wakeRec) { try { wakeRec.stop(); } catch (e) {} }
    S.setMicState('awake');
    S.setVoiceStatus(`${A.name} is waking…`);
    const greetingPromise = fetchWakeGreeting();
    S.wakeCinematic(() => {
      greetingPromise.then(greeting => {
        S.showAssistantText(greeting);
        speak(greeting, () => resumeListening());
      });
    });
  }

  async function fetchWakeGreeting() {
    const timeout = new Promise(res => setTimeout(() => res("Welcome back, sir."), 6500));
    const req = (async () => {
      try {
        const r = await fetch(BACKEND_URL, {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ assistant: A.id, message: A.wakeGreeting })
        });
        const d = await r.json();
        return d.reply || "Welcome back, sir.";
      } catch (e) { return "Welcome back, sir."; }
    })();
    return Promise.race([req, timeout]);
  }

  // -------- awake conversation loop --------
  function resumeListening() {
    listeningPaused = false;
    if (awake && !micMuted) {
      S.setMicState('awake');
      S.setState('listening');
      S.setVoiceStatus('Awake — your turn.');
      startConvoListening();
    }
  }
  function startConvoListening() {
    if (!SR || !awake || micMuted || listeningPaused) return;
    convoRec = new SR();
    convoRec.continuous = true;
    convoRec.interimResults = false;
    convoRec.lang = 'en-US';
    convoRec.onresult = (event) => {
      if (micMuted || listeningPaused) return;
      const last = event.results[event.results.length - 1];
      const transcript = last && last[0] ? last[0].transcript.trim() : '';
      if (!transcript) return;
      listeningPaused = true;
      S.setMicState('paused');
      try { convoRec.stop(); } catch (e) {}
      if (matchesAny(transcript, STOP_PHRASES)) { stopSpeaking(); resumeListening(); return; }
      if (matchesAny(transcript, SLEEP_PHRASES)) { Engine.sleep(); return; }
      sendMessage(transcript);
    };
    convoRec.onend = () => { if (awake && !micMuted && !listeningPaused) setTimeout(() => { if (awake && !micMuted && !listeningPaused) startConvoListening(); }, 120); };
    convoRec.onerror = () => { if (awake && !micMuted && !listeningPaused) setTimeout(() => { if (awake && !micMuted && !listeningPaused) startConvoListening(); }, 250); };
    try { convoRec.start(); } catch (e) {}
  }

  // -------- barge-in: while speaking, listen ONLY for stop phrases --------
  function startBargeListening() {
    if (!SR || micMuted) return;
    stopBargeListening();
    bargeRec = new SR();
    bargeRec.continuous = true;
    bargeRec.interimResults = true;
    bargeRec.lang = 'en-US';
    bargeRec.onresult = (event) => {
      if (!speaking) return;
      for (let r = event.resultIndex; r < event.results.length; r++) {
        if (matchesAny(event.results[r][0].transcript, STOP_PHRASES)) {
          stopSpeaking();
          resumeListening();
          return;
        }
      }
    };
    try { bargeRec.start(); } catch (e) {}
  }
  function stopBargeListening() { if (bargeRec) { try { bargeRec.onresult = null; bargeRec.stop(); } catch (e) {} bargeRec = null; } }

  // -------- chat turn --------
  async function sendMessage(text) {
    if (!text || !text.trim()) return;
    text = text.trim();
    if (S.onLocalCommand && S.onLocalCommand(text)) { resumeListening(); return; }
    S.showUserText(text);
    S.setState('thinking');
    S.setVoiceStatus(`${A.name} is thinking…`);
    try {
      const r = await fetch(BACKEND_URL, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ assistant: A.id, message: text })
      });
      const d = await r.json();
      const reply = d.reply || d.error || '(no reply)';
      S.showAssistantText(reply);
      speak(reply, () => { if (awake) resumeListening(); else { S.setState('sleeping'); S.setMicState(voiceActive ? 'listening' : null); } });
    } catch (err) {
      S.showAssistantText(`Connection error: ${err.message}`);
      S.setState(awake ? 'listening' : 'sleeping');
      if (awake) resumeListening();
    }
  }

  // -------- TTS: ElevenLabs via backend, tapped through an analyser --------
  let ttsCtx = null, ttsAnalyser = null, ttsData = null, currentSource = null, currentOnDone = null;
  let synthFallback = false;
  function getTtsCtx() {
    if (!ttsCtx) {
      ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
      ttsAnalyser = ttsCtx.createAnalyser();
      ttsAnalyser.fftSize = 256;
      ttsAnalyser.smoothingTimeConstant = 0.72;
      ttsAnalyser.connect(ttsCtx.destination); // must reach destination or audio is silent
      ttsData = new Uint8Array(128);
    }
    if (ttsCtx.state === 'suspended') ttsCtx.resume().catch(() => {});
    return ttsCtx;
  }
  function stopSpeaking() {
    if (currentSource) { try { currentSource.onended = null; currentSource.stop(); } catch (e) {} currentSource = null; }
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    speaking = false; synthFallback = false;
    stopBargeListening();
    currentOnDone = null;
  }
  function speak(text, onDone) {
    const cleaned = String(text).replace(/[*_#`]/g, '').trim();
    stopSpeaking();
    if (!cleaned) { if (onDone) onDone(); return; }
    speaking = true;
    S.setState('speaking');
    S.setVoiceStatus(`${A.name} is speaking — say "stop" to cut in.`);
    currentOnDone = onDone;
    startBargeListening();
    fetch(`${BACKEND_URL}/tts`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: cleaned, persona: A.id })
    })
      .then(res => { if (!res.ok) throw new Error('TTS ' + res.status); return res.arrayBuffer(); })
      .then(buf => getTtsCtx().decodeAudioData(buf))
      .then(audioBuffer => {
        if (!speaking) return; // barged before playback started
        const ctx = getTtsCtx();
        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.playbackRate.value = store.num('rate', 1);
        source.detune.value = store.num('pitch', 0) * 100;
        const gain = ctx.createGain();
        source.connect(gain);
        gain.connect(ttsAnalyser);
        const now = ctx.currentTime, fade = 0.02;
        const dur = audioBuffer.duration / source.playbackRate.value;
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(1, now + fade);
        if (dur > fade * 2) { gain.gain.setValueAtTime(1, now + dur - fade); gain.gain.linearRampToValueAtTime(0, now + dur); }
        currentSource = source;
        source.onended = () => {
          currentSource = null; speaking = false;
          stopBargeListening();
          const cb = currentOnDone; currentOnDone = null;
          if (cb) cb();
        };
        source.start(0);
      })
      .catch(err => {
        console.error('ElevenLabs TTS failed, browser voice fallback:', err);
        if (!speaking) return;
        if ('speechSynthesis' in window) {
          synthFallback = true;
          const u = new SpeechSynthesisUtterance(cleaned);
          u.rate = store.num('rate', 1);
          u.pitch = Math.max(0, Math.min(2, 1 + store.num('pitch', 0) / 12));
          const finish = () => {
            speaking = false; synthFallback = false;
            stopBargeListening();
            const cb = currentOnDone; currentOnDone = null;
            if (cb) cb();
          };
          u.onend = finish; u.onerror = finish;
          window.speechSynthesis.speak(u);
        } else {
          speaking = false;
          const cb = currentOnDone; currentOnDone = null;
          if (cb) cb();
        }
      });
  }

  // -------- levels the shell polls from its render loop (no engine rAF) --------
  function getAudioLevel() {
    if (speaking && synthFallback) return 0.25 + 0.35 * Math.abs(Math.sin(performance.now() / 170));
    if (!speaking || !ttsAnalyser || !currentSource) return 0;
    ttsAnalyser.getByteFrequencyData(ttsData);
    let sum = 0;
    for (let i = 2; i < 60; i++) sum += ttsData[i];
    return Math.min(1, (sum / 58) / 150);
  }
  function getMicLevel() {
    if (!awake || speaking || micMuted) return 0;
    return Math.min(1, instantVolume() * 6);
  }

  // -------- public engine API --------
  const Engine = {
    async startVoice() {
      if (!SR) { S.setVoiceStatus('Voice recognition unsupported here — try Chrome.'); return; }
      if (voiceActive) return;
      if (!(await ensureMicGraph())) return;
      voiceActive = true;
      startWakeListening();
    },
    wake() { if (voiceActive) triggerWake(); else this.startVoice().then(() => triggerWake()); },
    sleep() {
      const line = A.sleepLine;
      const finish = () => {
        awake = false; listeningPaused = false;
        if (convoRec) { try { convoRec.stop(); } catch (e) {} }
        S.setState('sleeping');
        if (voiceActive && !micMuted) startWakeListening(); else S.setMicState(null);
        S.setVoiceStatus(voiceActive ? `Asleep — “Hey ${A.name.charAt(0) + A.name.slice(1).toLowerCase()}” or double clap wakes me.` : 'Voice off.');
      };
      if (awake) { S.showAssistantText(line); speak(line, finish); } else finish();
    },
    toggleMute() {
      micMuted = !micMuted;
      if (micMuted) {
        if (wakeRec) { try { wakeRec.stop(); } catch (e) {} }
        if (convoRec) { try { convoRec.stop(); } catch (e) {} }
        stopBargeListening();
        S.setMicState('muted');
        S.setVoiceStatus('Mic muted.');
      } else {
        S.setMicState(awake ? 'awake' : 'listening');
        if (awake) { if (!listeningPaused && !speaking) startConvoListening(); } else if (voiceActive) startWakeListening();
        S.setVoiceStatus(awake ? 'Awake — your turn.' : 'Listening for the wake word.');
      }
      return micMuted;
    },
    // Push-to-talk: press = wake if needed + listen for one utterance
    pttDown() {
      if (micMuted) return;
      stopSpeaking();
      if (!awake) { awake = true; if (wakeRec) { try { wakeRec.stop(); } catch (e) {} } S.setState('listening'); }
      listeningPaused = false;
      S.setMicState('awake');
      S.setVoiceStatus('Push-to-talk — speak now.');
      if (!voiceActive) { voiceActive = true; ensureMicGraph(); }
      startConvoListening();
    },
    sendText(t) { stopSpeaking(); if (!awake) { awake = true; S.setState('listening'); } listeningPaused = true; sendMessage(t); },
    speak, stopSpeaking, getAudioLevel, getMicLevel,
    isAwake: () => awake, isSpeaking: () => speaking, isVoiceActive: () => voiceActive, isMuted: () => micMuted,
    store
  };
  window.Engine = Engine;
})();
/* ═══ ENGINE-END ═══ */


/* ═════════════════════════════════════════════════════════════════
   SHELL LOGIC — Loki's court
   ═════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(BACKEND_URL + path, opts).then(r => r.json());
const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });

(function () {
  const lock = $('lockScreen'), input = $('lockInput');
  if (sessionStorage.getItem('asgard:unlocked') === '1') { lock.classList.add('hidden'); }
  else setTimeout(() => input.focus(), 300);
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (input.value === UNLOCK_PASSWORD) { sessionStorage.setItem('asgard:unlocked', '1'); lock.classList.add('hidden'); }
    else { input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake'); input.value = ''; }
  });
})();

function handleLocalCommand(text) {
  const t = text.toLowerCase().trim();
  if (/^switch to thor$/.test(t)) { location.href = '/thor/'; return true; }
  if (/^switch to odin$/.test(t)) { location.href = '/odin/'; return true; }
  if (/^switch to loki$/.test(t)) return true;
  return false;
}

$('micBtn').addEventListener('click', () => Engine.startVoice());
$('sendBtn').addEventListener('click', () => { const v = $('userInput').value; if (v.trim()) { Engine.sendText(v); $('userInput').value = ''; } });

// ---- the ledger (todos with age-based nagging) ----
function ageOf(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return ['today', false];
  if (days === 1) return ['1 day', false];
  return [`${days} days`, days >= 3];
}
async function refreshTodos() {
  try {
    const todos = await api('/todos');
    const open = todos.filter(t => !t.done);
    const done = todos.filter(t => t.done).slice(-5);
    const el = $('todoList');
    if (!open.length) { el.innerHTML = '<div class="emptyState">Empty ledger. Suspicious… but fine.</div>'; }
    else {
      el.innerHTML = '';
      for (const t of open) {
        const row = document.createElement('div'); row.className = 'listRow';
        const chk = document.createElement('button'); chk.className = 'tinyBtn'; chk.textContent = '◻'; chk.title = 'Mark done';
        chk.addEventListener('click', async () => { await post('/todos', { action: 'complete', id: t.id }); refreshTodos(); });
        const span = document.createElement('span'); span.className = 'grow'; span.textContent = t.text;
        const [ageTxt, old] = ageOf(t.created);
        const age = document.createElement('span'); age.className = 'age' + (old ? ' old' : ''); age.textContent = old ? `${ageTxt} 👀` : ageTxt;
        const del = document.createElement('button'); del.className = 'tinyBtn danger'; del.textContent = '✕';
        del.addEventListener('click', async () => { await post('/todos', { action: 'delete', id: t.id }); refreshTodos(); });
        row.appendChild(chk); row.appendChild(span); row.appendChild(age); row.appendChild(del);
        el.appendChild(row);
      }
    }
    const dw = $('doneWrap');
    dw.innerHTML = done.length ? '<div class="muted" style="margin-bottom:3px;">Recently conquered:</div>' : '';
    for (const t of done) {
      const row = document.createElement('div'); row.className = 'listRow done';
      const undo = document.createElement('button'); undo.className = 'tinyBtn'; undo.textContent = '↩'; undo.title = 'Reopen';
      undo.addEventListener('click', async () => { await post('/todos', { action: 'reopen', id: t.id }); refreshTodos(); });
      const span = document.createElement('span'); span.className = 'grow'; span.textContent = t.text;
      row.appendChild(undo); row.appendChild(span); dw.appendChild(row);
    }
  } catch (e) { $('todoList').innerHTML = '<div class="emptyState">Backend unreachable.</div>'; }
}
$('todoAdd').addEventListener('click', async () => {
  const v = $('todoInput').value.trim(); if (!v) return;

});

let calYear, calMonth, calEvents = [], calSelected = null;
(function () { const n = new Date(); calYear = n.getFullYear(); calMonth = n.getMonth(); })();
async function loadEvents() {
  try { calEvents = await api('/calendar'); } catch (e) { calEvents = []; }
  renderCal();
}
function renderCal() {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('calTitle').textContent = `${MONTHS[calMonth]} ${calYear}`;
  const grid = $('calGrid'); grid.innerHTML = '';
  for (const d of ['S','M','T','W','T','F','S']) grid.insertAdjacentHTML('beforeend', `<div class="dow">${d}</div>`);
  const first = new Date(calYear, calMonth, 1);
  const todayIso = new Date().toLocaleDateString('sv');
  const startDow = first.getDay();
  const daysIn = new Date(calYear, calMonth + 1, 0).getDate();
  for (let i = 0; i < startDow; i++) grid.insertAdjacentHTML('beforeend', '<div></div>');
  for (let d = 1; d <= daysIn; d++) {
    const iso = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const el = document.createElement('div');
    el.className = 'calDay' + (iso === todayIso ? ' today' : '') + (calEvents.some(e => e.date === iso) ? ' hasEv' : '') + (iso === calSelected ? ' sel' : '');
    el.textContent = d;
    el.addEventListener('click', () => { calSelected = calSelected === iso ? null : iso; $('evDate').value = iso; renderCal(); });
    grid.appendChild(el);
  }
  const todayStr = new Date().toLocaleDateString('sv');
  const shown = calSelected
    ? calEvents.filter(e => e.date === calSelected)
    : calEvents.filter(e => e.date >= todayStr).slice(0, 6);
  const list = $('evList');
  list.innerHTML = shown.length ? '' : `<div class="emptyState">${calSelected ? 'Nothing that day.' : 'Nothing coming up. A blank page — how unlike you.'}</div>`;
  for (const e of shown) {
    const row = document.createElement('div'); row.className = 'evRow';
    row.innerHTML = `<span class="evWhen">${e.date.slice(5)}${e.time ? ' ' + e.time : ''}</span><span class="grow">${e.title.replace(/</g, '&lt;')}</span>`;
    const del = document.createElement('button'); del.className = 'tinyBtn danger'; del.textContent = '✕';
    del.addEventListener('click', async () => { await post('/calendar', { action: 'remove', id: e.id }); loadEvents(); });
    row.appendChild(del); list.appendChild(row);
  }
}

// Per-tool permission levels (auto / notify / confirm / off) — backend-enforced.
function appendPermissionsEditor(s) {
  const wrap = document.createElement('div');
  wrap.innerHTML = '<h3 style="margin-top:18px;">🔐 Tool Permissions</h3><div class="muted">Loading…</div>';
  s.appendChild(wrap);
  api('/permissions/all').then(d => {
    wrap.innerHTML = '<h3 style="margin-top:18px;">🔐 Tool Permissions</h3><div class="muted" style="margin-bottom:6px;">auto = just do it · notify = do it and tell you · confirm = ask first · off = disabled</div>';
    for (const t of d.tools) {
      const sel = document.createElement('select');
      for (const lv of ['auto', 'notify', 'confirm', 'off']) { const o = document.createElement('option'); o.value = lv; o.textContent = lv; sel.appendChild(o); }
      sel.value = t.level;
      if (t.hardConfirm) [...sel.options].forEach(o => { if (o.value === 'auto' || o.value === 'notify') o.disabled = true; });
      sel.addEventListener('change', () => post('/permissions', { tool: t.tool, level: sel.value }));
      wrap.appendChild(setRow(`${t.tool}${t.hardConfirm ? '<span class="hint">sends real messages — hardwired to confirm, can only be switched off</span>' : ''}`, sel));
    }
  }).catch(() => { wrap.innerHTML += '<div class="emptyState">Backend unreachable.</div>'; });
}

// tapered horn along a curve — rings of decreasing radius
function taperedHorn(curve, r0, r1, segs, radial, mat) {
  const pts = curve.getPoints(segs);
  const frames = curve.computeFrenetFrames(segs, false);
  const positions = [], indices = [], normals = [];
  for (let i = 0; i <= segs; i++) {
    const r = r0 + (r1 - r0) * (i / segs);
    const p = pts[i], N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j < radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const nx = Math.cos(a) * N.x + Math.sin(a) * B.x;
      const ny = Math.cos(a) * N.y + Math.sin(a) * B.y;
      const nz = Math.cos(a) * N.z + Math.sin(a) * B.z;
      positions.push(p.x + nx * r, p.y + ny * r, p.z + nz * r);
      normals.push(nx, ny, nz);
    }
  }
  for (let i = 0; i < segs; i++)
    for (let j = 0; j < radial; j++) {
      const a = i * radial + j, b = i * radial + (j + 1) % radial;
      const c = (i + 1) * radial + (j + 1) % radial, d = (i + 1) * radial + j;
      indices.push(a, b, d, b, c, d);
    }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setIndex(indices);
  return new THREE.Mesh(geo, mat);
}

// ---- the jester ----
const jester = new THREE.Group();

// head + mask face
const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 1), emerald);
head.scale.set(1, 1.12, 0.95);
jester.add(head);
// front-facing white mask: phi window centered on +z (phi = π/2)
const mask = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14, Math.PI / 2 - Math.PI / 2.6, Math.PI / 1.3, Math.PI / 4.6, Math.PI / 2.1), maskMat);
mask.position.z = 0.13; mask.scale.set(1, 1.14, 0.95);
jester.add(mask);
// eyes — mischievous slanted slits
for (const sx of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.05, 0.04), eyeMat);
  eye.position.set(sx * 0.22, 0.16, 0.62);
  eye.rotation.z = sx * -0.35;
  jester.add(eye);
}
// grin — thin curved torus slice
const grin = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.028, 8, 20, Math.PI * 0.75), emeraldDark);
grin.position.set(0, -0.08, 0.6); grin.rotation.z = Math.PI + Math.PI * 0.125;
jester.add(grin);

// hat base — snug cap
const cap = new THREE.Mesh(new THREE.SphereGeometry(0.65, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2.4), emeraldDark);
cap.position.y = 0.28; cap.scale.set(1.02, 1, 0.97);
jester.add(cap);
const band = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.05, 8, 24), goldMat);
band.rotation.x = Math.PI / 2; band.position.y = 0.34;
jester.add(band);

// two big curved horns + a back horn, bells on the tips
const hornDefs = [
  { pts: [[0.25, 0.62, 0], [0.85, 1.05, 0.05], [1.28, 0.85, 0.1], [1.45, 0.42, 0.12]], r0: 0.2 },
  { pts: [[-0.25, 0.62, 0], [-0.85, 1.05, 0.05], [-1.28, 0.85, 0.1], [-1.45, 0.42, 0.12]], r0: 0.2 },
  { pts: [[0, 0.68, -0.2], [0.05, 1.2, -0.7], [0.02, 1.05, -1.15]], r0: 0.17 }
];
const bells = [];
for (const def of hornDefs) {
  const curve = new THREE.CatmullRomCurve3(def.pts.map(p => new THREE.Vector3(...p)));
  jester.add(taperedHorn(curve, def.r0, 0.035, 14, 9, emerald));
  const tip = def.pts[def.pts.length - 1];
  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), bellMat);
  bell.position.set(...tip);
  jester.add(bell); bells.push(bell);
}

// collar ruff — alternating emerald/gold cones
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2;
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.42, 6), i % 2 ? goldMat : emeraldDark);
  spike.position.set(Math.cos(a) * 0.5, -0.72, Math.sin(a) * 0.5);
  spike.rotation.z = Math.PI + Math.atan2(Math.cos(a), 0) * 0.55;
  spike.rotation.x = -Math.sin(a) * 0.55;
  jester.add(spike);
}
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.3, 0.5, 10), emeraldDark);
neck.position.y = -0.85; jester.add(neck);

jester.position.y = 1.0;
scene.add(jester);

// backdrop glow
function glowSprite(colorInner, colorOuter) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 10, 128, 128, 128);
  g.addColorStop(0, colorInner); g.addColorStop(0.55, colorOuter); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  return new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending }));
}
const backGlow = glowSprite('rgba(46,190,110,0.5)', 'rgba(20,90,60,0.16)');
backGlow.scale.setScalar(9);
backGlow.position.set(0, 1.0, -2.5);
scene.add(backGlow);

// ---- shards for the shatter/reassemble cinematic ----
// Home points sampled from the assembled jester's vertex positions.
const homePts = [];
jester.updateMatrixWorld(true);
jester.traverse(o => {
  if (!o.isMesh) return;
  const pos = o.geometry.attributes.position;
  const step = Math.max(1, Math.floor(pos.count / 30));
  for (let i = 0; i < pos.count; i += step) {
    const v = new THREE.Vector3().fromBufferAttribute(pos, i);
    o.localToWorld(v);
    homePts.push(v);
  }
});
const SHARDS = Math.min(homePts.length, Math.floor(230 * fxLevel));
const shardGeo = new THREE.TetrahedronGeometry(0.055);
const shardMat = new THREE.MeshStandardMaterial({ color: 0x2ebe6e, metalness: 0.7, roughness: 0.25, emissive: 0x4aa8ff, emissiveIntensity: 0.6 });
const shards = new THREE.InstancedMesh(shardGeo, shardMat, SHARDS);
shards.visible = false;
scene.add(shards);
const shardData = [];
for (let i = 0; i < SHARDS; i++) {
  const home = homePts[Math.floor(Math.random() * homePts.length)].clone();
  const dir = home.clone().sub(new THREE.Vector3(0, 1.0, 0)).normalize().add(new THREE.Vector3((Math.random() - 0.5), (Math.random() - 0.5), (Math.random() - 0.5))).normalize();
  shardData.push({ home, dir, dist: 1.4 + Math.random() * 2.4, spin: Math.random() * 8, seed: Math.random() * Math.PI * 2 });
}
const dummy = new THREE.Object3D();

// the incoming blast comet
const comet = glowSprite('rgba(190,225,255,0.95)', 'rgba(74,168,255,0.4)');
comet.scale.setScalar(1.4);
comet.visible = false;
scene.add(comet);
const cometLight = new THREE.PointLight(0x4aa8ff, 0, 18);
scene.add(cometLight);

// ---- bloom ----
let composer = null, bloomPass = null;
if (!lite) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.5, 0.7, 0.55);
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());
}

// ---- states ----
const STATES = {
  sleeping: { rot: 0.05, bob: 0.04, sway: 0.02, eye: 0.1, bell: 0.03, bloom: 0.28, exposure: 0.8 },
  listening: { rot: 0.25, bob: 0.09, sway: 0.09, eye: 0.7, bell: 0.15, bloom: 0.6, exposure: 1.0 },
  thinking: { rot: 1.8, bob: 0.12, sway: 0.16, eye: 1.2, bell: 0.3, bloom: 0.75, exposure: 1.05 },
  speaking: { rot: 0.35, bob: 0.09, sway: 0.12, eye: 0.9, bell: 0.4, bloom: 0.7, exposure: 1.05 }
};
let stateName = 'sleeping';
let cur = { ...STATES.sleeping };
let cinematic = null;

window.Scene = {
  setState(s) {
    const map = { idle: 'sleeping', talking: 'speaking' };
    stateName = STATES[s] ? s : (map[s] || 'sleeping');
  },
  // Blue blast strikes the jester → shards + glow particles explode outward →
  // pull back together → reassembled and awake. Eased both ways, no popping.
  wakeCinematic(done) {
    cinematic = { phase: 'comet', t: 0, done, wallStart: performance.now() };
    comet.visible = true;
    comet.position.set(-7, 4.6, 1.5);
  }
};

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  if (document.hidden) { last = now; return; }
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;

  const audio = window.Engine ? window.Engine.getAudioLevel() : 0;
  const mic = window.Engine ? window.Engine.getMicLevel() : 0;

  const target = STATES[stateName];
  for (const k of Object.keys(cur)) cur[k] += (target[k] - cur[k]) * Math.min(1, dt * 2.4);

  // ---- cinematic phases ----
  if (cinematic) {
    cinematic.t += dt;
    const hardStop = now - cinematic.wallStart > 5000;
    if (cinematic.phase === 'comet') {
      const p = Math.min(1, cinematic.t / 0.5);
      comet.position.lerpVectors(new THREE.Vector3(-7, 4.6, 1.5), new THREE.Vector3(0, 1.0, 0.2), easeOutCubic(p) * 0.98 + p * 0.02);
      cometLight.position.copy(comet.position);
      cometLight.intensity = 8 + p * 30;
      if (p >= 1 || hardStop) {
        cinematic.phase = 'explode'; cinematic.t = 0;
        comet.visible = false;
        jester.visible = false;
        shards.visible = true;
      }
    } else if (cinematic.phase === 'explode') {
      const p = Math.min(1, cinematic.t / 0.8);
      const e = easeOutCubic(p);
      cometLight.intensity = 40 * (1 - p);
      for (let i = 0; i < SHARDS; i++) {
        const d = shardData[i];
        dummy.position.copy(d.home).addScaledVector(d.dir, e * d.dist);
        dummy.rotation.set(d.spin * e * 3 + d.seed, d.seed, d.spin * e * 2);
        const sc = 1 - e * 0.25;
        dummy.scale.setScalar(sc);
        dummy.updateMatrix();
        shards.setMatrixAt(i, dummy.matrix);
      }
      shards.instanceMatrix.needsUpdate = true;
      if ((p >= 1 && cinematic.t > 1.1) || hardStop) { cinematic.phase = 'reassemble'; cinematic.t = 0; }
    } else if (cinematic.phase === 'reassemble') {
      const p = Math.min(1, cinematic.t / 1.0);
      const e = 1 - easeInOutCubic(p); // 1 → 0: distance collapses home
      for (let i = 0; i < SHARDS; i++) {
        const d = shardData[i];
        dummy.position.copy(d.home).addScaledVector(d.dir, e * d.dist);
        dummy.rotation.set(d.spin * e * 3 + d.seed, d.seed, d.spin * e * 2);
        dummy.scale.setScalar(0.75 + (1 - e) * 0.25);
        dummy.updateMatrix();
        shards.setMatrixAt(i, dummy.matrix);
      }
      shards.instanceMatrix.needsUpdate = true;
      if (p >= 1 || hardStop) {
        cinematic.phase = 'settle'; cinematic.t = 0;
        shards.visible = false;
        jester.visible = true;
        eyeMat.emissiveIntensity = 2.2;
      }
    } else if (cinematic.phase === 'settle') {
      if (cinematic.t > 0.35 || hardStop) {
        const cb = cinematic.done; cinematic = null;
        stateName = 'listening';
        if (cb) cb();
      }
    }
  }

  // ---- idle motion: playful sway, tilt, bell jingle ----
  jester.rotation.y += dt * cur.rot * (1 + mic * 1.2);
  jester.rotation.z = Math.sin(t * 1.7) * cur.sway;
  jester.rotation.x = Math.cos(t * 1.3) * cur.sway * 0.6;
  jester.position.y = 1.0 + Math.sin(t * 1.2) * cur.bob;
  const jingle = cur.bell * (1 + audio * 2.5);
  bells.forEach((b, i) => { b.position.y = hornDefs[i].pts[hornDefs[i].pts.length - 1][1] + Math.sin(t * 6 + i * 2) * 0.03 * jingle * 10; });
  bellMat.emissiveIntensity = 0.05 + audio * 0.9 + cur.bell;
  const pulse = stateName === 'thinking' ? 0.4 * Math.sin(t * 8) : 0;
  eyeMat.emissiveIntensity += ((cur.eye + pulse + audio * 1.4 + mic * 0.6) - eyeMat.emissiveIntensity) * Math.min(1, dt * 4);
  rimLight.intensity = 8 + cur.eye * 8 + audio * 18;
  backGlow.material.opacity = 0.18 + cur.eye * 0.3 + audio * 0.25;
  renderer.toneMappingExposure = cur.exposure + audio * 0.12;

  if (composer && bloomPass) {
    bloomPass.strength = (cur.bloom + audio * 0.45 + (cinematic ? 0.6 : 0)) * fxLevel;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
}
requestAnimationFrame(loop);
</script>
</body>
</html>
