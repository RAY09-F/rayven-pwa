<!doctype html><!-- Local configuration and diagnostics. --><html lang="en"><meta charset="utf-8"><title>Asgard setup</title><link rel="stylesheet" href="style.css"><body><h1>ASGARD / SETUP</h1><p>The Windows companion listens independently of Chrome. No microphone permission is needed here.</p><label for="token">Local pairing token (from C:\Asgard\companion\secrets.json, local_token)</label><input id="token" type="password" autocomplete="off"><button id="pair">Pair locally</button><label for="sensitivity">Sensitivity (0.1–0.9)</label><input id="sensitivity" type="number" min="0.1" max="0.9" step="0.1" value="0.5"><label for="command_window">Bare-name listening window (2–6 seconds)</label><input id="command_window" type="number" min="2" max="6" value="6"><label for="clip_seconds">Replay length (15–120 seconds)</label><input id="clip_seconds" type="number" min="15" max="120" value="30"><button id="save">Save settings</button><hr><button data-op="status">Refresh status</button><button data-op="worker">Test Worker</button><button data-op="chime">Test chime</button><button data-op="voice">Test voice</button><button data-op="clip">Save a replay clip</button><p id="error" role="status"></p><pre id="result">Not connected.</pre><h2>Recent voice events</h2><pre id="events"></pre><script src="options.js"></script></body></html>
